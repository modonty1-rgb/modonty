<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>وثائق مدونتي</title>

<style>
  :root{ --bg:#f6f8fb; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb; --brand:#1e58c8; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0b1220; --card:#111c30; --ink:#e6edf7; --muted:#94a3b8; --line:#1e2d47; --brand:#5b8cf0; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif}
  .shell{display:grid;grid-template-columns:290px 1fr;height:100vh}
  aside{background:var(--card);border-inline-start:1px solid var(--line);overflow-y:auto;padding:20px 16px}
  aside h1{font-size:19px;margin:0 0 4px}
  aside .sub{font-size:12.5px;color:var(--muted);margin:0 0 20px;line-height:1.6}
  .grp{margin-bottom:22px}
  .grp-t{font-size:12px;font-weight:900;color:var(--brand);letter-spacing:.02em;margin-bottom:2px}
  .grp-h{font-size:11.5px;color:var(--muted);margin-bottom:9px}
  .item{display:block;width:100%;text-align:start;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 11px;cursor:pointer;font-family:inherit;color:inherit;margin-bottom:4px}

  .item[aria-current="true"]{background:rgba(30,88,200,.10);border-color:var(--brand)}
  .item .nm{display:block;font-size:14.5px;font-weight:700;line-height:1.4}
  .item .wh{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
  .item .kb{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  main{position:relative;overflow:hidden}
  iframe{width:100%;height:100%;border:0;background:#fff}
  @media (prefers-color-scheme: dark){ iframe{background:#0b1220} }
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:32px;color:var(--muted);font-size:15px}
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside{border-inline-start:0;border-block-end:1px solid var(--line);max-height:44vh}
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <h1>وثائق مدونتي</h1>

          <span class="nm">نظام التصميم</span>

        </button>

  </aside>

</div>
<script>
const DOCS = {"terms":"<!doctype html>\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>الشروط والأحكام — مدوّنتي (نسخة للمراجعة + للصق في DB)</title>\n<style>\n  :root{--ink:#1a2233;--dim:#5b6472;--line:#e3e7ee;--brand:#0f766e;--panel:#f7f9fc;--amber:#b45309}\n  *{box-sizing:border-box}\n  body{font-family:\"Tajawal\",\"Segoe UI\",system-ui,sans-serif;color:var(--ink);background:#eef1f6;margin:0;padding:24px;line-height:1.9}\n  .wrap{max-width:820px;margin:0 auto}\n  .banner{background:#fff7ed;border:1px solid #fed7aa;color:var(--amber);border-radius:12px;padding:14px 16px;font-size:13.5px;margin-bottom:18px}\n  .banner b{color:#92400e}\n  .hint{background:#ecfdf5;border:1px dashed var(--brand);color:#065f46;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}\n  #db-content{background:#fff;border:2px dashed var(--brand);border-radius:14px;padding:26px 30px;box-shadow:0 12px 30px -18px rgba(15,118,110,.4)}\n  #db-content h2{font-size:19px;margin:26px 0 8px;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:6px}\n  #db-content h2:first-child{margin-top:0}\n  #db-content p{margin:8px 0;color:#26303f}\n  #db-content ul{margin:8px 0;padding-inline-start:22px}\n  #db-content li{margin:5px 0}\n  #db-content strong{color:var(--ink)}\n  .meta{font-size:12.5px;color:var(--dim);margin:2px 0 18px}\n  code{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;direction:ltr;display:inline-block}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <div class=\"banner\">\n    <b>⚠️ للاعتماد النهائي:</b> هذه صياغة مبنية على أفضل الممارسات لنموذج الدليل/الوسيط + نظام حماية البيانات الشخصية السعودي، ويُفضَّل مراجعتها من محامٍ سعودي مرخّص قبل النشر — خصوصاً بند المحتوى الطبّي (YMYL).\n  </div>\n  <div class=\"hint\">\n    📋 <b>للصقّ في قاعدة البيانات:</b> انسخ كل ما بداخل الإطار المنقّط أدناه إلى حقل <code>content</code> في سجلّ <code>modonty</code> حيث <code>slug = \"terms\"</code>. العنوان الرئيسي (<code>title</code>) يُدار كحقل منفصل — لا تُدرجه هنا.\n  </div>\n\n  <div id=\"db-content\" dir=\"rtl\">\n    <p>مرحباً بك في «مدوّنتي». تحكم هذه الشروط والأحكام استخدامك للمنصّة وكل خدماتها. باستخدامك للمنصّة فإنك تُقِرّ بأنك قرأت هذه الشروط وفهمتها ووافقت عليها. إذا لم توافق على أي بند منها، يُرجى التوقّف عن استخدام المنصّة.</p>\n\n    <h2>1. طبيعة المنصّة — مَن نحن ومَن لسنا</h2>\n    <p>«مدوّنتي» منصّة تعريفية ودليل رقمي يعرض محتوى ومعلومات عن جهات ومقدّمي خدمات مستقلّين (نشير إليهم بـ«الشركاء» أو «مقدّم الخدمة»). دورنا هو إبراز هذه الجهات وتوثيق محتواها وتسهيل وصول الزائر إليها.</p>\n    <p><strong>«مدوّنتي» ليست مقدّم الخدمة</strong>، ولا تقدّم بنفسها أي خدمة طبية أو قانونية أو استشارية أو تجارية من الخدمات المعروضة على المنصّة. كل خدمة تُطلب أو تُقدَّم تكون بين الزائر ومقدّم الخدمة مباشرةً، ولسنا طرفاً في أي اتفاق أو تعامل بينهما.</p>\n\n    <h2>2. تعريفات</h2>\n    <ul>\n      <li><strong>المنصّة:</strong> موقع «مدوّنتي» وكل صفحاته وخدماته.</li>\n      <li><strong>مقدّم الخدمة / الشريك:</strong> الجهة المستقلّة المعروضة على المنصّة (عيادة، مكتب، متجر، مختصّ… إلخ).</li>\n      <li><strong>الزائر:</strong> أي شخص يستخدم المنصّة أو يتواصل عبرها مع مقدّم خدمة.</li>\n      <li><strong>الطلب:</strong> أي طلب حجز أو تواصل يرسله الزائر عبر المنصّة (نموذج «اترك رقمك» أو زرّ واتساب).</li>\n    </ul>\n\n    <h2>3. العلاقة بين الأطراف وإخلاء المسؤولية</h2>\n    <p>العلاقة التعاقدية والخدمية تنشأ حصراً بين الزائر ومقدّم الخدمة. وبناءً عليه:</p>\n    <ul>\n      <li>لا نضمن توفّر مقدّم الخدمة، ولا سعره، ولا جودة خدمته، ولا نتيجتها، ولا التزامه بأي موعد أو وعد.</li>\n      <li>لا نراقب ولا نتوسّط في أي تعامل يتم بين الزائر ومقدّم الخدمة، وأي اتفاق بينهما يقع على مسؤوليتهما وحدهما.</li>\n      <li>المعلومات المعروضة عن مقدّمي الخدمة (بما فيها الأوصاف والصور والادعاءات) هي من مسؤولية مقدّم الخدمة نفسه، ولا نتحمّل مسؤولية دقّتها أو صحّتها.</li>\n      <li>استخدامك للمنصّة وتواصلك مع مقدّمي الخدمة يقع على مسؤوليتك الشخصية.</li>\n    </ul>\n\n    <h2>4. الحجز ونقل الطلب</h2>\n    <p>عند تركك رقمك في نموذج الحجز أو ضغطك على زرّ واتساب، فإن دور «مدوّنتي» ينحصر في <strong>نقل طلبك أو تعريف مقدّم الخدمة بك</strong>. بعد ذلك يتولّى مقدّم الخدمة التواصل معك وتحديد الموعد وتأكيده وتقديم الخدمة.</p>\n    <ul>\n      <li>إرسال الطلب لا يعني تأكيد الحجز؛ التأكيد يصدر من مقدّم الخدمة وحده.</li>\n      <li>لا نضمن ردّ مقدّم الخدمة عليك ولا سرعة ردّه ولا توفّر الموعد.</li>\n      <li>ينتهي دورنا عند إيصال طلبك لمقدّم الخدمة؛ وما بعد ذلك من تواصل وخدمة يقع بينكما مباشرة.</li>\n    </ul>\n\n    <h2>5. المحتوى التعريفي — تنبيه مهم (طبّي / قانوني / مالي)</h2>\n    <p>قد يتضمّن المحتوى المعروض على المنصّة مواضيع طبية أو قانونية أو مالية أو ما شابهها. هذا المحتوى <strong>لأغراض تعريفية وتثقيفية عامة فقط</strong>، وليس بديلاً عن استشارة مختصّ مرخّص:</p>\n    <ul>\n      <li>لا يُعدّ المحتوى نصيحة طبية أو تشخيصاً أو وصفة علاجية، ولا استشارة قانونية أو مالية.</li>\n      <li>لا تتّخذ أي قرار يخصّ صحّتك أو أمورك القانونية أو المالية بناءً على المحتوى وحده؛ راجع مختصّاً مرخّصاً أولاً.</li>\n      <li>مقدّم الخدمة وحده مسؤول عن صحّة ادعاءاته ومؤهّلاته وتراخيصه.</li>\n    </ul>\n\n    <h2>6. التزامات الزائر</h2>\n    <ul>\n      <li>تقديم بيانات صحيحة عند الحجز أو التواصل.</li>\n      <li>استخدام المنصّة للأغراض المشروعة فقط، وبما لا يخالف الأنظمة المعمول بها في المملكة العربية السعودية.</li>\n      <li>عدم إساءة استخدام قنوات التواصل أو إزعاج مقدّمي الخدمة.</li>\n    </ul>\n\n    <h2>7. الملكية الفكرية</h2>\n    <p>جميع عناصر المنصّة — من تصميم وشعار ونصوص وترتيب — مملوكة لـ«مدوّنتي» أو مرخّصة لها ومحميّة بموجب أنظمة حقوق الملكية الفكرية. لا يجوز نسخها أو إعادة نشرها أو تعديلها دون إذن كتابي مسبق. ويبقى المحتوى الخاص بكل مقدّم خدمة منسوباً إليه.</p>\n\n    <h2>8. حدود المسؤولية</h2>\n    <p>إلى الحدّ الذي تسمح به الأنظمة، لا تتحمّل «مدوّنتي» أي مسؤولية عن أضرار مباشرة أو غير مباشرة تنشأ عن: خدمة قدّمها مقدّم الخدمة، أو تعامل بينك وبينه، أو اعتمادك على محتوى معروض على المنصّة، أو تعذّر الوصول للمنصّة. وتوافق على عدم تحميلنا أي تبعات ناتجة عن علاقتك بمقدّم الخدمة.</p>\n\n    <h2>9. الخصوصية وحماية البيانات</h2>\n    <p>يخضع جمع بياناتك واستخدامها لـ<strong>سياسة الخصوصية</strong> الخاصة بنا، والمتوافقة مع نظام حماية البيانات الشخصية في المملكة. باستخدامك للمنصّة فإنك تُقِرّ بموافقتك على تلك السياسة.</p>\n\n    <h2>10. تعديل الشروط</h2>\n    <p>يجوز لنا تحديث هذه الشروط من وقت لآخر. يسري التحديث فور نشره على هذه الصفحة، ويُعدّ استمرارك في استخدام المنصّة قبولاً بالنسخة المحدّثة. يُرجى مراجعة هذه الصفحة دورياً.</p>\n\n    <h2>11. النظام الواجب التطبيق والاختصاص</h2>\n    <p>تخضع هذه الشروط وتُفسَّر وفقاً لأنظمة المملكة العربية السعودية، وتختصّ الجهات القضائية المختصّة في المملكة بالنظر في أي نزاع ينشأ عنها.</p>\n\n    <h2>12. التواصل</h2>\n    <p>لأي استفسار حول هذه الشروط، تواصل معنا عبر صفحة «اتصل بنا» في المنصّة، أو على البريد الرسمي <strong>modonty@modonty.com</strong>.</p>\n  </div>\n</div>\n</body>\n</html>\n","privacy":"<!doctype html>\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>سياسة الخصوصية — مدوّنتي (نسخة للمراجعة + للصق في DB)</title>\n<style>\n  :root{--ink:#1a2233;--dim:#5b6472;--line:#e3e7ee;--brand:#0f766e;--panel:#f7f9fc;--amber:#b45309}\n  *{box-sizing:border-box}\n  body{font-family:\"Tajawal\",\"Segoe UI\",system-ui,sans-serif;color:var(--ink);background:#eef1f6;margin:0;padding:24px;line-height:1.9}\n  .wrap{max-width:820px;margin:0 auto}\n  .banner{background:#fff7ed;border:1px solid #fed7aa;color:var(--amber);border-radius:12px;padding:14px 16px;font-size:13.5px;margin-bottom:18px}\n  .banner b{color:#92400e}\n  .hint{background:#ecfdf5;border:1px dashed var(--brand);color:#065f46;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}\n  #db-content{background:#fff;border:2px dashed var(--brand);border-radius:14px;padding:26px 30px;box-shadow:0 12px 30px -18px rgba(15,118,110,.4)}\n  #db-content h2{font-size:19px;margin:26px 0 8px;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:6px}\n  #db-content h2:first-child{margin-top:0}\n  #db-content p{margin:8px 0;color:#26303f}\n  #db-content ul{margin:8px 0;padding-inline-start:22px}\n  #db-content li{margin:5px 0}\n  #db-content strong{color:var(--ink)}\n  code{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;direction:ltr;display:inline-block}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <div class=\"banner\">\n    <b>⚠️ للاعتماد النهائي:</b> صياغة مبنية على نظام حماية البيانات الشخصية السعودي (المرسوم الملكي م/19 — الجهة المشرفة SDAIA) وأفضل الممارسات، ويُفضَّل مراجعتها من محامٍ سعودي مرخّص قبل النشر.\n  </div>\n  <div class=\"hint\">\n    📋 <b>للصقّ في قاعدة البيانات:</b> انسخ كل ما بداخل الإطار المنقّط أدناه إلى حقل <code>content</code> في سجلّ <code>modonty</code> حيث <code>slug = \"privacy-policy\"</code>. العنوان الرئيسي (<code>title</code>) حقل منفصل.\n  </div>\n\n  <div id=\"db-content\" dir=\"rtl\">\n    <p>تحرص «مدوّنتي» على حماية خصوصيتك. توضّح هذه السياسة ما نجمعه من بيانات، وكيف نستخدمه ونحفظه ونشاركه ونُتلفه، وحقوقك تجاهه، وذلك بما يتوافق مع نظام حماية البيانات الشخصية في المملكة العربية السعودية.</p>\n\n    <h2>1. جهة التحكّم في البيانات</h2>\n    <p>جهة التحكّم هي «مدوّنتي». للتواصل بخصوص خصوصية بياناتك: عبر صفحة «اتصل بنا»، أو البريد <strong>modonty@modonty.com</strong>. العنوان: جدة — حي البغدادية الشرقية — الرمز البريدي 22235 — المملكة العربية السعودية.</p>\n\n    <h2>2. الأساس النظامي للمعالجة</h2>\n    <p>نعالج بياناتك استناداً إلى موافقتك عند إرسال طلب حجز أو تواصل، وإلى مصلحتنا المشروعة في تشغيل المنصّة وتحسينها، وبما يتوافق مع نظام حماية البيانات الشخصية ولائحته التنفيذية.</p>\n\n    <h2>3. البيانات التي نجمعها</h2>\n    <ul>\n      <li><strong>عند الحجز عبر نموذج «اترك رقمك»:</strong> رقم جوالك (إلزامي)، وإن أضفتها اختيارياً: اسمك، بريدك، وملاحظة/وقت تفضّله.</li>\n      <li><strong>عند التواصل عبر زرّ واتساب:</strong> لا نحفظ رقمك ولا محتوى محادثتك — تجري المحادثة على واتساب مباشرة مع مقدّم الخدمة. نسجّل فقط أنك بدأت تواصلاً (كإثبات إحالة)، مع بلد/مدينة تقريبية ومعرّف زيارة مجهول لأغراض إحصائية.</li>\n      <li><strong>بيانات تقنية:</strong> عنوان الـ IP، نوع المتصفّح والجهاز، وبيانات استخدام عبر أدوات التحليلات (Google Analytics)، وملفات تعريف الارتباط.</li>\n    </ul>\n\n    <h2>4. الغرض من جمع البيانات</h2>\n    <ul>\n      <li>نقل طلب الحجز أو التعريف بك إلى مقدّم الخدمة الذي اخترته.</li>\n      <li>تمكين مقدّم الخدمة من التواصل معك وتحديد الموعد.</li>\n      <li>تشغيل المنصّة وتحسين تجربتها وقياس أدائها.</li>\n      <li>الأمن ومنع الاستخدام المسيء.</li>\n    </ul>\n\n    <h2>5. طريقة جمع البيانات</h2>\n    <p>نجمع البيانات مباشرةً منك عند تعبئة نموذج الحجز أو التفاعل مع أزرار التواصل، وتلقائياً عبر أدوات التحليلات وملفات تعريف الارتباط أثناء تصفّحك.</p>\n\n    <h2>6. مشاركة البيانات</h2>\n    <ul>\n      <li><strong>مع مقدّم الخدمة المعني فقط:</strong> يُشارَك طلب الحجز مع مقدّم الخدمة الذي وجّهت له طلبك، لغرض التواصل معك.</li>\n      <li><strong>مع مزوّدي خدمات تقنية:</strong> كخدمات الاستضافة والتحليلات والبريد، بالقدر اللازم لتشغيل المنصّة، وبالتزامهم بالسرية.</li>\n      <li><strong>لا نبيع بياناتك</strong> ولا نشاركها لأغراض تسويقية مع أطراف خارجية.</li>\n      <li>قد نفصح عنها إذا تطلّب ذلك نظامٌ أو جهةٌ مختصّة.</li>\n    </ul>\n\n    <h2>7. تخزين البيانات ومدّة الاحتفاظ</h2>\n    <p>تُخزَّن البيانات على خوادم آمنة. ونحتفظ ببيانات طلبات الحجز للمدّة اللازمة لخدمة الغرض الذي جُمعت من أجله، ثم تُتلَف أو تُجهَّل عند انتفاء الحاجة أو انتهاء الأساس النظامي، ما لم يوجب النظام الاحتفاظ بها مدّة أطول.</p>\n\n    <h2>8. حماية البيانات</h2>\n    <p>نطبّق تدابير تقنية وتنظيمية معقولة لحماية بياناتك من الوصول أو الإفصاح أو التغيير غير المصرّح به، مع الإقرار بأنه لا توجد وسيلة نقل أو تخزين إلكتروني آمنة بنسبة 100%.</p>\n\n    <h2>9. إتلاف البيانات</h2>\n    <p>عند انتهاء الغرض من المعالجة أو سحبك موافقتك، تُتلَف بياناتك الشخصية بطريقة آمنة أو تُحوَّل إلى صيغة مجهولة لا تُعرّف بك، وفق ما يقتضيه النظام.</p>\n\n    <h2>10. حقوقك تجاه بياناتك</h2>\n    <p>وفقاً لنظام حماية البيانات الشخصية، لك الحقوق التالية:</p>\n    <ul>\n      <li>الحق في العلم بكيفية جمع بياناتك والغرض منه.</li>\n      <li>الحق في الوصول إلى بياناتك والحصول على نسخة منها.</li>\n      <li>الحق في تصحيح بياناتك غير الدقيقة أو استكمالها.</li>\n      <li>الحق في طلب إتلاف بياناتك عند انتفاء الحاجة إليها.</li>\n      <li>الحق في سحب موافقتك في أي وقت دون أثر رجعي على المعالجة السابقة.</li>\n      <li>الحق في الاعتراض على أي قرار يُتّخذ بالاعتماد على المعالجة الآلية وحدها.</li>\n    </ul>\n    <p>لممارسة أي من هذه الحقوق، تواصل معنا عبر بيانات جهة التحكّم أعلاه، وسنستجيب خلال المدّة النظامية.</p>\n\n    <h2>11. التسويق والنشرة البريدية</h2>\n    <p>لا نرسل لك أي رسائل تسويقية إلا بموافقة صريحة ومنفصلة منك (الاشتراك في النشرة اختياري تماماً)، ويمكنك إلغاء الاشتراك في أي وقت.</p>\n\n    <h2>12. ملفات تعريف الارتباط (Cookies)</h2>\n    <p>نستخدم ملفات تعريف الارتباط لتشغيل المنصّة وقياس أدائها. يمكنك التحكّم بها من إعدادات متصفّحك، مع العلم أن تعطيل بعضها قد يؤثّر على تجربتك. لمزيد من التفاصيل راجع «سياسة ملفات تعريف الارتباط».</p>\n\n    <h2>13. خصوصية الأطفال</h2>\n    <p>المنصّة غير موجّهة للأطفال دون السنّ النظامية، ولا نجمع بياناتهم عن قصد. إذا تبيّن جمع بيانات قاصر دون موافقة وليّه، نحذفها فور علمنا.</p>\n\n    <h2>14. تعديل السياسة والجهة المشرفة</h2>\n    <p>قد نحدّث هذه السياسة من وقت لآخر، ويسري التحديث فور نشره على هذه الصفحة. الجهة المشرفة على تطبيق نظام حماية البيانات الشخصية في المملكة هي الهيئة السعودية للبيانات والذكاء الاصطناعي (SDAIA)، ولك حقّ التقدّم لها بشكوى.</p>\n  </div>\n</div>\n</body>\n</html>\n","contract":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>اتفاقية اشتراك في منصة مدونتي — نسخة العميل</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap\" rel=\"stylesheet\" />\n<style>\n  :root{\n    --bg:45 8% 95%; --paper:0 0% 100%; --ink:245 87% 19%; --muted:0 0% 36%;\n    --border:0 0% 88%; --primary:240 100% 59%; --accent:180 100% 42%;\n    --field:38 92% 50%;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:'Tajawal',sans-serif;background:hsl(var(--bg));color:hsl(var(--ink));line-height:1.95;padding:24px 12px 140px}\n  .doc{max-width:800px;margin:0 auto;background:hsl(var(--paper));border:1px solid hsl(var(--border));border-radius:16px;overflow:hidden;box-shadow:0 10px 40px -20px rgba(0,0,0,.25)}\n\n  /* ===== ترويسة ===== */\n  .brand{background:linear-gradient(135deg,hsl(245 60% 14%),hsl(240 80% 28%));color:#fff;padding:26px 32px}\n  .brand .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}\n  .brand .logo .mark{width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;padding:5px;box-shadow:0 2px 10px rgba(0,0,0,.22)}\n  .brand .logo .mark svg{width:100%;height:100%;display:block}\n  .brand .umbrella{font-size:11.5px;opacity:.8;margin-top:6px}\n  .brand h1{font-size:19px;font-weight:800;margin-top:16px}\n  .brand .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11px}\n  .brand .meta span{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:999px}\n\n  .legend{background:hsl(var(--field)/.1);border-bottom:1px solid hsl(var(--border));padding:8px 32px;font-size:11.5px;color:hsl(28 70% 32%);font-weight:600}\n  .legend b{background:hsl(var(--field)/.22);padding:0 6px;border-radius:4px}\n\n  .body{padding:10px 32px 24px}\n\n  /* ===== صندوق «باختصار» ===== */\n  .summary-box{background:linear-gradient(135deg,hsl(var(--primary)/.06),hsl(var(--accent)/.07));border:1.5px solid hsl(var(--primary)/.3);border-radius:14px;padding:18px 20px;margin:18px 0 6px}\n  .summary-box h2{font-size:16px;font-weight:800;color:hsl(var(--primary));margin-bottom:12px}\n  .summary-box .sb-row{display:flex;gap:8px;margin-bottom:8px;font-size:13.5px;align-items:flex-start}\n  .summary-box .sb-row .lbl{font-weight:800;color:hsl(var(--ink));white-space:nowrap;flex-shrink:0}\n  .summary-box .sb-points{margin-top:12px;padding-top:12px;border-top:1px dashed hsl(var(--primary)/.25)}\n  .summary-box .sb-points .ttl{font-weight:800;font-size:12.5px;color:hsl(var(--ink));margin-bottom:8px}\n  .summary-box .sb-points .pt{display:flex;gap:8px;font-size:13px;margin-bottom:7px;color:hsl(var(--ink))}\n  .summary-box .sb-points .pt::before{content:\"✔\";color:hsl(186 90% 30%);font-weight:800;flex-shrink:0}\n  .summary-box .sb-foot{margin-top:12px;font-size:11.5px;color:hsl(var(--muted));font-style:italic}\n\n  /* الحقل المتغيّر */\n  .field{background:hsl(var(--field)/.16);border-bottom:1.5px dotted hsl(var(--field));padding:0 5px;border-radius:3px;font-weight:700;color:hsl(28 75% 28%);white-space:nowrap}\n\n  .parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 6px}\n  .party{border:1px solid hsl(var(--border));border-radius:12px;padding:14px 16px;font-size:13px}\n  .party h3{font-size:12px;color:hsl(var(--muted));font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}\n  .party .nm{font-size:15px;font-weight:800;margin-bottom:4px}\n  .party .row{font-size:12px;color:hsl(var(--muted));margin-bottom:2px}\n  .preamble{font-size:13.5px;color:hsl(var(--ink));margin:14px 0}\n\n  .art{margin-top:20px}\n  .art h2{font-size:15.5px;font-weight:800;color:hsl(var(--primary));margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid hsl(var(--border))}\n  /* السطر المبسّط تحت كل مادة */\n  .art .plain{font-size:12.5px;color:hsl(186 60% 24%);background:hsl(var(--accent)/.09);border-radius:8px;padding:7px 12px;margin-bottom:10px;font-weight:600;line-height:1.75}\n  .art .plain::before{content:\"💡 \";}\n  .art p,.art li{font-size:13.5px;color:hsl(var(--ink))}\n  .art ol{padding-inline-start:20px;margin-top:4px}\n  .art ol li{margin-bottom:5px}\n  .pay{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}\n  .pay .ch{border:1px solid hsl(var(--border));border-radius:10px;padding:10px 12px;font-size:12.5px;background:hsl(var(--bg)/.5)}\n  .pay .ch b{color:hsl(var(--ink))}\n  .pay code{font-family:monospace;font-size:11.5px;background:hsl(var(--bg));padding:1px 5px;border-radius:4px;direction:ltr;display:inline-block}\n  .verify{margin-top:12px;background:hsl(var(--accent)/.1);border:1px solid hsl(var(--accent)/.45);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.85}\n  .verify ul{padding-inline-start:18px;margin-top:6px}\n  .verify li{margin-bottom:4px;font-size:12px}\n  .verify a{color:hsl(var(--primary));font-weight:700;text-decoration:none;direction:ltr;display:inline-block}\n  .verify a:hover{text-decoration:underline}\n\n  /* ===== ملخّص + قبول (sticky) ===== */\n  .accept-wrap{position:sticky;bottom:0;background:hsl(var(--paper));border-top:2px solid hsl(var(--accent));box-shadow:0 -8px 30px -16px rgba(0,0,0,.3);padding:16px 32px;border-radius:0 0 16px 16px}\n  .terms-summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}\n  .ts{flex:1;min-width:120px;background:hsl(var(--bg));border-radius:10px;padding:8px 12px;text-align:center}\n  .ts .k{font-size:10px;color:hsl(var(--muted));font-weight:600}\n  .ts .v{font-size:14px;font-weight:800;color:hsl(var(--ink))}\n  .chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px}\n  .chk input{margin-top:4px;width:17px;height:17px;accent-color:hsl(var(--primary));flex-shrink:0}\n  .accept-btn{width:100%;padding:14px;border:0;border-radius:12px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;\n    background:hsl(var(--primary));color:#fff;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}\n  .accept-btn:disabled{background:hsl(var(--border));color:hsl(var(--muted));cursor:not-allowed}\n  .accept-btn:not(:disabled):hover{filter:brightness(1.08)}\n  .fine{font-size:10.5px;color:hsl(var(--muted));text-align:center;margin-top:8px}\n\n  .done{display:none;background:hsl(var(--accent)/.12);border:1px solid hsl(var(--accent));border-radius:12px;padding:16px;text-align:center}\n  .done .big{font-size:16px;font-weight:800;color:hsl(186 90% 24%)}\n  .done .small{font-size:12px;color:hsl(var(--muted));margin-top:6px}\n</style>\n</head>\n<body>\n<div class=\"doc\">\n\n  <!-- ترويسة -->\n  <div class=\"brand\">\n    <div class=\"logo\"><span class=\"mark\"><svg viewBox=\"14.67 20.9 70.65 70.65\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"شعار مدونتي\"><path fill=\"#3030FF\" d=\"M79.36,91.55H20.64c-3.26,0-5.91-2.64-5.91-5.91V26.81c0-3.26,2.64-5.91,5.91-5.91h58.71c3.26,0,5.91,2.64,5.91,5.91v58.83C85.26,88.9,82.62,91.55,79.36,91.55z\"/><rect x=\"25.59\" y=\"69.22\" transform=\"matrix(0.7071 -0.7071 0.7071 0.7071 -42.5775 41.0813)\" fill=\"#F3F3F3\" width=\"5.42\" height=\"5.42\"/><path fill=\"#F3F3F3\" d=\"M74.41,50.23v24.42h-5.43V50.23c0-4.49-3.64-8.14-8.13-8.14c-4.5,0-8.14,3.65-8.14,8.14v24.42h-5.42V50.23c0-4.49-3.65-8.14-8.14-8.14c-4.5,0-8.14,3.65-8.14,8.14V63.8h-5.42V50.23c0-0.92,0.09-1.83,0.27-2.72c0.4-2,1.25-3.84,2.44-5.42c0.77-1.02,1.68-1.93,2.72-2.71c2.26-1.7,5.08-2.72,8.14-2.72c3.05,0,5.86,1.01,8.14,2.72c1.02,0.76,1.93,1.68,2.71,2.71c0.77-1.02,1.68-1.93,2.72-2.71c2.27-1.7,5.08-2.72,8.14-2.72c3.05,0,5.86,1.01,8.13,2.72c1.03,0.76,1.95,1.68,2.72,2.71c1.18,1.58,2.03,3.42,2.45,5.42C74.31,48.4,74.41,49.31,74.41,50.23z\"/></svg></span> مُدوّنتي</div>\n    <div class=\"umbrella\">منصة المحتوى العربي للأعمال · www.modonty.com — تعمل ضمن مظلّة شركة جبر الجنوبية للمقاولات</div>\n    <h1>اتفاقية اشتراك في منصة مدونتي</h1>\n    <div class=\"meta\">\n      <span>نسخة الشروط رقم <span style=\"color:hsl(var(--accent))\">v1.0</span></span>\n      <span>تخضع لأنظمة المملكة العربية السعودية</span>\n      <span>قبول إلكتروني مُلزِم</span>\n    </div>\n  </div>\n\n  <div class=\"legend\">🔸 الحقول <b>المظلّلة بالأصفر</b> تُعبّأ تلقائيًا حسب بيانات حسابك والباقة المختارة.</div>\n\n  <div class=\"body\">\n\n    <!-- صندوق باختصار -->\n    <div class=\"summary-box\">\n      <h2>📌 باختصار — قبل ما تقرأ التفاصيل</h2>\n      <div class=\"sb-row\"><span class=\"lbl\">وش تاخذ:</span><span>مقالات شهرية مُحسّنة لِجوجل + صفحة باسمك على مدونتي + لوحة تحليلات حيّة.</span></div>\n      <div class=\"sb-row\"><span class=\"lbl\">وش تدفع:</span><span>رسوم باقتك — شاملة الضريبة، بلا مفاجآت ولا رسوم مخفية.</span></div>\n      <div class=\"sb-row\"><span class=\"lbl\">المدة والإلغاء:</span><span>تبدأ من أول مقالة، وتقدر ما تجدّد بإشعار مسبق.</span></div>\n      <div class=\"sb-points\">\n        <div class=\"ttl\">٤ نقاط مهمة تعرفها:</div>\n        <div class=\"pt\">نبني لك حضورًا حقيقيًا في محركات البحث بمحتوى احترافي مُحسّن.</div>\n        <div class=\"pt\">المحتوى اللي ننشره يصير ملكك بعد سداد كامل الرسوم.</div>\n        <div class=\"pt\">أنت مسؤول عن صحّة وقانونية أي مادة أو صورة تعطينا إياها.</div>\n        <div class=\"pt\">نقرة «موافق» + البريد التأكيدي = توقيع رسمي مُلزِم نظاميًا في السعودية.</div>\n      </div>\n      <div class=\"sb-foot\">التفاصيل الكاملة بالأسفل، وهي المرجع المُلزِم عند أي خلاف.</div>\n    </div>\n\n    <!-- الأطراف -->\n    <div class=\"parties\">\n      <div class=\"party\">\n        <h3>الطرف الأول</h3>\n        <div class=\"nm\">منصة مُدوّنتي</div>\n        <div class=\"row\">منصة المحتوى العربي للأعمال</div>\n        <div class=\"row\">الموقع: www.modonty.com</div>\n        <div class=\"row\">البريد: modonty@modonty.com</div>\n        <div style=\"margin-top:9px;padding-top:9px;border-top:1px solid hsl(var(--border))\">\n          <div class=\"row\">المُشغّل القانوني: <b style=\"color:hsl(var(--ink))\">شركة جبر الجنوبية للمقاولات</b> (ش.ذ.م.م)</div>\n          <div class=\"row\">سجل تجاري 4030524305 · الرقم الموحّد 7036024383</div>\n          <div class=\"row\">رأس المال 8,000,000 ﷼</div>\n          <div class=\"row\">جدة — الشرفية — أبو بكر الصديق</div>\n        </div>\n      </div>\n      <div class=\"party\">\n        <h3>الطرف الثاني — العميل</h3>\n        <div class=\"nm\"><span class=\"field\">[اسم العميل/المنشأة]</span></div>\n        <div class=\"row\">سجل/هوية: <span class=\"field\">[ ]</span></div>\n        <div class=\"row\">العنوان: <span class=\"field\">[ ]</span></div>\n        <div class=\"row\">البريد المعتمد: <span class=\"field\">[email@client.com]</span></div>\n      </div>\n    </div>\n\n    <p class=\"preamble\">حيث إن الطرف الأول يملك ويشغّل منصة رقمية للأعمال — ركيزتها إنتاج ونشر محتوى مدوّنات عربية مُحسَّنة لمحركات البحث وفق نظام اشتراك، وقد تتيح خدمات أخرى تُضاف إليها مستقبلاً — ورغب الطرف الثاني في الاشتراك والاستفادة من خدمة المحتوى، فقد اتفق الطرفان وهما بكامل أهليتهما المعتبرة شرعاً ونظاماً على ما يلي:</p>\n\n    <div class=\"art\"><h2>المادة 1 — التعريفات</h2>\n      <div class=\"plain\">تعريفات سريعة للكلمات المستخدمة في العقد — عشان كل شي واضح.</div>\n      <p>يُقصد بالألفاظ التالية المعاني المبيّنة قرينها ما لم يقتضِ السياق خلافه:</p>\n      <ol>\n        <li><b>المنصة:</b> منصة مدونتي الرقمية وأنظمتها وأدواتها التابعة للطرف الأول، وتشمل خدمة المحتوى وأي خدمات أخرى قد تُضاف إليها.</li>\n        <li><b>الخدمة:</b> إنتاج ونشر محتوى المدوّنات المُحسَّن لمحركات البحث وما يرتبط به من تحسينات تقنية وتقارير، وفق الباقة.</li>\n        <li><b>الباقة:</b> حزمة الخدمة المختارة، المحدِّدة لعدد المقالات والمزايا والرسوم.</li>\n        <li><b>المحتوى المنشور:</b> المقالات والمواد التي تُنتجها المنصة وتُنشر لمصلحة العميل.</li>\n        <li><b>السجل الإلكتروني:</b> البيانات التي تنشئها المنصة عند قبول العميل (تاريخ القبول ووقته، رقم نسخة الشروط، البيانات التقنية للجلسة، البريد التأكيدي).</li>\n        <li><b>لوحة التحكم:</b> الواجهة الرقمية للاطلاع على المحتوى المنشور وتقارير الأداء والمؤشرات بصورة ذاتية.</li>\n        <li><b>النظام:</b> الأنظمة واللوائح المعمول بها في المملكة العربية السعودية.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 2 — موضوع الاتفاقية</h2>\n      <div class=\"plain\">خلاصة الاتفاق: اشتراكك في مدونتي حسب باقتك.</div>\n      <p>تنظيم اشتراك العميل في منصة مدونتي واستفادته من الخدمة وفق الباقة والمدة والرسوم المتفق عليها، وتحديد حقوق الطرفين والتزاماتهما.</p>\n    </div>\n\n    <div class=\"art\"><h2>المادة 3 — نطاق الخدمة والتسليمات</h2>\n      <div class=\"plain\">وش تاخذ بالضبط: مقالات شهرية + لوحة تحكم. أي خدمة ثانية (مثل الحجوزات) مش داخلة وتُدفع لحالها.</div>\n      <ol>\n        <li>يلتزم الطرف الأول بتزويد العميل بالخدمة وفق الباقة المختارة، وتشمل: نشر <span class=\"field\">[ ]</span> مقالة شهرياً مُحسَّنة لمحركات البحث، والتحسينات التقنية المرتبطة، وإتاحة لوحة تحكم للاطلاع على المحتوى المنشور وتقارير الأداء والمؤشرات.</li>\n        <li>تُحدَّد تفاصيل الباقة ومزاياها في صفحة الأسعار أو ملحق الباقة المعتمد، ويُعدّ جزءاً لا يتجزأ من هذه الاتفاقية.</li>\n        <li>تقتصر هذه الاتفاقية على <b>خدمة المحتوى</b> المحدّدة في الباقة. أي خدمات أخرى تتيحها المنصة حالياً أو تُضاف إليها مستقبلاً (كخدمات الحجوزات أو غيرها) <b>لا تُعدّ جزءاً من هذه الاتفاقية ولا التزاماً على الطرف الأول بموجبها</b>، وتخضع — عند رغبة العميل فيها — لاتفاق منفصل ورسوم إضافية.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 4 — مدة الاشتراك والتجديد</h2>\n      <div class=\"plain\">متى تبدأ المدة، وكيف تتجدّد تلقائيًا، وكيف توقف التجديد لو ما تبي.</div>\n      <ol>\n        <li>تبدأ مدة الاشتراك من تاريخ نشر أول مقالة لمصلحة العميل، ولمدة <span class=\"field\">[ ]</span> شهراً، ولا تُحتسب ضمنها فترة التهيئة والإعداد. فإن تأخّر نشر أول مقالة بسبب عدم تزويد العميل بما يلزم، تبدأ المدة بعد مضي <span class=\"field\">[ ]</span> يوماً من تاريخ القبول.</li>\n        <li>يُجدَّد الاشتراك تلقائياً لمدة مماثلة، ما لم يُشعِر أحد الطرفين الآخر برغبته في عدم التجديد قبل <span class=\"field\">[ ]</span> يوماً من انتهاء المدة.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 5 — الرسوم والدفع</h2>\n      <div class=\"plain\">رسوم باقتك شاملة الضريبة، وطرق الدفع. تأخّر السداد = إيقاف مؤقت. وما فعّلنا حسابك خلال 14 يوم؟ تسترد فلوسك كاملة.</div>\n      <ol>\n        <li>يلتزم العميل بسداد رسوم الباقة المختارة <b>شاملةً</b> ضريبة القيمة المضافة (السعر النهائي بلا إضافات)، وفق المبلغ والعملة ودورة الفوترة المحدّدة في <span class=\"field\">[صفحة الأسعار / ملحق الباقة]</span> المعتمد وقت الاشتراك.</li>\n        <li>يكون السداد عبر التحويل البنكي للحساب المعتمد للطرف الأول، أو عبر InstaPay للعملاء في مصر، وذلك على النحو التالي:\n          <div class=\"pay\">\n            <div class=\"ch\">🇸🇦 <b>السعودية — تحويل بنكي:</b> البنك الأهلي السعودي · آيبان <code>SA3100000000300001687908</code></div>\n            <div class=\"ch\">🇪🇬 <b>مصر — InstaPay:</b> <code>01227002786</code></div>\n            <div class=\"ch\">🇪🇬 <b>مصر — تحويل بنكي:</b> بنك SAIB (فرع شيراتون) · آيبان <code>EG140035002902920303584810010</code> · سويفت <code>SBNKEGCXXXX</code></div>\n          </div>\n        </li>\n        <li>تصدر الفواتير إلكترونياً وفق نظام الفوترة الإلكترونية المعتمد.</li>\n        <li>في حال التأخر عن السداد مدة تتجاوز <span class=\"field\">[ ]</span> يوماً، يحق للطرف الأول إيقاف الخدمة، دون إخلال بحقه في المطالبة بكامل مستحقاته.</li>\n        <li>إذا لم يؤسّس الطرف الأول حساب العميل الأساسي على المنصة خلال (14) يوماً من تاريخ سداده، حقّ للعميل استرداد كامل المبلغ المدفوع.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 6 — النتائج والترتيب في محركات البحث</h2>\n      <div class=\"plain\">نبني لك حضورًا حقيقيًا في محركات البحث بمحتوى احترافي مُحسّن.</div>\n      <ol>\n        <li>يلتزم الطرف الأول بإنتاج محتوى احترافي مُحسّن لمحركات البحث وتهيئته تقنيًا، والعمل على بناء حضور العميل بصورة تراكمية.</li>\n        <li>تنحصر التزامات الطرف الأول في تنفيذ أعمال التحسين والنشر ببذل العناية المهنية المعتادة، دون التزام بمركز معيّن أو عدد زيارات محدّد.</li>\n        <li>لا يُعدّ عدم بلوغ مركز أو عدد زيارات معيّن إخلالاً، ما دامت الأعمال قد نُفّذت باحتراف.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 7 — التزامات الطرف الأول (مدونتي)</h2>\n      <div class=\"plain\">اللي علينا: نفتح حسابك خلال 14 يوم، ننشر في مواعيدنا، نوفّر لك لوحة تحكم، ونحفظ سرية بياناتك.</div>\n      <ol>\n        <li>تأسيس حساب أساسي للعميل خلال مدة لا تتجاوز (14) يوماً من تاريخ سداده وقبوله الاتفاقية.</li>\n        <li>تقديم الخدمة بالجودة المهنية المعتادة ووفق الباقة.</li>\n        <li>الالتزام بمواعيد النشر والتسليمات المتفق عليها.</li>\n        <li>إتاحة لوحة تحكم للعميل يطّلع من خلالها على المحتوى المنشور وتقارير الأداء والمؤشرات، ويُعدّ توفيرها وفاءً بالتزام الطرف الأول بشأن التقارير دون التزام بإرسالها منفصلة.</li>\n        <li>المحافظة على سرية بيانات العميل.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 8 — التزامات العميل</h2>\n      <div class=\"plain\">اللي عليك: تعطينا اللي نحتاجه، ترد على المراجعات بوقتها، تسدّد في موعدك، وتتحمّل مسؤولية موادك.</div>\n      <ol>\n        <li>تزويد الطرف الأول بالمعلومات والصلاحيات والوصول اللازم لتقديم الخدمة.</li>\n        <li>الرد على طلبات الاعتماد والمراجعة خلال <span class=\"field\">[ ]</span> أيام عمل، وإلا عُدّ ذلك موافقة ضمنية.</li>\n        <li>سداد الرسوم في مواعيدها.</li>\n        <li>عدم استخدام الخدمة في أي غرض مخالف للنظام.</li>\n        <li>يتحمّل العميل المسؤولية الكاملة (100%) عن كل ما يزوّد به الطرف الأول من معلومات أو بيانات أو صور أو وثائق، ويقرّ بملكيته لحقوقها وبأنها لا تخالف النظام أو حقوق الغير، ويُخلي مسؤولية الطرف الأول عن أي ضرر أو مطالبة تنشأ عنها.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 9 — الملكية الفكرية</h2>\n      <div class=\"plain\">المحتوى يصير ملكك بعد السداد الكامل. المنصّة وأدواتها تبقى لنا. ولنا نعرض صفحتك ونذكرك كعميل (تقدر تعترض كتابةً).</div>\n      <ol>\n        <li>يملك العميل المحتوى المنشور لمصلحته بعد سداد كامل رسومه المستحقة.</li>\n        <li>يحتفظ الطرف الأول بكامل حقوقه على المنصة وأنظمتها ومنهجيتها وأدواتها وقوالبها، ولا ينتقل منها شيء للعميل.</li>\n        <li>يحق للطرف الأول عرض صفحة العميل ومحتواه علناً على المنصة طوال مدة الاشتراك، والإشارة إلى العميل ضمن قائمة عملائه لأغراض التسويق، ما لم يعترض العميل كتابةً.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 10 — السرية</h2>\n      <div class=\"plain\">كل طرف يحفظ سرية معلومات الطرف الثاني، حتى بعد انتهاء العقد.</div>\n      <p>يلتزم كل طرف بالمحافظة على سرية المعلومات التي يطّلع عليها بحكم هذه الاتفاقية، وعدم إفشائها أو استخدامها لغير أغراضها، وتبقى هذه الالتزامات سارية بعد انتهاء الاتفاقية.</p>\n    </div>\n\n    <div class=\"art\"><h2>المادة 11 — حماية البيانات الشخصية</h2>\n      <div class=\"plain\">نلتزم بنظام حماية البيانات الشخصية السعودي في أي بيانات نتعامل معها.</div>\n      <p>يلتزم الطرفان بأحكام نظام حماية البيانات الشخصية ولوائحه التنفيذية في المملكة، فيما يتعلق بجمع أي بيانات شخصية أو معالجتها أو حفظها، وبحدود ما تقتضيه طبيعة الخدمة.</p>\n    </div>\n\n    <div class=\"art\"><h2>المادة 12 — القبول الإلكتروني وحجية السجل</h2>\n      <div class=\"plain\">نقرة «موافق» + البريد التأكيدي = توقيع رسمي مُلزِم، وتقدر تتأكد من الأنظمة بنفسك (روابط رسمية بالأسفل).</div>\n      <ol>\n        <li>يُعدّ نقر العميل على زر «موافق» قبولاً صريحاً وتوقيعاً إلكترونياً مُلزِماً على كامل بنود هذه الاتفاقية.</li>\n        <li>يُرسَل بريد إلكتروني تأكيدي تلقائي إلى البريد الرسمي للطرف الأول وإلى البريد المعتمد للعميل فور القبول.</li>\n        <li>يقرّ الطرفان بأن السجل الإلكتروني الناتج عن القبول — بما يشمل تاريخ القبول ووقته، ورقم نسخة الشروط، والبيانات التقنية المرتبطة بالجلسة، والبريد التأكيدي — يُعدّ دليلاً معتمداً وحجة بينهما، استناداً إلى <b>نظام التعاملات الإلكترونية</b> الصادر بالمرسوم الملكي رقم (م/18) وتاريخ 8/3/1428هـ، و<b>نظام الإثبات</b> الصادر بالمرسوم الملكي رقم (م/43) وتاريخ 26/5/1443هـ (ولا سيّما المادة الخامسة والعشرون بشأن الدليل الرقمي).</li>\n        <li>يتنازل العميل عن أي دفع بعدم حجية هذا السجل لمجرد كونه إلكترونياً.</li>\n      </ol>\n      <div class=\"verify\">\n        <b>🔎 للتحقّق بنفسك:</b> قبولك الإلكتروني (النقر على «موافق» + البريد التأكيدي) يُعدّ توقيعاً ومستنداً رسمياً مُلزِماً في المملكة العربية السعودية. يمكنك قراءة النظامين من مصدرهما الحكومي الرسمي — البوابة الوطنية للأنظمة (هيئة الخبراء بمجلس الوزراء):\n        <ul>\n          <li><a href=\"https://laws.boe.gov.sa\" target=\"_blank\" rel=\"noopener\">laws.boe.gov.sa</a> — البوابة الوطنية للأنظمة (ابحث باسم النظام أو رقم المرسوم)</li>\n          <li><a href=\"https://laws.boe.gov.sa/BoeLaws/Laws/LawDetails/2716057c-c097-4bad-8e1e-ae1400c678d5/1\" target=\"_blank\" rel=\"noopener\">نظام الإثبات (م/43) — النص الرسمي</a></li>\n          <li><a href=\"https://www.mof.gov.sa/docslibrary/RegulationsInstructions/DocLib/%D9%86%D8%B8%D8%A7%D9%85%20%D8%A7%D9%84%D8%AA%D8%B9%D8%A7%D9%85%D9%84%D8%A7%D8%AA%20%D8%A7%D9%84%D8%A5%D9%84%D9%83%D8%AA%D8%B1%D9%88%D9%86%D9%8A%D8%A9.pdf\" target=\"_blank\" rel=\"noopener\">نظام التعاملات الإلكترونية (م/18) — PDF رسمي</a></li>\n        </ul>\n      </div>\n    </div>\n\n    <div class=\"art\"><h2>المادة 13 — تحديد المسؤولية</h2>\n      <div class=\"plain\">لو صار ضرر، مسؤوليتنا محدودة بما دفعته في فترة محدّدة، وما نتحمّل الأضرار غير المباشرة.</div>\n      <p>لا يُسأل الطرف الأول عن أي أضرار غير مباشرة أو تبعية، وفي جميع الأحوال لا تتجاوز مسؤوليته إجمالي ما سدده العميل من رسوم خلال <span class=\"field\">[ ]</span> أشهر السابقة لواقعة الضرر.</p>\n    </div>\n\n    <div class=\"art\"><h2>المادة 14 — الإنهاء</h2>\n      <div class=\"plain\">كيف ينتهي العقد، ووش يصير بصفحتك بعده.</div>\n      <ol>\n        <li>يحق لأي طرف إنهاء الاتفاقية بإشعار كتابي قبل <span class=\"field\">[ ]</span> يوماً.</li>\n        <li>يحق للطرف الأول الإنهاء فوراً عند إخلال العميل بالسداد أو مخالفته الجوهرية للاتفاقية.</li>\n        <li>لا يترتب على الإنهاء استرداد الرسوم المدفوعة عن مدة الاشتراك الجارية، ما لم يُتفق على خلاف ذلك.</li>\n        <li>بعد انتهاء الاتفاقية أو إنهائها، <span class=\"field\">[تبقى صفحة العميل منشورة / تُؤرشَف / تُحذف خلال ( ) يوماً]</span>، ويحق للعميل طلب نسخة من محتواه المنشور.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 15 — القوة القاهرة</h2>\n      <div class=\"plain\">لو صار ظرف قاهر خارج الإرادة (كارثة مثلًا)، ما أحد يتحمّل مسؤولية التقصير الناتج عنه.</div>\n      <p>لا يُسأل أي طرف عن الإخلال الناتج عن قوة قاهرة خارجة عن إرادته، على أن يُشعِر الطرف الآخر خلال مدة معقولة.</p>\n    </div>\n\n    <div class=\"art\"><h2>المادة 16 — تعديل الشروط</h2>\n      <div class=\"plain\">لو حدّثنا الشروط نبلّغك، واستمرارك في الخدمة = موافقة، ونحفظ نسخة كل شروط وافقت عليها.</div>\n      <p>يحق للطرف الأول تحديث شروط الخدمة، على أن يُشعِر العميل بالنسخة المحدّثة، ويُعدّ استمرار العميل في استخدام الخدمة قبولاً بها. وتُحفظ نسخة الشروط التي قبلها العميل برقم نسخة في السجل الإلكتروني.</p>\n    </div>\n\n    <div class=\"art\"><h2>المادة 17 — القانون الحاكم وتسوية النزاعات</h2>\n      <div class=\"plain\">العقد يخضع لأنظمة السعودية، وأي خلاف يُحلّ ودّيًا أول، وإن تعذّر فأمام الجهة المختصة.</div>\n      <ol>\n        <li>تخضع هذه الاتفاقية وتُفسَّر وفق أنظمة المملكة العربية السعودية.</li>\n        <li>ما ينشأ من نزاع يُسوّى ودياً، فإن تعذّر فيُحال إلى <span class=\"field\">[المحاكم المختصة في مدينة جدة]</span>.</li>\n      </ol>\n    </div>\n\n    <div class=\"art\"><h2>المادة 18 — أحكام عامة</h2>\n      <div class=\"plain\">أحكام ختامية: هذا كامل الاتفاق، والعربية هي المعتمدة، وبطلان بند ما يبطل الباقي.</div>\n      <ol>\n        <li>تمثّل هذه الاتفاقية وملحقاتها كامل الاتفاق بين الطرفين، وتلغي ما سبقها من تفاهمات.</li>\n        <li>النسخة العربية هي المعتمدة عند أي اختلاف في التفسير.</li>\n        <li>إذا بطل أي بند، تبقى باقي البنود سارية ونافذة.</li>\n        <li>تُوجَّه الإشعارات على البريد الإلكتروني المعتمد لكل طرف.</li>\n      </ol>\n    </div>\n\n  </div>\n\n  <!-- ملخّص + قبول إلكتروني -->\n  <div class=\"accept-wrap\">\n    <div class=\"terms-summary\">\n      <div class=\"ts\"><div class=\"k\">الباقة</div><div class=\"v\"><span class=\"field\">[ ]</span></div></div>\n      <div class=\"ts\"><div class=\"k\">الرسوم (شامل الضريبة)</div><div class=\"v\"><span class=\"field\">[ ] حسب الباقة</span></div></div>\n      <div class=\"ts\"><div class=\"k\">المدة</div><div class=\"v\"><span class=\"field\">[ ] شهر</span></div></div>\n      <div class=\"ts\"><div class=\"k\">المقالات</div><div class=\"v\"><span class=\"field\">[ ] / شهر</span></div></div>\n    </div>\n\n    <div id=\"form\">\n      <label class=\"chk\">\n        <input type=\"checkbox\" id=\"agree\" onchange=\"document.getElementById('btn').disabled=!this.checked\" />\n        <span>أقررّ بأنني قرأت اتفاقية الاشتراك كاملةً وفهمت بنودها، وأوافق عليها موافقةً مُلزِمة.</span>\n      </label>\n      <button class=\"accept-btn\" id=\"btn\" disabled onclick=\"accept()\">✔ موافق — قبول الاتفاقية إلكترونياً</button>\n      <div class=\"fine\">بنقرك «موافق» يُسجَّل قبولك إلكترونياً (التاريخ والوقت + رقم النسخة + بيانات الجلسة) ويُرسَل إيميل تأكيدي لك وللطرف الأول — ويُعدّ ذلك توقيعاً مُلزِماً وفق نظام التعاملات الإلكترونية.</div>\n    </div>\n\n    <div class=\"done\" id=\"done\">\n      <div class=\"big\">✅ تم قبول الاتفاقية</div>\n      <div class=\"small\" id=\"doneInfo\"></div>\n    </div>\n  </div>\n\n</div>\n\n<script>\n  function accept(){\n    const now = new Date();\n    const stamp = now.toLocaleString('ar-SA',{dateStyle:'full',timeStyle:'medium'});\n    document.getElementById('form').style.display='none';\n    document.getElementById('done').style.display='block';\n    document.getElementById('doneInfo').innerHTML =\n      'نسخة الشروط: <b>v1.0</b><br/>وقت القبول: ' + stamp +\n      '<br/>أُرسل إيميل تأكيدي إلى بريدك وإلى modonty@modonty.com.';\n  }\n<\/script>\n</body>\n</html>\n","design":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>نظام تصميم مدوّنتي — المرجع الوحيد</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Montserrat:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  /* هويّة مدوّنتي — منقولة حرفياً من modonty/app/globals.css */\n  --navy:#0B0A5C; --blue:#3030FF; --teal:#00D8D8;\n  --bg:#f3f2ef; --card:#fff; --border:#dbdbdb; --muted:#5b5b5b;\n  --ok:#16a34a; --bad:#dc2626; --warn:#f5a623;\n\n  --t1:rgba(11,10,92,.92); --t2:rgba(11,10,92,.75); --t3:rgba(11,10,92,.6);\n\n  --r-sm:4px; --r-card:8px; --r-pill:999px;\n  --ring:0 0 0 1px var(--border);\n  --float:0 0 1px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.3);\n  --ease:cubic-bezier(.34,0,.21,1);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{\n  background:var(--bg); color:var(--t1);\n  font-family:\"Tajawal\",system-ui,sans-serif; font-size:15px; line-height:1.5;\n  -webkit-font-smoothing:antialiased;\n}\n.wrap{max-width:1128px;margin-inline:auto;padding:24px 16px 96px}\n\n/* ── الترويسة ── */\n.hero{background:var(--navy);color:#fff;border-radius:var(--r-card);padding:32px 28px;margin-bottom:24px;position:relative;overflow:hidden}\n.hero::after{content:\"\";position:absolute;inset-block:0;inset-inline-end:-60px;width:280px;\n  background:radial-gradient(circle at 50% 50%,var(--blue) 0%,transparent 62%);opacity:.5}\n.hero h1{font-size:30px;line-height:1.2;font-weight:700;position:relative}\n.hero p{margin-top:8px;color:rgba(255,255,255,.8);font-size:15px;max-width:62ch;position:relative}\n.hero .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;position:relative}\n.chip{background:rgba(255,255,255,.12);border-radius:var(--r-pill);padding:5px 12px;font-size:12px;font-weight:700}\n\n/* ── التنقّل ── */\nnav{position:sticky;top:0;z-index:20;background:rgba(243,242,239,.94);backdrop-filter:blur(8px);\n  margin:0 -16px 24px;padding:10px 16px;border-block-end:1px solid var(--border)}\nnav ul{display:flex;flex-wrap:wrap;gap:6px;list-style:none}\nnav a{display:block;padding:6px 12px;border-radius:var(--r-pill);font-size:13px;font-weight:700;\n  color:var(--t2);text-decoration:none;transition:background .2s var(--ease)}\nnav a:hover{background:#fff;color:var(--blue)}\n\n/* ── الأقسام ── */\nsection{background:var(--card);border-radius:var(--r-card);box-shadow:var(--ring);padding:24px;margin-block-end:16px}\nsection>h2{font-size:20px;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:10px}\nsection>h2 .n{background:var(--blue);color:#fff;width:30px;height:30px;border-radius:var(--r-pill);\n  display:grid;place-items:center;font-size:14px;flex:none}\n.lede{color:var(--t2);margin-block:10px 20px;max-width:74ch}\nh3{font-size:16px;font-weight:700;margin-block:22px 10px}\np{margin-block-end:10px;max-width:76ch}\nul.plain{margin:0 0 10px;padding-inline-start:20px;color:var(--t2)}\nul.plain li{margin-block-end:5px}\n\n/* ── الجداول ── */\ntable{width:100%;border-collapse:collapse;margin-block:12px;font-size:14px}\nth,td{text-align:start;padding:9px 10px;border-block-end:1px solid var(--border);vertical-align:top}\nth{font-weight:700;color:var(--t2);font-size:12px;letter-spacing:0;background:#faf9f7}\ntbody tr:last-child td{border-block-end:0}\ncode{font-family:ui-monospace,\"Cascadia Code\",Menlo,monospace;font-size:12.5px;\n  background:#f4f4f7;border-radius:var(--r-sm);padding:2px 6px;color:var(--navy);direction:ltr;display:inline-block}\n\n/* ── كتل الكود ── */\npre{background:#0d0c2b;color:#e8e8f5;border-radius:var(--r-card);padding:16px 18px;overflow-x:auto;\n  direction:ltr;text-align:left;font-size:12.5px;line-height:1.7;margin-block:12px}\npre code{background:none;color:inherit;padding:0;font-size:inherit}\n.c{color:#8b8bb0}     /* تعليق */\n.k{color:#8ec7ff}     /* مفتاح */\n.v{color:#a8e6a0}     /* قيمة */\n.x{color:#ff9d9d}     /* خطأ */\n\n/* ── صواب/خطأ ── */\n.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-block:14px}\n@media(max-width:720px){.pair{grid-template-columns:1fr}}\n.box{border-radius:var(--r-card);padding:14px 16px;box-shadow:var(--ring)}\n.box.no{background:#fff5f5;box-shadow:0 0 0 1px #fecaca}\n.box.yes{background:#f2fbf4;box-shadow:0 0 0 1px #bbf7d0}\n.box b{display:flex;align-items:center;gap:6px;font-size:13px;margin-block-end:8px}\n.box.no b{color:var(--bad)} .box.yes b{color:var(--ok)}\n.box pre{margin:0;font-size:12px}\n\n/* ── الشواهد ── */\n.proof{background:#f7f7fb;border-inline-start:3px solid var(--blue);border-radius:0 var(--r-sm) var(--r-sm) 0;\n  padding:12px 14px;margin-block:14px;font-size:13px}\n.proof b{display:block;margin-block-end:6px;font-size:12px;color:var(--blue)}\n.proof pre{background:#fff;color:var(--navy);box-shadow:var(--ring);margin-block:6px 0;font-size:12px}\n.proof pre .c{color:#8a8a9e}\n\n/* ── المعاينة الحيّة ── */\n.demo{background:var(--bg);border-radius:var(--r-card);box-shadow:var(--ring);padding:20px;margin-block:12px}\n.demo-label{font-size:11px;font-weight:700;color:var(--t3);margin-block-end:10px;display:block}\n\n/* عيّنات */\n.sw{display:flex;flex-wrap:wrap;gap:10px;margin-block:12px}\n.sw>div{flex:1 1 150px;border-radius:var(--r-card);overflow:hidden;box-shadow:var(--ring);background:#fff}\n.sw i{display:block;height:60px}\n.sw span{display:block;padding:8px 10px;font-size:11.5px;line-height:1.5;color:var(--t2);direction:ltr;text-align:left}\n.sw span b{display:block;color:var(--navy);font-size:12.5px}\n\n/* أزرار العيّنة */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;\n  border:0;background:transparent;color:var(--blue);border-radius:var(--r-pill);cursor:pointer;\n  font-family:inherit;font-size:14px;font-weight:700;box-shadow:inset 0 0 0 1px var(--blue);\n  transition:box-shadow .216s var(--ease),background .216s var(--ease),color .216s var(--ease)}\n.btn:hover{background:rgba(48,48,255,.09);color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}\n.btn.solid{background:var(--blue);color:#fff;box-shadow:none}\n.btn.solid:hover{background:var(--navy);box-shadow:none}\n.hit{display:inline-flex;align-items:center;min-height:48px;background:transparent;border:0;padding:0;cursor:pointer}\n\n/* بطاقة العيّنة */\n.card-demo{background:#fff;border-radius:var(--r-card);box-shadow:var(--ring);padding:16px;max-width:340px}\n.card-demo.wrong{box-shadow:0 2px 8px rgba(0,0,0,.12)}\n.card-demo h4{font-size:16px;font-weight:700;line-height:1.25}\n.card-demo p{font-size:14px;color:var(--t3);margin-block:4px 0}\n\n/* شارات */\n.tag{display:inline-block;border-radius:var(--r-pill);padding:3px 10px;font-size:11.5px;font-weight:700}\n.tag.ok{background:#dcfce7;color:#14532d}\n.tag.no{background:#fee2e2;color:#7f1d1d}\n.tag.info{background:#e0e7ff;color:#1e1b4b}\n.tag.warn{background:#fef3c7;color:#78350f}\n\n/* ── المعرض ── */\n.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}\n.g-item{background:#faf9f7;border-radius:var(--r-card);box-shadow:var(--ring);padding:16px}\n.g-t{display:block;font-size:11px;font-weight:700;color:var(--blue);margin-block-end:12px;\n  padding-block-end:8px;border-block-end:1px solid var(--border)}\n.g-v{font-size:11px;color:var(--t3);margin-block-start:5px;direction:ltr;text-align:left;line-height:1.5}\n.g-item .sw{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}\n.g-item .sw>div{flex:none}\n.g-item .sw i{height:44px}\n.mv{transition:transform .216s var(--ease),box-shadow .216s var(--ease)}\n.mv:hover{transform:translateY(-2px);box-shadow:var(--float)}\n\nfooter{text-align:center;color:var(--t3);font-size:12.5px;padding-block:28px}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n\n<header class=\"hero\">\n  <h1>نظام تصميم مدوّنتي</h1>\n  <p>المرجع الوحيد لكل قيمة بصريّة. الهويّة من كودنا، والبنية من قياس حيّ على ثلاثة أسطح مستقلّة — لا من ذوق ولا من لقطة شاشة.</p>\n  <div class=\"meta\">\n    <span class=\"chip\">١٤ أغسطس ٢٠٢٦</span>\n    <span class=\"chip\">يحلّ محلّ ملفّين</span>\n    <span class=\"chip\">٢٬٣٢٤ عنصراً مقيساً</span>\n  </div>\n</header>\n\n<nav><ul>\n  <li><a href=\"#gallery\">المعرض</a></li>\n  <li><a href=\"#src\">المصادر</a></li>\n  <li><a href=\"#brand\">الهويّة</a></li>\n  <li><a href=\"#shadow\">الظلال</a></li>\n  <li><a href=\"#type\">الطباعة</a></li>\n  <li><a href=\"#radius\">القطر</a></li>\n  <li><a href=\"#space\">المسافات</a></li>\n  <li><a href=\"#layout\">التخطيط</a></li>\n  <li><a href=\"#touch\">اللمس</a></li>\n  <li><a href=\"#text\">النصّ</a></li>\n  <li><a href=\"#check\">التحقّق</a></li>\n  <li><a href=\"#errors\">الأخطاء</a></li>\n  <li><a href=\"#todo\">لم يُقَس</a></li>\n</ul></nav>\n\n<!-- ═══ ٠ · المعرض ═══ -->\n<section id=\"gallery\">\n  <h2><span class=\"n\">٠</span> المعرض — كل عنصر في النظام، مرئيّاً</h2>\n  <p class=\"lede\">كل ما في هذا الملف، معروضاً في مكان واحد. القيمة تحت كل عيّنة.</p>\n\n  <div class=\"g\">\n\n    <!-- الألوان -->\n    <div class=\"g-item\" style=\"grid-column:1/-1\">\n      <span class=\"g-t\">الألوان</span>\n      <div class=\"sw\">\n        <div><i style=\"background:#0B0A5C\"></i><span><b>navy</b>#0B0A5C</span></div>\n        <div><i style=\"background:#3030FF\"></i><span><b>blue · primary</b>#3030FF</span></div>\n        <div><i style=\"background:#00D8D8\"></i><span><b>teal · accent</b>#00D8D8</span></div>\n        <div><i style=\"background:#f3f2ef\"></i><span><b>background</b>#f3f2ef</span></div>\n        <div><i style=\"background:#fff;box-shadow:inset 0 0 0 1px #dbdbdb\"></i><span><b>card</b>#ffffff</span></div>\n        <div><i style=\"background:#dbdbdb\"></i><span><b>border</b>#dbdbdb</span></div>\n        <div><i style=\"background:#16a34a\"></i><span><b>success</b>#16a34a</span></div>\n        <div><i style=\"background:#dc2626\"></i><span><b>destructive</b>#dc2626</span></div>\n        <div><i style=\"background:#f5a623\"></i><span><b>star</b>#f5a623</span></div>\n      </div>\n    </div>\n\n    <!-- السلّم الطباعي -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">السلّم الطباعي</span>\n      <div style=\"font-size:24px;line-height:1.125;font-weight:700\">عنوان
