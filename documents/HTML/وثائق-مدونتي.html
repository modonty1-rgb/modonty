5;background:#faf9f7;padding:10px;border-radius:var(--r-sm);margin-block-start:10px\">\n        احجز موعدك اليوم واحصل على استشارة مجانية من فريق متخصّص\n      </div>\n      <div class=\"g-v\">1.5 — محتوى · فقرات · مقالات</div>\n    </div>\n\n    <!-- درجات النصّ -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">درجات النصّ</span>\n      <div style=\"font-size:15px;color:var(--t1)\">أساسيّ — العناوين والمحتوى</div>\n      <div class=\"g-v\">--text-1 · opacity .9 · النسبة ×4</div>\n      <div style=\"font-size:15px;color:var(--t2);margin-block-start:10px\">ثانويّ — labels الأزرار</div>\n      <div class=\"g-v\">--text-2 · opacity .75 · ×1</div>\n      <div style=\"font-size:15px;color:var(--t3);margin-block-start:10px\">ثالثيّ — الطوابع والميتاداتا</div>\n      <div class=\"g-v\">--text-3 · opacity .6 · ×1</div>\n    </div>\n\n    <!-- نصف القطر -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">نصف القطر — ثلاث فئات</span>\n      <div style=\"display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap\">\n        <div style=\"text-align:center\">\n          <div style=\"width:64px;height:44px;background:#fff;box-shadow:var(--ring);border-radius:8px\"></div>\n          <div class=\"g-v\" style=\"text-align:center\">حاوية · 8px</div>\n        </div>\n        <div style=\"text-align:center\">\n          <div style=\"width:64px;height:32px;background:#fff;box-shadow:inset 0 0 0 1px var(--blue);border-radius:999px\"></div>\n          <div class=\"g-v\" style=\"text-align:center\">تحكّم · 999px</div>\n        </div>\n        <div style=\"text-align:center\">\n          <div style=\"width:40px;height:40px;background:#fff;box-shadow:var(--ring);border-radius:4px\"></div>\n          <div class=\"g-v\" style=\"text-align:center\">مصغّرة · 4px</div>\n        </div>\n      </div>\n    </div>\n\n    <!-- الارتفاع -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">الارتفاع — حلقة لا ظلّ</span>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <div style=\"flex:1 1 110px;background:#fff;border-radius:8px;box-shadow:var(--ring);padding:14px;text-align:center;font-size:12.5px\">✓ حلقة 1px</div>\n        <div style=\"flex:1 1 110px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:14px;text-align:center;font-size:12.5px;color:var(--bad)\">✕ ظلّ ناعم</div>\n      </div>\n      <div style=\"margin-block-start:12px;background:#fff;border-radius:8px;box-shadow:var(--float);padding:14px;text-align:center;font-size:12.5px\">الظلّ العائم — للقوائم والـtoast فقط</div>\n      <div class=\"g-v\">--shadow-float</div>\n    </div>\n\n    <!-- الأزرار -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">الأزرار</span>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n        <button class=\"btn solid\">إجراء أساسيّ</button>\n        <button class=\"btn\">إجراء ثانويّ</button>\n        <button class=\"btn\" style=\"width:32px;padding:0\" aria-label=\"مثال أيقونة\">✦</button>\n      </div>\n      <div class=\"g-v\">مرّر المؤشّر — الحلقة تسمك 1px→2px بلا حركة</div>\n      <div style=\"margin-block-start:12px;padding-block-start:12px;border-block-start:1px dashed var(--border)\">\n        <button class=\"hit\" style=\"box-shadow:inset 0 0 0 1px rgba(48,48,255,.22);border-radius:8px;padding-inline:4px\">\n          <span class=\"btn\" style=\"pointer-events:none\">هدف اللمس</span>\n        </button>\n        <div class=\"g-v\">غلاف 48px · مرئيّ 32px · WCAG 2.5.5</div>\n      </div>\n    </div>\n\n    <!-- البطاقة -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">البطاقة</span>\n      <div style=\"background:#fff;border-radius:8px;box-shadow:var(--ring);padding:16px\">\n        <div style=\"display:flex;gap:10px;align-items:center\">\n          <div style=\"width:40px;height:40px;border-radius:4px;background:linear-gradient(135deg,var(--blue),var(--teal));flex:none\"></div>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:16px;font-weight:700;line-height:1.25\">اسم الشريك</div>\n            <div style=\"font-size:12px;color:var(--t3);line-height:1.25\">الرياض · الرعاية الصحية</div>\n          </div>\n        </div>\n        <p style=\"font-size:14px;line-height:1.5;color:var(--t2);margin-block:10px 12px\">نصّ وصفيّ قصير بارتفاع سطر ١٫٥ لأنه محتوى يُقرأ.</p>\n        <button class=\"btn\">احجز موعد</button>\n      </div>\n      <div class=\"g-v\">حاوية 8px · شعار 4px · زرّ 999px · حشو 16px</div>\n    </div>\n\n    <!-- الشارات -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">الشارات</span>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <span class=\"tag ok\">موثّق</span>\n        <span class=\"tag info\">جديد</span>\n        <span class=\"tag warn\">ينتهي قريباً</span>\n        <span class=\"tag no\">متأخّر</span>\n      </div>\n      <div class=\"g-v\">اللون مرتبط بالمعنى — لا للزينة</div>\n    </div>\n\n    <!-- المسافات -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">سلّم المسافات — أساس 4px</span>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><i style=\"width:4px;height:14px;background:var(--blue);flex:none\"></i><span class=\"g-v\" style=\"margin:0\">4 — أيقونة ونصّ</span></div>\n        <div style=\"display:flex;align-items:center;gap:10px\"><i style=\"width:8px;height:14px;background:var(--blue);flex:none\"></i><span class=\"g-v\" style=\"margin:0\">8 — بين الكروت</span></div>\n        <div style=\"display:flex;align-items:center;gap:10px\"><i style=\"width:12px;height:14px;background:var(--blue);flex:none\"></i><span class=\"g-v\" style=\"margin:0\">12 — حشو رأسيّ</span></div>\n        <div style=\"display:flex;align-items:center;gap:10px\"><i style=\"width:16px;height:14px;background:var(--blue);flex:none\"></i><span class=\"g-v\" style=\"margin:0\">16 — حشو الكرت</span></div>\n        <div style=\"display:flex;align-items:center;gap:10px\"><i style=\"width:24px;height:14px;background:var(--blue);flex:none\"></i><span class=\"g-v\" style=\"margin:0\">24 — فجوة الأعمدة</span></div>\n        <div style=\"display:flex;align-items:center;gap:10px\"><i style=\"width:32px;height:14px;background:var(--blue);flex:none\"></i><span class=\"g-v\" style=\"margin:0\">32 — بين الأقسام</span></div>\n      </div>\n    </div>\n\n    <!-- الحقول -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">الحقول</span>\n      <input placeholder=\"اسم الشريك\" style=\"width:100%;height:40px;border:0;box-shadow:inset 0 0 0 1px var(--border);border-radius:999px;padding-inline:16px;font-family:inherit;font-size:14px;background:#fff;color:var(--t1)\">\n      <div class=\"g-v\">تحكّم → 999px · الحلقة بدل الحدّ</div>\n      <input placeholder=\"حقل مركَّز\" style=\"width:100%;height:40px;border:0;box-shadow:inset 0 0 0 2px var(--blue);border-radius:999px;padding-inline:16px;font-family:inherit;font-size:14px;background:#fff;color:var(--t1);margin-block-start:10px\">\n      <div class=\"g-v\">التركيز يسمك الحلقة — صفر إزاحة</div>\n    </div>\n\n    <!-- الحركة -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">الحركة</span>\n      <div class=\"mv\" style=\"width:100%;height:44px;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--teal));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700\">مرّر المؤشّر</div>\n      <div class=\"g-v\">.216s · cubic-bezier(.34,0,.21,1)</div>\n      <div class=\"g-v\" style=\"color:var(--bad)\">صفر <code>transition: all</code></div>\n    </div>\n\n    <!-- RTL -->\n    <div class=\"g-item\">\n      <span class=\"g-t\">الاتجاه</span>\n      <div style=\"background:#fff;border-radius:8px;box-shadow:var(--ring);padding:12px;display:flex;align-items:center;gap:8px\">\n        <span style=\"width:8px;height:8px;border-radius:999px;background:var(--teal);flex:none\"></span>\n        <span style=\"font-size:13px\">يبدأ من اليمين تلقائياً</span>\n        <span style=\"margin-inline-start:auto;font-size:12px;color:var(--t3)\">start ← end</span>\n      </div>\n      <div class=\"g-v\"><code>ps pe ms me start end</code> — صفر <code>left right</code></div>\n    </div>\n\n  </div>\n</section>\n\n<!-- ═══ ١ ═══ -->\n<section id=\"src\">\n  <h2><span class=\"n\">١</span> من أين جاءت كل قيمة</h2>\n  <p class=\"lede\">ثلاثة مصادر، ولكلٍّ وزن مختلف عند التعارض. هذا هو ما يجعل الملف مرجعاً لا رأياً.</p>\n\n  <table>\n    <thead><tr><th style=\"width:34%\">المصدر</th><th>ماذا يعطي</th><th style=\"width:22%\">الوزن عند التعارض</th></tr></thead>\n    <tbody>\n      <tr><td><code>modonty/app/globals.css</code></td><td>الهويّة: الألوان · الخط · القطر</td><td><span class=\"tag ok\">الأعلى — هذا ما يعمل فعلاً</span></td></tr>\n      <tr><td>قياس لينكدإن الحيّ</td><td>البنية: الظلال · الأوزان · الشبكة · اللمس</td><td><span class=\"tag info\">يفوز حين لا يخصّ الهويّة</span></td></tr>\n      <tr><td><code>DESIGN_SYSTEM.md</code> القديم</td><td>—</td><td><span class=\"tag no\">مُلغى</span></td></tr>\n    </tbody>\n  </table>\n\n  <div class=\"proof\">\n    <b>لماذا أُلغي القديم — سطر واحد يكفي</b>\n<pre><code><span class=\"c\">/* DESIGN_SYSTEM.md:53 — يوثّق هويّة منصّة أخرى */</span>\n<span class=\"k\">--primary</span>: <span class=\"x\">210 90% 40%</span>;   <span class=\"c\">/* #0a66c2 - LinkedIn's signature blue */</span>\n\n<span class=\"c\">/* globals.css:22 — ما يعمل فعلاً */</span>\n<span class=\"k\">--primary</span>: <span class=\"v\">240 100% 59%</span>;  <span class=\"c\">/* #3030FF — أزرق مدوّنتي */</span></code></pre>\n  </div>\n\n  <h3>القياس أُعيد على ثلاثة أسطح لا على صفحة واحدة</h3>\n  <p>صفحة واحدة تُنتج قاعدة هشّة. ما تكرّر في الثلاثة يُعتمد، وما اختلف يُذكر اختلافه صراحةً في هذا الملف.</p>\n  <table>\n    <thead><tr><th>السطح</th><th>العناصر</th><th>الغرض</th></tr></thead>\n    <tbody>\n      <tr><td><code>/feed/</code></td><td>١٬٥٨٨</td><td>المسح الأصلي</td></tr>\n      <tr><td><code>/top-content/</code></td><td>٤٢٤</td><td>تحقّق مستقلّ</td></tr>\n      <tr><td><code>/jobs/</code></td><td>٣١٢</td><td>تحقّق مستقلّ</td></tr>\n    </tbody>\n  </table>\n</section>\n\n<!-- ═══ ٢ ═══ -->\n<section id=\"brand\">\n  <h2><span class=\"n\">٢</span> الهويّة — من كودنا، لا تُستورد</h2>\n  <p class=\"lede\">يُنسخ الهيكل، ولا يُنسخ لون علامة ولا شعار ولا أيقونة. هذه ألواننا نحن.</p>\n\n  <div class=\"sw\">\n    <div><i style=\"background:#0B0A5C\"></i><span><b>--brand-navy</b>#0B0A5C · 245 87% 19%<br>النصّ · الترويسات</span></div>\n    <div><i style=\"background:#3030FF\"></i><span><b>--brand-blue</b>#3030FF · 240 100% 59%<br>primary · الروابط · CTA</span></div>\n    <div><i style=\"background:#00D8D8\"></i><span><b>--brand-teal</b>#00D8D8 · 180 100% 42%<br>accent · الشارات</span></div>\n    <div><i style=\"background:#f3f2ef\"></i><span><b>--background</b>#f3f2ef · 45 8% 95%<br>خلفية الصفحة</span></div>\n    <div><i style=\"background:#fff;box-shadow:inset 0 0 0 1px #dbdbdb\"></i><span><b>--card</b>#ffffff<br>سطح البطاقة</span></div>\n    <div><i style=\"background:#dbdbdb\"></i><span><b>--border</b>#dbdbdb · 0 0% 86%<br>الحلقة · الفواصل</span></div>\n  </div>\n\n  <h3>القاعدة: الصفحة ليست بيضاء</h3>\n  <p>البيج الدافئ خلف الكروت البيضاء هو ما يجعل الكرت <em>يُرى</em>. لو صارت الخلفية بيضاء اختفت حدود الكروت واحتجت ظلالاً لتعويضها — وهنا يبدأ الانحدار.</p>\n\n  <div class=\"demo\">\n    <span class=\"demo-label\">معاينة — بطاقة على الخلفية الصحيحة</span>\n    <div class=\"card-demo\">\n      <h4>عنوان البطاقة</h4>\n      <p>نصّ مساند بدرجة ثالثة. لاحظ أن الفصل عن الخلفية جاء من حلقة ١px فقط.</p>\n    </div>\n  </div>\n\n  <h3>الخط</h3>\n  <table>\n    <thead><tr><th>الخط</th><th>الاستعمال</th><th>الأوزان المحمّلة</th></tr></thead>\n    <tbody>\n      <tr><td>Tajawal</td><td>العربي — الأساس</td><td><code>400 · 500 · 700</code></td></tr>\n      <tr><td>Montserrat</td><td>اللاتيني والأرقام</td><td><code>400 · 500 · 600 · 700</code></td></tr>\n    </tbody>\n  </table>\n  <p>سلسلة واحدة تخدم الاثنين: المتصفّح يختار العربي للحروف العربية واللاتيني لغيرها تلقائياً. <b>لا تكتب <code>:lang(ar)</code> منفصلاً</b> — يكسر النصّ المختلط (اسم شركة إنجليزي داخل جملة عربية).</p>\n</section>\n\n<!-- ═══ ٣ ═══ -->\n<section id=\"shadow\">\n  <h2><span class=\"n\">٣</span> الظلال — أثقل تغيير، وأوضح دليل</h2>\n  <p class=\"lede\">صفر ظلّ داخل تدفّق الصفحة. الفصل يأتي من حلقة ١px. والظلّ محجوز لما يطفو فوق الصفحة.</p>\n\n  <div class=\"pair\">\n    <div class=\"box no\">\n      <b>✕ ما نفعله اليوم</b>\n<pre><code>&lt;Card className=<span class=\"x\">\"shadow-sm hover:shadow-md\"</span>&gt;</code></pre>\n      <p style=\"font-size:12.5px;color:var(--t3);margin:8px 0 0\">الشكل يصير «قالب مجاني». والظلّ الناعم لا يعطي حدّة الحلقة.</p>\n    </div>\n    <div class=\"box yes\">\n      <b>✓ الصحيح</b>\n<pre><code>&lt;Card className=<span class=\"v\">\"ring-1 ring-border\"</span>&gt;</code></pre>\n      <p style=\"font-size:12.5px;color:var(--t3);margin:8px 0 0\">حلقة ١px تعطي حدّة ونظافة لا يعطيها الظلّ.</p>\n    </div>\n  </div>\n\n  <div class=\"demo\">\n    <span class=\"demo-label\">معاينة — الفرق بالعين</span>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n      <div class=\"card-demo wrong\" style=\"max-width:250px\">\n        <h4 style=\"color:var(--bad)\">✕ بظلّ</h4>\n        <p><code>0 2px 8px rgba(0,0,0,.12)</code></p>\n      </div>\n      <div class=\"card-demo\" style=\"max-width:250px\">\n        <h4 style=\"color:var(--ok)\">✓ بحلقة</h4>\n        <p><code>0 0 0 1px #dbdbdb</code></p>\n      </div>\n    </div>\n  </div>\n\n  <h3>الحلقات الثلاث</h3>\n<pre><code><span class=\"k\">--ring-card</span>:   0 0 0 1px hsl(var(--border));            <span class=\"c\">/* الكرت */</span>\n<span class=\"k\">--ring-active</span>: inset 0 0 0 1px hsl(var(--foreground));  <span class=\"c\">/* الحالة النشطة */</span>\n<span class=\"k\">--ring-brand</span>:  inset 0 0 0 1px hsl(var(--primary));     <span class=\"c\">/* الزر الثانوي */</span>\n\n<span class=\"c\">/* الاستثناء الوحيد — ما يطفو فوق الصفحة */</span>\n<span class=\"k\">--shadow-float</span>: 0 0 1px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.6);</code></pre>\n\n  <h3>لماذا حلقة لا <code>border</code>؟</h3>\n  <p><code>box-shadow</code> لا تأخذ مساحة في التخطيط. تغيّر سمكها من ١px إلى ٢px عند التحويم بلا أن ينتفض العنصر ولا يزحف ما حوله.</p>\n  <div class=\"pair\">\n    <div class=\"box no\">\n      <b>✕ يسبّب ارتجاف التخطيط</b>\n<pre><code>.btn       { <span class=\"x\">border</span>: 1px solid var(--blue) }\n.btn:hover { <span class=\"x\">border</span>: 2px solid var(--navy) }</code></pre>\n    </div>\n    <div class=\"box yes\">\n      <b>✓ صفر حركة</b>\n<pre><code>.btn       { <span class=\"v\">box-shadow</span>: inset 0 0 0 1px var(--blue) }\n.btn:hover { <span class=\"v\">box-shadow</span>: inset 0 0 0 2px var(--navy) }</code></pre>\n    </div>\n  </div>\n\n  <div class=\"proof\">\n    <b>الدليل المقيس</b>\n<pre><code>/feed/         1,588 عنصراً → <span class=\"v\">صفر ظلّ حقيقي (blur&gt;0)</span> · 3 حلقات فقط\n/top-content/    424 عنصراً → كل الظلال من نمط  <span class=\"v\">0px 0px 0px 1px</span>\n/jobs/           312 عنصراً → 29 حلقة + <span class=\"v\">ظلّ عائم واحد</span> rgba(0,0,0,.3) 0 4px 12px</code></pre>\n    <b style=\"margin-block-start:10px\">ووضعنا الحالي</b>\n<pre><code>$ grep -rohE \"shadow-(sm|md|lg|xl|2xl)\" modonty/app modonty/components\n  <span class=\"x\">50 shadow-sm · 42 shadow-md · 25 shadow-lg · 3 shadow-2xl · 1 shadow-xl = 121</span>\n  <span class=\"c\">١٢١ ظلّاً، ولا حلقة واحدة.</span></code></pre>\n  </div>\n</section>\n\n<!-- ═══ ٤ ═══ -->\n<section id=\"type\">\n  <h2><span class=\"n\">٤</span> الطباعة</h2>\n  <p class=\"lede\">وزنان فقط، ونسبتان لارتفاع السطر. التمييز يأتي من الحجم واللون — لا من الوزن.</p>\n\n  <h3>٤.١ الوزن — <code>400</code> و <code>700</code> فقط</h3>\n  <p>لينكدإن يستعمل <code>400/600</code>. ونحن <b>لا نستطيع نسخها حرفياً</b>، والسبب قياسيّ لا ذوقيّ:</p>\n\n  <div class=\"proof\">\n    <b>تجوّال لا يملك الوزن ٦٠٠ أصلاً</b>\n<pre><code>$ curl fonts.googleapis.com/css2?family=Tajawal:wght@600\n  <span class=\"x\">HTTP 400</span>\n\n  المتاح في تجوّال: <span class=\"v\">200 · 300 · 400 · 500 · 700 · 800 · 900</span>\n  المحمَّل عندنا  (layout.tsx:17): <span class=\"v\">400 · 500 · 700</span></code></pre>\n    <b style=\"margin-block-start:10px\">فماذا يحدث الآن؟</b>\n<pre><code>$ grep -rohE \"font-(semibold|extrabold|black)\" modonty/app modonty/components\n  <span class=\"x\">176 font-semibold</span>   ← وزن 600، غير موجود في تجوّال\n  <span class=\"x\"> 54 font-extrabold</span>  ← 800، غير محمَّل\n  <span class=\"x\"> 33 font-black</span>      ← 900، غير محمَّل\n  <span class=\"c\">٢٦٣ موضعاً تطلب وزناً لا يملكه الخط → المتصفّح يزيّفه، والثِّقَل يختلف بين جهاز وآخر.</span></code></pre>\n  </div>\n\n  <table>\n    <thead><tr><th>المستعمل الآن</th><th>البديل</th><th>لماذا</th></tr></thead>\n    <tbody>\n      <tr><td><code>font-medium</code> · <code>font-semibold</code></td><td><code>font-bold</code></td><td>٥٠٠ ضعيف للتمييز، و٦٠٠ غير موجود</td></tr>\n      <tr><td><code>font-extrabold</code> · <code>font-black</code></td><td><code>font-bold</code></td><td>غير محمَّلة — تزييف</td></tr>\n    </tbody>\n  </table>\n\n  <div class=\"demo\">\n    <span class=\"demo-label\">معاينة — وزنان يكفيان</span>\n    <p style=\"font-weight:400;font-size:15px;margin:0 0 6px\">وزن ٤٠٠ — نصّ عاديّ، وهو الأغلبية الساحقة في أيّ صفحة.</p>\n    <p style=\"font-weight:700;font-size:15px;margin:0 0 12px\">وزن ٧٠٠ — عنوان أو تأكيد، ولا شيء بينهما.</p>\n    <p style=\"font-weight:400;font-size:20px;margin:0 0 6px;color:var(--t1)\">التمييز من <b style=\"font-weight:700\">الحجم</b>…</p>\n    <p style=\"font-weight:400;font-size:15px;margin:0;color:var(--t3)\">…ومن اللون. هذا يكفي لبناء تسلسل هرميّ كامل.</p>\n  </div>\n\n  <h3>٤.٢ ارتفاع السطر — نسبتان لا واحدة</h3>\n  <p>أذكى نقطة في النظام المقيس: <b>نفس الحجم له ارتفاعان بحسب السياق</b>. أغلب الأنظمة تعطي ارتفاعاً واحداً لكل حجم، فتخرج الواجهة فضفاضة أو المحتوى خانقاً.</p>\n<pre><code><span class=\"k\">--lh-tight</span>:   1.25;  <span class=\"c\">/* واجهة: أزرار · labels · عناوين بطاقات · سطر أو سطران */</span>\n<span class=\"k\">--lh-relaxed</span>: 1.5;   <span class=\"c\">/* محتوى: فقرات · نصّ المقال · قراءة متواصلة */</span></code></pre>\n\n  <div class=\"demo\">\n    <span class=\"demo-label\">معاينة — نفس الحجم ١٤px، سياقان</span>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n      <div style=\"background:#fff;padding:12px;border-radius:var(--r-card);box-shadow:var(--ring)\">\n        <div style=\"font-size:11px;color:var(--t3);margin-block-end:6px\">1.25 — واجهة</div>\n        <div style=\"font-size:14px;line-height:1.25\">حفظ التغييرات ونشر المقال على الموقع مباشرة</div>\n      </div>\n      <div style=\"background:#fff;padding:12px;border-radius:var(--r-card);box-shadow:var(--ring)\">\n        <div style=\"font-size:11px;color:var(--t3);margin-block-end:6px\">1.5 — محتوى</div>\n        <div style=\"font-size:14px;line-height:1.5\">حفظ التغييرات ونشر المقال على الموقع مباشرة</div>\n      </div>\n    </div>\n  </div>\n  <p><b>والعربي يحتاج <code>1.5</code> أكثر من اللاتيني</b> — التشكيل فوق الحرف والنقاط تحت خطّ الأساس. لا تنزل تحتها في نصّ المقال.</p>\n\n  <h3>٤.٣ السلّم</h3>\n  <table>\n    <thead><tr><th>الاسم</th><th>المقاس / السطر</th><th>الوزن</th><th>الاستعمال</th></tr></thead>\n    <tbody>\n      <tr><td>caption</td><td><code>12 / 15</code></td><td>400</td><td>طوابع زمنية · ميتاداتا</td></tr>\n      <tr><td>ui</td><td><code>14 / 17.5</code></td><td>400 · 700</td><td><b>الافتراضي</b> — أزرار · بطاقات صغيرة</td></tr>\n      <tr><td>body</td><td><code>14 / 21</code></td><td>400</td><td>نصّ طويل</td></tr>\n      <tr><td>title-sm</td><td><code>16 / 20</code></td><td>700</td><td>عناوين البطاقات</td></tr>\n      <tr><td>title-md</td><td><code>20 / 25</code></td><td>700</td><td>عناوين الأقسام</td></tr>\n      <tr><td>title-lg</td><td><code>24 / 27</code></td><td>700</td><td>عنوان الصفحة</td></tr>\n    </tbody>\n  </table>\n  <p><code>letter-spacing: normal</code> في كل مكان. أيّ عبث بالتباعد يكسر العربي أوّلاً.</p>\n</section>\n\n<!-- ═══ ٥ ═══ -->\n<section id=\"radius\">\n  <h2><span class=\"n\">٥</span> نصف القطر — ثلاث فئات لا تُخلط</h2>\n  <p class=\"lede\">التباين بين حاوية شبه مربّعة وتحكّم بيضاويّ تماماً هو ما يجعل الزرّ يقول «أنا زرّ».</p>\n\n  <table>\n    <thead><tr><th>الفئة</th><th>القيمة</th><th>الأمثلة</th></tr></thead>\n    <tbody>\n      <tr><td><b>حاوية</b></td><td><code>rounded-lg</code> — 8px</td><td>كرت · قسم · نافذة</td></tr>\n      <tr><td><b>تحكّم</b></td><td><code>rounded-full</code> — 999px</td><td>زر · حقل · شارة · أفاتار</td></tr>\n      <tr><td><b>مصغّرة</b></td><td><code>rounded-sm</code> — 4px</td><td>شعار كيان · thumbnail</td></tr>\n    </tbody>\n  </table>\n\n  <div class=\"demo\">\n    <span class=\"demo-label\">معاينة — الخلط يقتل «قابليّة النقر»</span>\n    <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n      <div style=\"background:#fff;border-radius:8px;box-shadow:var(--ring);padding:16px\">\n        <div style=\"font-size:11px;color:var(--bad);font-weight:700;margin-block-end:10px\">✕ زرّ بقطر الحاوية</div>\n        <button class=\"btn\" style=\"border-radius:8px\">احجز موعد</button>\n        <p style=\"font-size:12px;color:var(--t3);margin:10px 0 0;max-width:180px\">يذوب في الكرت</p>\n      </div>\n      <div style=\"background:#fff;border-radius:8px;box-shadow:var(--ring);padding:16px\">\n        <div style=\"font-size:11px;color:var(--ok);font-weight:700;margin-block-end:10px\">✓ زرّ بيضاويّ</div>\n        <button class=\"btn\">احجز موعد</button>\n        <p style=\"font-size:12px;color:var(--t3);margin:10px 0 0;max-width:180px\">ينفصل ويقول «أنا زرّ»</p>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"proof\">\n    <b>ملاحظة أمانة — الثابت هو القاعدة لا الرقم</b>\n<pre><code>مقياس القطر يختلف بين أسطح لينكدإن نفسها:\n  /feed/         غالبه  <span class=\"v\">999 / 4 / 8</span>\n  /top-content/  غالبه  <span class=\"v\">16px</span>  (×57)\n  /jobs/         غالبه  <span class=\"v\">24px</span>  (×28)\n<span class=\"c\">فالثابت المؤكَّد ليس الرقم، بل فصل الفئات الثلاث.</span></code></pre>\n    <b style=\"margin-block-start:10px\">ووضعنا</b>\n<pre><code>rounded-full 190 · rounded-md 150 · rounded-lg 96 · rounded-xl 85 · rounded-2xl 64\n<span class=\"c\">خمسة مقاسات للحاويات بلا قاعدة → تُوحَّد على lg.</span></code></pre>\n  </div>\n</section>\n\n<!-- ═══ ٦ ═══ -->\n<section id=\"space\">\n  <h2><span class=\"n\">٦</span> المسافات</h2>\n  <p class=\"lede\">الأساس <b>4px</b> لا 8px صارم. السلّم فيه <code>4 · 12 · 20</code> — أي مرونة أكبر بلا فوضى.</p>\n  <table>\n    <thead><tr><th>القيمة</th><th>Tailwind</th><th>الاستعمال الأكثر</th></tr></thead>\n    <tbody>\n      <tr><td><code>4px</code></td><td><code>gap-1</code></td><td>بين أيقونة ونصّ</td></tr>\n      <tr><td><code>8px</code></td><td><code>gap-2</code></td><td>بين كروت الشريط الجانبي</td></tr>\n      <tr><td><code>12px</code></td><td><code>p-3</code></td><td>حشو رأسيّ داخل الكرت</td></tr>\n      <tr><td><code>16px</code></td><td><code>p-4</code></td><td><b>حشو الكرت الأفقي — الأكثر استعمالاً</b></td></tr>\n      <tr><td><code>24px</code></td><td><code>gap-6</code></td><td>فجوة أعمدة الشبكة</td></tr>\n      <tr><td><code>32px</code></td><td><code>gap-8</code></td><td>بين الأقسام الكبرى</td></tr>\n    </tbody>\n  </table>\n</section>\n\n<!-- ═══ ٧ ═══ -->\n<section id=\"layout\">\n  <h2><span class=\"n\">٧</span> التخطيط</h2>\n  <p class=\"lede\">نقطة نتّفق فيها مع القياس أصلاً — <code>1128px</code> مستعملة عندنا ٧٦ مرّة.</p>\n<pre><code><span class=\"k\">max-width</span>: <span class=\"v\">1128px</span>;   <span class=\"c\">/* الحاوية */</span>\n<span class=\"k\">column-gap</span>: <span class=\"v\">24px</span>;\n<span class=\"k\">row-gap</span>: <span class=\"v\">16px</span>;</code></pre>\n\n  <div class=\"proof\">\n    <b>مؤكَّدة في الطرفين</b>\n<pre><code>لينكدإن /jobs/ : max-width: <span class=\"v\">1128px</span>  ×12\nكودنا          : <span class=\"v\">max-w-[1128px]</span>     ×76</code></pre>\n  </div>\n\n  <h3>للعربي — RTL</h3>\n  <div class=\"pair\">\n    <div class=\"box no\">\n      <b>✕ ينكسر عند قلب الاتجاه</b>\n<pre><code>className=<span class=\"x\">\"pl-4 mr-2 text-left\"</span>\ngrid-column: <span class=\"x\">rail-left</span></code></pre>\n    </div>\n    <div class=\"box yes\">\n      <b>✓ يعمل في الاتجاهين</b>\n<pre><code>className=<span class=\"v\">\"ps-4 me-2 text-start\"</span>\ngrid-column: <span class=\"v\">rail-start</span></code></pre>\n    </div>\n  </div>\n  <p>الشبكة تنقلب تلقائياً مع <code>dir=\"rtl\"</code> بلا إعادة تعريف — بشرط ألّا تكون سمّيت مناطقك <code>left</code>/<code>right</code>.</p>\n</section>\n\n<!-- ═══ ٨ ═══ -->\n<section id=\"touch\">\n  <h2><span class=\"n\">٨</span> اللمس — 48px لكل عنصر تفاعليّ</h2>\n  <p class=\"lede\">الشكل المرئيّ 32px، والغلاف الشفّاف 48px. المستخدم يرى زرّاً أنيقاً صغيراً، وإصبعه يصيب مساحة كبيرة.</p>\n\n  <p>زرّ بارتفاع 32px يسقط في معيار <b>WCAG 2.5.5</b> (44×44 حدّاً أدنى). وبدل تكبيره بصرياً وإفساد الكثافة، يُلَفّ في هدف لمس أكبر.</p>\n\n<pre><code>&lt;button className=<span class=\"v\">\"flex min-h-[48px] items-center bg-transparent p-0\"</span>&gt;\n  &lt;span className=<span class=\"v\">\"flex h-8 items-center rounded-full px-3\"</span>&gt;احجز&lt;/span&gt;\n&lt;/button&gt;</code></pre>\n\n  <div class=\"demo\">\n    <span class=\"demo-label\">معاينة — الحدّان مرئيّان (الخارجي هدف اللمس)</span>\n    <button class=\"hit\" style=\"box-shadow:inset 0 0 0 1px rgba(48,48,255,.25);border-radius:8px;padding-inline:4px\">\n      <span class=\"btn\" style=\"pointer-events:none\">احجز موعد</span>\n    </button>\n    <p style=\"font-size:12px;color:var(--t3);margin:10px 0 0\">الغلاف 48px · الشكل المرئيّ 32px</p>\n  </div>\n\n  <div class=\"proof\">\n    <b>مؤكَّد حيّاً</b>\n<pre><code>ارتفاعات الأزرار على /jobs/ : 18 · 25 · <span class=\"v\">32</span> · 36 · 41 · <span class=\"v\">48</span> · 58</code></pre>\n  </div>\n</section>\n\n<!-- ═══ ٩ ═══ -->\n<section id=\"text\">\n  <h2><span class=\"n\">٩</span> النصّ — شفافية لا ألوان صريحة</h2>\n  <p class=\"lede\">نفس القيمة تعمل فوق الأبيض والبيج معاً. اللون الصريح ينكسر فوق أحدهما.</p>\n\n  <div class=\"demo\">\n    <span class=\"demo-label\">معاينة — الدرجات الثلاث فوق سطحين</span>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n      <div style=\"background:#fff;padding:14px;border-radius:var(--r-card);box-shadow:var(--ring)\">\n        <div style=\"font-size:11px;color:var(--t3);margin-block-end:8px\">فوق الأبيض</div>\n        <p style=\"color:var(--t1);margin:0 0 4px;font-size:14px\">أساسيّ — .9</p>\n        <p style=\"color:var(--t2);margin:0 0 4px;font-size:14px\">ثانويّ — .75</p>\n        <p style=\"color:var(--t3);margin:0;font-size:14px\">ثالثيّ — .6</p>\n      </div>\n      <div style=\"background:var(--bg);padding:14px;border-radius:var(--r-card);box-shadow:var(--ring)\">\n        <div style=\"font-size:11px;color:var(--t3);margin-block-end:8px\">فوق البيج</div>\n        <p style=\"color:var(--t1);margin:0 0 4px;font-size:14px\">أساسيّ — .9</p>\n        <p style=\"color:var(--t2);margin:0 0 4px;font-size:14px\">ثانويّ — .75</p>\n        <p style=\"color:var(--t3);margin:0;font-size:14px\">ثالثيّ — .6</p>\n      </div>\n    </div>\n  </div>\n\n<pre><code><span class=\"k\">--text-1</span>: hsl(var(--foreground) / .9);   <span class=\"c\">/* أساسيّ */</span>\n<span class=\"k\">--text-2</span>: hsl(var(--foreground) / .75);  <span class=\"c\">/* ثانويّ */</span>\n<span class=\"k\">--text-3</span>: hsl(var(--foreground) / .6);   <span class=\"c\">/* ثالثيّ */</span></code></pre>\n\n  <div class=\"proof\">\n    <b>النسبة المقيسة ≈ ٤ : ١ : ١</b>\n<pre><code>rgba(0,0,0,.9)   /feed/ ×985  ·  /top-content/ ×224   ← الأغلبية الساحقة\nrgba(0,0,0,.75)         ×234  ·                 ×67\nrgba(0,0,0,.6)          ×228  ·                 ×84</code></pre>\n  </div>\n  <p><b>لا تجعل الصفحة كلها رمادية «عشان تبان ناعمة»</b> — النتيجة صفحة بلا تسلسل هرميّ. الأغلبية نصّ أساسيّ، والدرجات الأخفّ تُستعمل بحذر.</p>\n  <p>الكحليّ <code>#0B0A5C</code> قرار هويّة نُبقيه — لكن الدرجات الثلاث تُبنى منه بالشفافية، لا بألوان رمادية جديدة.</p>\n</section>\n\n<!-- ═══ ١٠ ═══ -->\n<section id=\"check\">\n  <h2><span class=\"n\">١٠</span> قائمة التحقّق قبل أيّ شاشة</h2>\n  <table>\n    <tbody>\n      <tr><td style=\"width:34px\">☐</td><td>صفر <code>shadow-*</code> داخل التدفّق — <code>ring-1 ring-border</code> بدلها</td></tr>\n      <tr><td>☐</td><td>الظلّ للطبقات العائمة فقط (قائمة منسدلة · toast)</td></tr>\n      <tr><td>☐</td><td>التحويم يغيّر سمك الحلقة لا سمك الحدّ</td></tr>\n      <tr><td>☐</td><td>وزنان: <code>font-normal</code> و<code>font-bold</code> — صفر <code>semibold</code>/<code>extrabold</code>/<code>black</code></td></tr>\n      <tr><td>☐</td><td><code>1.25</code> للواجهة · <code>1.5</code> للمحتوى</td></tr>\n      <tr><td>☐</td><td>حاوية <code>rounded-lg</code> · تحكّم <code>rounded-full</code> · مصغّرة <code>rounded-sm</code></td></tr>\n      <tr><td>☐</td><td>كل تفاعليّ في هدف لمس <code>48px</code></td></tr>\n      <tr><td>☐</td><td><code>ps/pe/ms/me/start/end</code> — صفر <code>left</code>/<code>right</code></td></tr>\n      <tr><td>☐</td><td>الحاوية <code>max-w-[1128px]</code></td></tr>\n      <tr><td>☐</td><td>الألوان من <code>globals.css</code> — صفر لون مكتوب باليد</td></tr>\n      <tr><td>☐</td><td><code>transition</code> على خاصيّة محدّدة، لا <code>all</code></td></tr>\n    </tbody>\n  </table>\n</section>\n\n<!-- ═══ ١١ ═══ -->\n<section id=\"errors\">\n  <h2><span class=\"n\">١١</span> الأخطاء الخمسة التي تكسر النظام</h2>\n  <table>\n    <thead><tr><th style=\"width:26%\">الخطأ</th><th style=\"width:30%\">الأثر</th><th>الصحيح</th></tr></thead>\n    <tbody>\n      <tr><td><code>shadow-sm</code> على الكرت</td><td>الشكل يصير «قالب مجاني»</td><td><code>ring-1 ring-border</code></td></tr>\n      <tr><td>خلفية الصفحة بيضاء</td><td>الكروت تختفي</td><td><code>bg-background</code> البيج</td></tr>\n      <tr><td><code>rounded-lg</code> على الأزرار</td><td>الزرّ يذوب في الكرت</td><td><code>rounded-full</code></td></tr>\n      <tr><td><code>font-semibold</code></td><td>وزن لا يملكه تجوّال → تزييف</td><td><code>font-bold</code></td></tr>\n      <tr><td><code>border: 1px → 2px</code> عند التحويم</td><td>ارتجاف التخطيط</td><td><code>ring</code> بدل <code>border</code></td></tr>\n    </tbody>\n  </table>\n</section>\n\n<!-- ═══ ١٢ ═══ -->\n<section id=\"todo\">\n  <h2><span class=\"n\">١٢</span> ما لم يُتحقّق منه بعد</h2>\n  <p class=\"lede\">أمانةً — هذه ادّعاءات في المسح الأصلي لم تُعَد قياستها. استعملها كإرشاد، لا كقاعدة.</p>\n  <ul class=\"plain\">\n    <li>شبكة <b>٢٤ عموداً</b> بعرض مسار <code>17.01px</code> — قِيست على <code>/feed/</code> عند <code>1117px</code> فقط.</li>\n    <li>ارتفاع شريط التنقّل <code>52px</code>.</li>\n    <li>ألوان أيقونات المُنشئ (<code>#44712E</code> · <code>#B24020</code>).</li>\n  </ul>\n</section>\n\n<footer>\n  نظام تصميم مدوّنتي — يحلّ محلّ <code>DESIGN_SYSTEM.md</code> و<code>modonty-linkedin-pattren.md</code> · النسخة النصّية: <code>DESIGN-SYSTEM.md</code>\n</footer>\n\n</div>\n</body>\n</html>\n","portal":"<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n<title>دليل استخدام بوابة العملاء — مودونتي</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#f6f8fb;\n    --card:#ffffff;\n    --ink:#0f172a;\n    --muted:#64748b;\n    --line:#e5e7eb;\n    --brand:#1e58c8;\n    --brand-soft:#e8efff;\n    --accent:#f59e0b;\n    --ok:#10b981;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:\"Tajawal\",system-ui,sans-serif;font-size:16px;line-height:1.7}\n  a{color:var(--brand);text-decoration:none}\n  a:hover{text-decoration:underline}\n\n  /* layout */\n  .wrap{display:grid;grid-template-columns:280px 1fr;gap:0;max-width:1400px;margin:0 auto;min-height:100vh}\n  aside.toc{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:#fff;border-inline-start:1px solid var(--line);padding:24px 18px}\n  aside.toc .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:var(--ink);margin-bottom:6px}\n  aside.toc .brand .dot{width:10px;height:10px;background:var(--brand);border-radius:50%}\n  aside.toc .sub{font-size:12px;color:var(--muted);margin-bottom:18px}\n  aside.toc nav{display:flex;flex-direction:column;gap:2px}\n  aside.toc nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);font-size:14px}\n  aside.toc nav a:hover{background:var(--brand-soft);text-decoration:none}\n  aside.toc nav a .num{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;background:#f1f5f9;border-radius:50%;font-size:11px;color:var(--muted);font-weight:700}\n  aside.toc nav .group-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:14px;padding:0 10px}\n\n  main{padding:48px 56px;max-width:980px}\n  .hero{background:linear-gradient(135deg,#1e58c8 0%,#3b82f6 100%);color:#fff;border-radius:18px;padding:46px 40px;margin-bottom:48px;position:relative;overflow:hidden}\n  .hero::after{content:\"\";position:absolute;inset:auto -80px -80px auto;width:280px;height:280px;background:rgba(255,255,255,.08);border-radius:50%}\n  .hero h1{margin:0 0 10px;font-size:34px;font-weight:900;line-height:1.25}\n  .hero p{margin:0;font-size:16px;opacity:.92;max-width:560px}\n  .hero .meta{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}\n  .hero .meta span{background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500}\n\n  section.chap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;margin-bottom:28px;scroll-margin-top:20px}\n  section.chap h2{margin:0 0 6px;font-size:24px;font-weight:900;display:flex;align-items:center;gap:12px}\n  section.chap h2 .badge{background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}\n  section.chap .lead{color:var(--muted);font-size:15px;margin:0 0 20px}\n\n  .fig{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fafbfd;margin:18px 0}\n  .fig img{display:block;width:100%;height:auto}\n  .hot{position:absolute;width:30px;height:30px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;box-shadow:0 0 0 4px rgba(245,158,11,.25),0 2px 8px rgba(0,0,0,.25);z-index:2}\n  .hot::after{content:\"\";position:absolute;width:60px;height:60px;border:2px dashed var(--accent);border-radius:50%;opacity:.45}\n\n  .steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}\n  .steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:12px 14px}\n  .steps li .n{width:26px;height:26px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}\n  .steps li .t{font-size:14.5px}\n  .steps li .t b{display:block;margin-bottom:2px}\n\n  .note{background:#fef9c3;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;font-size:14px;margin-top:14px}\n  .note b{color:#92400e}\n  .tip{background:#dcfce7;border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;font-size:14px;margin-top:14px}\n  .tip b{color:#065f46}\n\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}\n  .stat{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:14px}\n  .stat .k{font-size:12px;color:var(--muted)}\n  .stat .v{font-size:22px;font-weight:900;color:var(--brand)}\n\n  footer{padding:40px;text-align:center;color:var(--muted);font-size:13px}\n  footer b{color:var(--ink)}\n\n  @media (max-width:900px){\n    .wrap{grid-template-columns:1fr}\n    aside.toc{position:relative;height:auto;border-inline-start:none;border-bottom:1px solid var(--line)}\n    main{padding:24px}\n  }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <aside class=\"toc\">\n    <div class=\"brand\"><span class=\"dot\"></span> مودونتي · بوابة العملاء</div>\n    <div class=\"sub\">دليل الاستخدام الكامل · v١</div>\n    <nav>\n      <span class=\"group-title\">الأول</span>\n      <a href=\"#s1\"><span class=\"num\">١</span> الصفحة الرئيسية</a>\n      <a href=\"#s2\"><span class=\"num\">٢</span> كيف تدخل</a>\n      <a href=\"#s3\"><span class=\"num\">٣</span> الجولة السريعة</a>\n\n      <span class=\"group-title\">عبّي بياناتك</span>\n      <a href=\"#s4\"><span class=\"num\">٤</span> بيانات شركتك</a>\n      <a href=\"#s5\"><span class=\"num\">٥</span> خبّرنا عن نشاطك</a>\n\n      <span class=\"group-title\">مقالاتك</span>\n      <a href=\"#s6\"><span class=\"num\">٦</span> مقالاتك</a>\n      <a href=\"#s7\"><span class=\"num\">٧</span> رصيدك الشهري</a>\n      <a href=\"#s8\"><span class=\"num\">٨</span> صورك</a>\n\n      <span class=\"group-title\">قياس النتائج</span>\n      <a href=\"#s9\"><span class=\"num\">٩</span> الإحصائيات</a>\n      <a href=\"#s10\"><span class=\"num\">١٠</span> صحة موقعك</a>\n\n      <span class=\"group-title\">زوارك وعملاؤك</span>\n      <a href=\"#s11\"><span class=\"num\">١١</span> المشتركين</a>\n      <a href=\"#s12\"><span class=\"num\">١٢</span> العملاء المحتملون</a>\n      <a href=\"#s13\"><span class=\"num\">١٣</span> أسئلة الزوار</a>\n      <a href=\"#s14\"><span class=\"num\">١٤</span> تعليقات المقالات</a>\n      <a href=\"#s15\"><span class=\"num\">١٥</span> تقييم شركتك</a>\n      <a href=\"#s16\"><span class=\"num\">١٦</span> أسئلة جاهزة</a>\n\n      <span class=\"group-title\">حسابك</span>\n      <a href=\"#s17\"><span class=\"num\">١٧</span> الإعدادات</a>\n      <a href=\"#s18\"><span class=\"num\">١٨</span> رسائل الزوار</a>\n    </nav>\n  </aside>\n\n  <main>\n    <div class=\"hero\">\n      <h1>أهلاً بك في بوابتك</h1>\n      <p>هذا دليلك خطوة بخطوة. هنشرح لك كل صفحة بكلام بسيط: إيش وظيفتها، وإيش بتستفيد منها. مفيش تقنيات معقّدة — كله واضح ومريح.</p>\n      <div class=\"meta\">\n        <span>⏱ وقت القراءة: ١٢ دقيقة</span>\n        <span>📸 ١٦ لقطة شاشة</span>\n        <span>🟢 يُحدّث باستمرار</span>\n      </div>\n    </div>\n\n    <!-- ١ -->\n    <section class=\"chap\" id=\"s1\">\n      <h2><span class=\"badge\">١</span> الصفحة الرئيسية</h2>\n      <p class=\"lead\">أول صفحة تشوفها لما تدخل. ملخّص سريع لكل اللي صار على موقعك في آخر شهر — بدون ما تدخل في تفاصيل.</p>\n      <div class=\"fig\">\n        <img src=\"img/01-dashboard.png\" alt=\"لوحة التحكم الرئيسية\" />\n        <div class=\"hot\" style=\"top:6%;right:14%\">١</div>\n        <div class=\"hot\" style=\"top:32%;right:30%\">٢</div>\n        <div class=\"hot\" style=\"top:62%;right:65%\">٣</div>\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>اسم شركتك في الأعلى</b>عشان تتأكد إنك داخل على حسابك الصح.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>أرقام شهرك</b>كم مقال انتشر، كم واحد شاف موقعك، كم واحد اشترك جديد.</div></li>\n        <li><span class=\"n\">٣</span><div class=\"t\"><b>تنبيهات تستنّاك</b>لو فيه تعليق محتاج موافقتك أو رسالة عميل محتاجة رد — هتطلع لك هنا.</div></li>\n      </ul>\n      <div class=\"tip\"><b>نصيحة:</b> ابدأ يومك من هنا — نص دقيقة يعطوك صورة كاملة عن كل شي.</div>\n    </section>\n\n    <!-- ٢ -->\n    <section class=\"chap\" id=\"s2\">\n      <h2><span class=\"badge\">٢</span> كيف تدخل</h2>\n      <p class=\"lead\">سهلة. رابطك وبياناتك وصلوك من فريقنا في رسالة واتساب. تسجل دخول مرة واحدة بس وخلاص.</p>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>افتح المتصفح واكتب:</b> <code>console.modonty.com</code></div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>إيميلك وكلمة المرور</b>هم نفس اللي وصلوك من مودونتي. انسخ والصق علشان ما تكتب غلط.</div></li>\n        <li><span class=\"n\">٣</span><div class=\"t\"><b>اضغط \"دخول\"</b>وخلاص. ما بتحتاج تسجّل دخول كل مرة — البوابة بتفتكر إنك أنت.</div></li>\n      </ul>\n      <div class=\"note\"><b>مهم:</b> ما تعطي حد بياناتك. لو نسيت الباسورد كلّمنا على الواتساب وبنرسلها لك.</div>\n    </section>\n\n    <!-- ٣ -->\n    <section class=\"chap\" id=\"s3\">\n      <h2><span class=\"badge\">٣</span> الجولة السريعة</h2>\n      <p class=\"lead\">خليني أوريك أين الأشياء قبل ما نبدأ. شغلتين بس لازم تعرفهم: القائمة الكبيرة على اليمين، والأدوات السريعة على اليسار فوق.</p>\n      <div class=\"fig\">\n        <img src=\"img/01-dashboard.png\" alt=\"الواجهة الرئيسية بسهام توضيحية\" />\n        <div class=\"hot\" style=\"top:14%;right:8%\">١</div>\n        <div class=\"hot\" style=\"top:6%;left:6%\">٢</div>\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>القائمة الرئيسية (يمين)</b>كل صفحاتك المهمة هنا: شركتك، مقالاتك، صورك، إحصائياتك. اضغط على أي اسم وتنقلك له.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>الأدوات السريعة (يسار فوق)</b>أيقونات صغيرة للحاجات اللي بتفتحها كثير: إعدادات حسابك، رسائل الدعم، تعليقات، أسئلة. الرقم الأحمر يقول لك \"فيه شي جديد\".</div></li>\n      </ul>\n    </section>\n\n    <!-- ٤ -->\n    <section class=\"chap\" id=\"s4\">\n      <h2><span class=\"badge\">٤</span> ابدأ من هنا — عبّي بيانات شركتك</h2>\n      <p class=\"lead\">ده ملف شركتك الكامل. كل ما عبّيت بيانات أكثر، كل ما عرفك جوجل أحسن، وظهرت قدّام عملاء أكثر بدون ما تدفع إعلانات. خصصها ٢٠ دقيقة مرة واحدة وخلاص.</p>\n      <div class=\"fig\">\n        <img src=\"img/02-profile.png\" alt=\"نموذج بيانات الشركة\" />\n        <div class=\"hot\" style=\"top:5%;right:6%\">١</div>\n        <div class=\"hot\" style=\"top:10%;right:38%\">٢</div>\n        <div class=\"hot\" style=\"top:32%;right:40%\">٣</div>\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>شريط أزرق فوق</b>يوريك كم عبّيت من بياناتك. هدفك تخلي الشريط كامل.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>الصفحة مقسّمة لـ ٦ أجزاء</b>: اسم شركتك، طرق التواصل، عنوانك، سجلك التجاري، معلومات عن نشاطك، ورابطك. لا تضغط نفسك — عبّي اللي تعرفه دلوقتي وارجع للباقي بعدين.</div></li>\n        <li><span class=\"n\">٣</span><div class=\"t\"><b>زر \"حفظ التغييرات\"</b>تحت الصفحة. اضغطه كل ما تخلّص جزء.</div></li>\n      </ul>\n      <div class=\"tip\"><b>ليش يهمك:</b> الشركات اللي تكمّل بياناتها بتظهر قدّام عملاء جدد بمعدّل ٣ أضعاف الشركات اللي بياناتها ناقصة.</div>\n    </section>\n\n    <!-- ٥ -->\n    <section class=\"chap\" id=\"s5\">\n      <h2><span class=\"badge\">٥</span> خبّرنا عن نشاطك</h2>\n      <p class=\"lead\">احنا بنكتب لك مقالات. عشان نكتب حاجة عميلك يحبّها فعلاً، لازم نعرف أنت بتعمل إيش وعميلك مين. هنا تكتب الإجابات وفريقنا بيقراها.</p>\n      <div class=\"fig\">\n        <img src=\"img/03-seo.png\" alt=\"نموذج معلومات النشاط\" />\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>وصف مختصر</b>إيش نشاطك بكلمتين، وفي إيش متخصّص.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>مين عميلك المثالي</b>الزبون اللي تتمنى يدخل عليك كل يوم. وصفه: عمره، اهتماماته، إيش يحب يسمع.</div></li>\n        <li><span class=\"n\">٣</span><div class=\"t\"><b>روابطك الاجتماعية + مدنك + ساعات شغلك</b>كل ده بيظهر للزائر في صفحتك.</div></li>\n      </ul>\n      <div class=\"tip\"><b>صدّقني:</b> ١٠ دقايق هنا توفّر عليك ساعات من التعديلات على المقالات بعدين.</div>\n    </section>\n\n    <!-- ٦ -->\n    <section class=\"chap\" id=\"s6\">\n      <h2><span class=\"badge\">٦</span> مقالاتك</h2>\n      <p class=\"lead\">كل المقالات اللي بنكتبها لك بتظهر هنا. ما بننشر شي إلا بعد ما تشوفه وتوافق. ده موقعك ومسؤوليتك — احنا بس بنساعد.</p>\n      <div class=\"fig\">\n        <img src=\"img/04-articles.png\" alt=\"صفحة المقالات\" />\n        <div class=\"hot\" style=\"top:32%;right:38%\">١</div>\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>٤ أزرار فوق</b>: <b>بانتظار الموافقة</b> (محتاج ردك) · <b>مجدولة</b> (متفق على نشرها لاحقاً) · <b>منشور</b> (موجودة فعلاً على موقعك) · <b>الكل</b> (مرّة وحدة).</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>افتح المقال</b>تقرا العنوان والمحتوى والصور — لو عاجبك اضغط \"موافق\"، لو محتاج تعديل اكتب لنا إيش تبي يتغير.</div></li>\n      </ul>\n    </section>\n\n    <!-- ٧ -->\n    <section class=\"chap\" id=\"s7\">\n      <h2><span class=\"badge\">٧</span> كم مقال باقي ليك الشهر ده</h2>\n      <p class=\"lead\">باقتك فيها عدد معيّن من المقالات في الشهر (مثلاً ٨ مقالات). هنا تشوف كم استخدمت وكم باقي ومتى يبدأ شهرك الجديد.</p>\n      <div class=\"fig\">\n        <img src=\"img/05-content.png\" alt=\"نشاط المحتوى ورصيد المقالات\" />\n        <div class=\"hot\" style=\"top:35%;right:8%\">١</div>\n        <div class=\"hot\" style=\"top:68%;right:32%\">٢</div>\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>الشريط الكبير فوق</b>كم استخدمت من باقتك. لما يخلص بنخبّرك ولو محتاج تكبير الباقة.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>٤ كروت ملوّنة</b>: <b>منشور</b> (موجود على موقعك) · <b>قيد الكتابة</b> (فريقنا بيشتغل عليه) · <b>مسودات</b> (محفوظة بس ما خلصت) · <b>مجدولة</b> (هتنشر تلقائي في يوم محدد).</div></li>\n      </ul>\n    </section>\n\n    <!-- ٨ -->\n    <section class=\"chap\" id=\"s8\">\n      <h2><span class=\"badge\">٨</span> الصور</h2>\n      <p class=\"lead\">كل صور شركتك ومقالاتك في معرض واحد. تقدر تشوف كل صورة، تعرف متى انرفعت، وفي أي مقال متستخدمة.</p>\n      <div class=\"fig\">\n        <img src=\"img/06-media.png\" alt=\"معرض الصور\" />\n        <div class=\"hot\" style=\"top:35%;right:25%\">١</div>\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>أزرار فوق المعرض</b>للتنقّل السريع: <b>الكل</b> · <b>شعار شركتك</b> · <b>صور موجودة في مقالات</b> · <b>صور غلاف</b> · <b>صور غير مستخدمة</b>.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>تحت كل صورة معلومات</b>: اسمها، حجمها، وفين متستخدمة (لو غير مستخدمة بتظهر علامة).</div></li>\n      </ul>\n    </section>\n\n    <!-- ٩ -->\n    <section class=\"chap\" id=\"s9\">\n      <h2><span class=\"badge\">٩</span> الإحصائيات ⭐</h2>\n      <p class=\"lead\">دي أهم صفحة عندك. هنا تفهم زوارك فعلاً: مين هم، إمتى بيدخلون، إيش بيقروا، وإيش يحبّوا أكثر. والأحسن: في آخر الصفحة \"توصيات جاهزة\" — مودونتي يقول لك بنفسه إيش الأفضل تعمله الفترة الجاية.</p>\n      <div class=\"fig\">\n        <img src=\"img/14-analytics.png\" alt=\"صفحة الإحصائيات\" />\n      </div>\n      <div class=\"grid2\">\n        <div class=\"stat\"><div class=\"k\">مين زوارك</div><div class=\"v\">جدد أو راجعين تاني</div></div>\n        <div class=\"stat\"><div class=\"k\">إيش بيعملوا</div><div class=\"v\">كم وقت قعدوا · كم قروا</div></div>\n        <div class=\"stat\"><div class=\"k\">إمتى بيدخلوا</div><div class=\"v\">أي يوم وأي ساعة</div></div>\n        <div class=\"stat\"><div class=\"k\">إيش بيضغطوا</div><div class=\"v\">الأزرار والروابط الأكثر اهتمام</div></div>\n      </div>\n      <div class=\"tip\"><b>أحلى ميزة:</b> آخر قسم في الصفحة فيه توصيات بسيطة زي \"أفضل يوم تنشر فيه الأربعاء\" أو \"زوارك بيدخلوا من الموبايل أكثر — احرص على صور واضحة\".</div>\n    </section>\n\n    <!-- ١٠ -->\n    <section class=\"chap\" id=\"s10\">\n      <h2><span class=\"badge\">١٠</span> صحة موقعك ⭐</h2>\n      <p class=\"lead\">تخيّل إنك بتاخد سيارتك للفحص الدوري. هنا نفس الفكرة — مودونتي بيفحص موقعك ويعطيك تقرير: إيش شغّال تمام وإيش محتاج تصليح. النتيجة درجة من ١٠٠ زي درجة الامتحان.</p>\n      <div class=\"fig\">\n        <img src=\"img/11-site-health.png\" alt=\"فحص صحة الموقع\" />\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>سرعة موقعك على جوجل</b>أرقام رسمية من جوجل نفسه. زي اختبار سرعة الإنترنت بس لموقعك. كل ما الرقم أعلى كل ما موقعك أسرع.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>درجة مودونتي العامة</b>الدرجة الإجمالية من ١٠٠. لو فوق ٨٠ موقعك ممتاز.</div></li>\n        <li><span class=\"n\">٣</span><div class=\"t\"><b>قائمة بالتفاصيل</b>قائمة باللي تمام (علامة خضراء) واللي ناقص (علامة برتقالية). كل بند مكتوب بكلام واضح.</div></li>\n      </ul>\n      <div class=\"note\"><b>مهم:</b> لو فيه أي بند محتاج تصليح، فريقنا يساعدك. كلّمنا بس.</div>\n    </section>\n\n    <!-- ١١ -->\n    <section class=\"chap\" id=\"s11\">\n      <h2><span class=\"badge\">١١</span> اللي اشتركوا في نشرتك</h2>\n      <p class=\"lead\">في موقعك صندوق \"اشترك معنا للحصول على أحدث المقالات\". أي شخص يكتب إيميله هناك بيظهر هنا. ده جمهورك المخلص — اللي عاوز يسمع منك.</p>\n      <div class=\"fig\">\n        <img src=\"img/07-subscribers.png\" alt=\"مشتركو النشرة\" />\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>٥ كروت بأرقامك</b>: <b>نشط</b> (لسه مشترك) · <b>وافق على الخصوصية</b> · <b>اشترك هذا الشهر</b> · <b>ألغى</b> · <b>الإجمالي</b>.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>زر \"تصدير CSV\"</b>بينزّل كل القائمة كملف Excel — تقدر تستخدمه في أي برنامج إيميل عندك أو ترسل لهم عروضك.</div></li>\n      </ul>\n      <div class=\"tip\"><b>ليش يهمك:</b> هؤلاء أرخص طريقة لجلب عملاء جدد — كلّفك صفر، وهم اللي طلبوا منك تكلّمهم.</div>\n    </section>\n\n    <!-- ١٢ -->\n    <section class=\"chap\" id=\"s12\">\n      <h2><span class=\"badge\">١٢</span> الزوار اللي ممكن يصيروا عملاء</h2>\n      <p class=\"lead\">مش كل من يدخل موقعك مهتم. بس فيه ناس بتدخل صفحات كثيرة، تقعد وقت طويل، وتضغط أزرار. هؤلاء \"محتملين\" — يعني قريبين يصيروا عملاء. هنا تشوفهم وتعرف مين الأحرص.</p>\n      <div class=\"fig\">\n        <img src=\"img/08-leads.png\" alt=\"العملاء المحتملون\" />\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>كل واحد له درجة</b>: <b>عالي</b> (الأقرب للشراء) · <b>متوسط</b> · <b>منخفض</b> · <b>جاهز للتواصل</b> (ترك إيميل أو رقم).</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>تفاصيل كاملة لكل واحد</b>: كم صفحة دخل، كم وقت قعد، كم زر ضغط، وآخر مرة دخل الموقع.</div></li>\n      </ul>\n      <div class=\"tip\"><b>نصيحة:</b> ركّز على اللي عندهم درجة عالية أو \"جاهز للتواصل\" — هم الأقرب يدفعوا فلوس.</div>\n    </section>\n\n    <!-- ١٣ -->\n    <section class=\"chap\" id=\"s13\">\n      <h2><span class=\"badge\">١٣</span> أسئلة من زوارك</h2>\n      <p class=\"lead\">لو زائر دخل موقعك وحب يسأل سؤال (مثلاً: \"كم سعر الخدمة؟\" أو \"هل تشحنوا للسعودية؟\") — السؤال يجي هنا. ترد بكلمتين، والرد يوصله إيميل بشكل تلقائي. ما تحتاج تفتح إيميلك.</p>\n      <div class=\"fig\">\n        <img src=\"img/16-questions.png\" alt=\"أسئلة الزوار\" />\n      </div>\n      <div class=\"note\"><b>خد بالك:</b> هذي الأسئلة من زوار حقيقيين دخلوا موقعك. مش نفس \"الأسئلة الشائعة\" (قسم ١٦) اللي هي أسئلة فريقنا بيقترحها لمقالاتك.</div>\n    </section>\n\n    <!-- ١٤ -->\n    <section class=\"chap\" id=\"s14\">\n      <h2><span class=\"badge\">١٤</span> تعليقات الناس على مقالاتك</h2>\n      <p class=\"lead\">أي زائر يكتب تعليق تحت أي مقال — التعليق ما يظهر مباشرة. لازم يجي هنا، تشوفه، وتقرّر: ينشر أو لا. وتقدر ترد عليه بنفسك. ده يخليك في السيطرة وما يطلع شي ما تحبه.</p>\n      <div class=\"fig\">\n        <img src=\"img/15-comments.png\" alt=\"مراجعة التعليقات على المقالات\" />\n      </div>\n      <div class=\"tip\"><b>نصيحة:</b> ردّ على التعليقات الحلوة — الزائر يحب يحس إنك مهتم، وجوجل يكافئك على المحادثة.</div>\n    </section>\n\n    <!-- ١٥ -->\n    <section class=\"chap\" id=\"s15\">\n      <h2><span class=\"badge\">١٥</span> تقييم زوارك لشركتك</h2>\n      <p class=\"lead\">في صفحتك العامة فيه قسم \"شاركنا رأيك\". أي شخص يكتب رأيه عن شركتك يجي هنا. نفس الفكرة: ما يظهر شي إلا بعد ما توافق عليه. تقييماتك الحلوة تظهر للعالم وتبني سمعتك.</p>\n      <div class=\"fig\">\n        <img src=\"img/10-client-comments.png\" alt=\"آراء حول الشركة\" />\n      </div>\n      <div class=\"note\"><b>الفرق عن قسم ١٤:</b> هنا تقييم عام عن شركتك. قسم ١٤ تعليقات على مقالات معيّنة.</div>\n    </section>\n\n    <!-- ١٦ -->\n    <section class=\"chap\" id=\"s16\">\n      <h2><span class=\"badge\">١٦</span> أسئلة وإجابات جاهزة لمقالاتك</h2>\n      <p class=\"lead\">فريقنا يفكّر بدل عنك: \"إيش الأسئلة اللي زائرك ممكن يسألها عن مقال معيّن؟\" يجهّز السؤال والإجابة، ويعرضهم هنا. توافق بنقرة، ويظهروا في نهاية المقال. الفايدة: زائرك يلاقي إجاباته بسرعة، وجوجل يحب الصفحات اللي فيها أسئلة وإجابات.</p>\n      <div class=\"fig\">\n        <img src=\"img/09-faqs.png\" alt=\"الأسئلة الشائعة المقترحة\" />\n      </div>\n      <div class=\"tip\"><b>سر صغير:</b> الصفحات اللي فيها أسئلة وإجابات تظهر في جوجل بطريقة خاصة (مع السؤال نفسه) — يعني فرصة أكبر إن الناس يضغطوا على موقعك.</div>\n    </section>\n\n    <!-- ١٧ -->\n    <section class=\"chap\" id=\"s17\">\n      <h2><span class=\"badge\">١٧</span> إعدادات حسابك</h2>\n      <p class=\"lead\">كل اللي يخص حسابك في مكان واحد: باقتك، تنبيهاتك، وكلمة سرّك. صفحة بسيطة بتدخلها مرة وحدة وتظبط فيها كل شي.</p>\n      <div class=\"fig\">\n        <img src=\"img/12-settings.png\" alt=\"صفحة الإعدادات\" />\n      </div>\n      <ul class=\"steps\">\n        <li><span class=\"n\">١</span><div class=\"t\"><b>باقتك</b>اسمها، سعرها، وامتى تنتهي. لو قاربت تنتهي بنخبّرك قبلها.</div></li>\n        <li><span class=\"n\">٢</span><div class=\"t\"><b>التنبيهات</b>اختر متى نخبّرك: مقال جديد، تعليق، رسالة دعم، إلخ. علّم اللي تبيه، شيل علامة اللي مش مهم.</div></li>\n        <li><span class=\"n\">٣</span><div class=\"t\"><b>اربط Telegram</b>لو تبي تنبيهات لحظية على جوّالك (مثلاً: زائر دخل صفحتك دلوقتي). دقيقة وحدة وانتهيت.</div></li>\n        <li><span class=\"n\">٤</span><div class=\"t\"><b>غيّر كلمة المرور</b>في آخر الصفحة. ينصح تغيّرها كل ٦ أشهر.</div></li>\n      </ul>\n    </section>\n\n    <!-- ١٨ -->\n    <section class=\"chap\" id=\"s18\">\n      <h2><span class=\"badge\">١٨</span> رسائل من زوارك</h2>\n      <p class=\"lead\">في موقعك صفحة \"تواصل معنا\". أي شخص يكتب رسالة من هناك بتجي لك هنا. ترد بنقرة، والرد يوصله إيميل بشكل تلقائي. أبسط نظام دعم عملاء — بدون ما تحتاج تفتح إيميلك.</p>\n      <div class=\"fig\">\n        <img src=\"img/13-support.png\" alt=\"رسائل الدعم\" />\n      </div>\n      <div class=\"tip\"><b>مفيد:</b> كل رسالة وردّك بيتحفظوا هنا — تقدر ترجع لها أي وقت بدون ما تدخل إيميلك.</div>\n    </section>\n\n  </main>\n</div>\n\n<footer>\n  دليل بوابة العملاء — <b>مودونتي</b> · جميع لقطات الشاشة من بيئة الإنتاج · مسوّدة معاينة (HTML mockup)\n</footer>\n</body>\n</html>\n","writers":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>قواعد كتّاب مدونتي — v3</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#131C26; --ink-soft:#3D4A59; --paper:#FFF; --line:#DCE1E7;\n    --accent:#0E7A5F; --accent-ink:#0A5946; --accent-tint:#EAF5F1;\n    --warn:#B3261E; --warn-tint:#FBEDEC;\n  }\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.8;font-size:15.5px}\n  .page{max-width:820px;margin:0 auto;padding:0 26px 70px}\n  header.doc{border-bottom:3px solid var(--ink);padding:46px 0 26px;margin-bottom:34px}\n  .doc-meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:16px}\n  .doc-meta b{color:var(--accent-ink)}\n  h1{font-family:'Noto Kufi Arabic',sans-serif;font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.4}\n  h1 .sub{display:block;font-size:.45em;font-weight:700;color:var(--accent);margin-top:8px}\n  section{margin-top:44px}\n  h2{font-family:'Noto Kufi Arabic',sans-serif;font-weight:800;font-size:clamp(19px,3vw,23px);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:16px}\n  h2 .n{color:var(--accent);margin-left:8px}\n  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}\n  th{background:var(--ink);color:#fff;text-align:right;padding:9px 13px;font-weight:600;font-size:13px;font-family:'Noto Kufi Arabic',sans-serif}\n  td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}\n  tr:nth-child(even) td{background:#F7F9FA}\n  td b{color:var(--accent-ink)}\n  ul.r{list-style:none;margin:8px 0}\n  ul.r li{padding:7px 28px 7px 0;position:relative;font-size:14.5px}\n  ul.r li::before{content:\"\";position:absolute;right:5px;top:17px;width:8px;height:8px;border-radius:2px;background:var(--accent)}\n  .def{background:var(--accent-tint);border-right:5px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 18px;margin:14px 0;font-size:14.5px}\n  .def b{color:var(--accent-ink)}\n  .warnbox{background:var(--warn-tint);border-right:5px solid var(--warn);border-radius:0 10px 10px 0;padding:13px 18px;margin:14px 0;font-size:14.5px;font-weight:600}\n  .steps{counter-reset:s;margin-top:6px}\n  .step{position:relative;padding:0 44px 18px 0}\n  .step::before{counter-increment:s;content:counter(s);position:absolute;right:0;top:2px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:'Noto Kufi Arabic',sans-serif}\n  .step h4{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:15px;margin-bottom:3px}\n  .step p{font-size:14px;color:var(--ink-soft)}\n  .redlines{border:2px solid var(--warn);border-radius:12px;overflow:hidden;margin-top:10px}\n  .redlines .head{background:var(--warn);color:#fff;padding:10px 20px;font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:14px}\n  .redlines ul{list-style:none;padding:12px 20px 14px;background:var(--warn-tint)}\n  .redlines li{padding:6px 26px 6px 0;position:relative;font-weight:600;font-size:14px}\n  .redlines li::before{content:\"✕\";position:absolute;right:0;top:6px;color:var(--warn);font-weight:800}\n  .sign{margin-top:54px;border-top:3px solid var(--ink);padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:30px}\n  .sign .lbl{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:40px}\n  .sign .line{border-bottom:2px solid var(--ink);margin-bottom:6px}\n  .sign .hint{font-size:11.5px;color:var(--ink-soft)}\n  footer{margin-top:36px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}\n  @media(max-width:640px){.sign{grid-template-columns:1fr}}\n  @media print{body{font-size:12.5px}.page{max-width:100%;padding:0 6mm}section{margin-top:28px}}\n</style>\n</head>\n<body>\n<div class=\"page\">\n\n<header class=\"doc\">\n  <div class=\"doc-meta\">\n    <span>سياسة ملزمة · الإصدار <b>v3</b></span>\n    <span>يوليو 2026</span>\n    <span><b>modonty.com</b> · JBR Techno</span>\n  </div>\n  <h1>قواعد كتّاب مدونتي\n    <span class=\"sub\">كاتب مستقل · عمل عن بعد · محاسبة بالمخرجات</span>\n  </h1>\n</header>\n\n<!-- 1 -->\n<section>\n  <h2><span class=\"n\">1</span>ثلاث مسؤوليات فقط</h2>\n  <p>المنصة تتولى كل الجوانب التقنية آلياً (البيانات المنظمة، الفهرسة، فحوص النشر). الكاتب مسؤول عن ثلاثة، ويُحاسَب عليها كاملة:</p>\n  <ul class=\"r\">\n    <li><b>الكلمة الصحيحة</b> — استهداف يجتاز الشروط الخمسة (القسم 3)</li>\n    <li><b>النص الجيد</b> — يجتاز التدقيق بدرجة 80/100 فأعلى</li>\n    <li><b>الكمية الملتزم بها</b> — العدد الأسبوعي المحدد في العقد</li>\n  </ul>\n  <div class=\"warnbox\">الدومين واحد والسمعة مشتركة: مقال رديء لعميل واحد يضر ترتيب جميع العملاء. لهذا التدقيق صارم والخطوط الحمراء نهائية.</div>\n</section>\n\n<!-- 2 -->\n<section>\n  <h2><span class=\"n\">2</span>نموذج العمل ورخصة النشر</h2>\n  <ul class=\"r\">\n    <li>عمل عن بعد بالكامل، وقت مرن، لا دوام ولا حضور. الالتزام الوحيد: العدد الأسبوعي + الجودة + اجتماع أرقام أسبوعي (15 دقيقة أونلاين).</li>\n    <li>وحدة المحاسبة: <b>المقال المجتاز</b>. مقال أعيد من التدقيق لا يُحتسب حتى يُصحَّح.</li>\n    <li>التسليم أسبوعي موزّع — ممنوع تكديس إنتاج الشهر في أيامه الأخيرة.</li>\n    <li><b>أول 30 يوماً:</b> كل مقالاتك تُراجع قبل النشر. اجتياز 85% من أول مرة يمنحك <b>رخصة النشر المباشر</b> بلا مراجعة.</li>\n    <li><b>بعد الرخصة:</b> تنشر فوراً، والإدارة تدقق عينة عشوائية 10% من مقالاتك شهرياً. عينة تحت 80/100 تُصحّح خلال 48 ساعة. عينتان فاشلتان في ربع واحد = سحب الرخصة والعودة للمراجعة المسبقة 30 يوماً.</li>\n    <li>لكل كاتب عملاء ومواضيع مسندة بالاسم — لا تكتب خارج نطاقك.</li>\n  </ul>\n</section>\n\n<!-- 3 -->\n<section>\n  <h2><span class=\"n\">3</span>شروط اختيار الكلمة المفتاحية</h2>\n  <p>الكلمة الخاطئة = مقال بلا عائد مهما كانت جودته. قبل أي مقال، الكلمة تجتاز خمسة شروط تُوثَّق في نموذج التخطيط:</p>\n  <table>\n    <tr><th>#</th><th>الشرط</th><th>التحقق</th></tr>\n    <tr><td>1</td><td><b>تُبحث فعلاً في السعودية</b></td><td>دليل رقم من أداة (Keyword Planner / Semrush / Trends) — لا تخمين</td></tr>\n    <tr><td>2</td><td><b>نية البحث تطابق هدف العميل</b></td><td>معلوماتية / تجارية / شرائية — والمقال مبني عليها</td></tr>\n    <tr><td>3</td><td><b>قابلة للكسب الآن</b></td><td>عبارات محددة منخفضة المنافسة (3 كلمات فأكثر). الكلمات العامة الكبيرة مؤجلة حتى تقوى سلطة الدومين</td></tr>\n    <tr><td>4</td><td><b>لا تكرار داخل المنصة</b></td><td>ابحث في المنصة أولاً: الكلمة الواحدة يكتبها مقال واحد فقط على الدومين كله، لأي عميل</td></tr>\n    <tr><td>5</td><td><b>تنتمي لمحور</b></td><td>انظر تعريف المحور أدناه</td></tr>\n  </table>\n  <div class=\"def\"><b>المحور (Topic Cluster):</b> مقال رئيسي شامل في موضوع العميل الأساسي، حوله مقالات فرعية تجيب أسئلة أدق، وكلها مربوطة بروابط داخلية بالمقال الرئيسي. مثال لعيادة أسنان: المقال الرئيسي «دليل زراعة الأسنان في السعودية» — والفرعية: «تكلفة زراعة السن الواحد»، «الفرق بين الزراعة والتركيب»، «مدة التعافي بعد الزراعة». كل مقال جديد إما يقوّي محوراً قائماً أو يؤسس محوراً جديداً بخطة (رئيسي + 5 فرعية على الأقل).</div>\n  <p><b>في التدقيق:</b> كلمة لا تجتاز الشروط = فشل عينة حتى لو كان النص ممتازاً.</p>\n</section>\n\n<!-- 4 -->\n<section>\n  <h2><span class=\"n\">4</span>خطوات المقال</h2>\n  <div class=\"steps\">\n    <div class=\"step\"><h4>خطّط</h4><p>وثّق الشروط الخمسة + حدد 3 مقالات للربط الداخلي + اقرأ أول 3 نتائج بحث للكلمة واكتب سطراً: «مقالي يتفوق عليها بـ ___». ما عندك إجابة؟ غيّر الكلمة أو الزاوية.</p></div>\n    <div class=\"step\"><h4>ولّد المسودة</h4><p>الذكاء الاصطناعي مسموح ومطلوب — بأمر مبني على خطتك، لا أمر عام. المسودة مادة خام، ليست مقالاً.</p></div>\n    <div class=\"step\"><h4>حرّر وأنسِن</h4><p>احذف التشكيل من النص العادي. لا تخلط فصحى بعامية. احذف عبارات القوالب («في عالم اليوم المتسارع»، «يُعد نقطة تحول»). أضف ما ليس في المصادر: رقم سعودي، مثال محلي، خطوة عملية. كل معلومة لها مصدر وتاريخ.</p></div>\n    <div class=\"step\"><h4>هيّئ للاقتباس</h4><p>إجابة مباشرة مكتفية بذاتها في أول 40–60 كلمة من كل قسم — هي ما تقتبسه ملخصات قوقل المولّدة (AI Overviews) ومحركات الإجابة. قسم أسئلة شائعة من أسئلة الجمهور الحقيقية. أسماء صريحة بدل ضمائر غامضة.</p></div>\n    <div class=\"step\"><h4>اعتمد بنفسك</h4><p>اتركه ساعة، اقرأه قراءة قارئ، وجاوب كتابةً: «هل يتعلم القارئ شيئاً لا تقدمه أول 3 نتائج؟» و«هل يوجد سطر واضح أنه آلي؟». اعتمادك توقيع مسجّل باسمك.</p></div>\n    <div class=\"step\"><h4>انشر وتابع</h4><p>انشر عبر اللوحة (الفحوص آلية). تحقق من الفهرسة خلال 72 ساعة. بعد 60 يوماً راجع أداء المقال: واقف في المراكز 4–15؟ رشّحه للتحديث — تحديث مقال قريب من القمة أسرع عائداً من مقال جديد.</p></div>\n  </div>\n</section>\n\n<!-- 5 -->\n<section>\n  <h2><span class=\"n\">5</span>الأرقام</h2>\n  <table>\n    <tr><th>البند</th><th>الرقم</th></tr>\n    <tr><td>إنتاج الكاتب الأسبوعي (متوسط الطول، بالتحرير المدعوم)</td><td><b>14–16 مقالاً مجتازاً</b></td></tr>\n    <tr><td>إنتاج الفريق (5 كتّاب)</td><td>60–70 أسبوعياً ≈ 280 شهرياً</td></tr>\n    <tr><td>حصة تحديث المقالات القديمة (تُفعَّل من الشهر السادس)</td><td>20–30% من الإنتاج الشهري</td></tr>\n    <tr><td>حد اجتياز التدقيق</td><td>80/100 (لغة 30 · قيمة ومصداقية 30 · SEO/GEO 25 · أسلوب بشري 15)</td></tr>\n  </table>\n</section>\n\n<!-- 6 -->\n<section>\n  <h2><span class=\"n\">6</span>التقييم الشهري</h2>\n  <table>\n    <tr><th>المؤشر</th><th>الهدف</th><th>الوزن</th></tr>\n    <tr><td>الإنتاج مقابل المستهدف</td><td>100% (أدنى 90%)</td><td>30%</td></tr>\n    <tr><td>جودة العينات المدقَّقة</td><td>متوسط 85+ وصفر عينات فاشلة</td><td>30%</td></tr>\n    <tr><td>نتائج محفظتك (بعد 90 يوماً): فهرسة ≤ 7 أيام 90% · دخول أول 10 نتائج لـ 30% من المقالات خلال 3–6 أشهر · ظهور في AI Overviews</td><td>حسب النطاق المسند</td><td>25%</td></tr>\n    <tr><td>المواعيد + تصحيح العينات ≤ 48 ساعة</td><td>95%</td><td>15%</td></tr>\n  </table>\n  <table>\n    <tr><th>النتيجة</th><th>الإجراء</th></tr>\n    <tr><td>90+</td><td>مكافأة أداء</td></tr>\n    <tr><td>75–89</td><td>استمرار طبيعي</td></tr>\n    <tr><td>60–74</td><td>خطة تحسين شهر</td></tr>\n    <tr><td>أقل من 60 شهرين متتاليين</td><td>إنهاء التعاقد</td></tr>\n  </table>\n  <p>مؤشراتك مكشوفة لك أولاً بأول — لا مفاجآت آخر الشهر.</p>\n</section>\n\n<!-- 7 -->\n<section>\n  <h2><span class=\"n\">7</span>الدخل — ثلاث طبقات</h2>\n  <table>\n    <tr><th>الطبقة</th><th>القاعدة</th></tr>\n    <tr><td><b>1 · الأساسي</b></td><td>مبلغ شهري ثابت مقابل الحد الأدنى المجتاز. أقل من الراتب المكتبي المكافئ — مقابل مرونة كاملة وصفر مصاريف انتقال.</td></tr>\n    <tr><td><b>2 · مكافأة الأداء</b></td><td>شهرية، على نتيجة التقييم (القسم 6) — تكافئ ما تتحكم فيه من أول شهر.</td></tr>\n    <tr><td><b>3 · عمولة التجديد</b></td><td>نسبة من كل تجديد اشتراك لعملائك المسندين، من <b>التجديد الأول</b> وما بعده، مستمرة ما دام العميل يجدد وأنت على رأس العمل.</td></tr>\n  </table>\n  <ul class=\"r\">\n    <li>انسحاب عميل لسبب موثَّق خارج المحتوى (إغلاق نشاط، خلاف سعري) لا يُحتسب عليك.</li>\n    <li>لا تُصرف عمولة عن عميل تراجعت جودة مقالاته في التدقيق عن 80 خلال ربع الصرف — الكتابة لإرضاء العميل على حساب معايير البحث تلغي العمولة.</li>\n    <li>النسب في ملحق مالي منفصل يُراجع كل 6 أشهر.</li>\n    <li>التعاقد: عقد تقديم خدمات بمخرجات محددة — ليس عقد عمل بدوام.</li>\n  </ul>\n</section>\n\n<!-- 8 -->\n<section>\n  <h2><span class=\"n\">8</span>الخطوط الحمراء</h2>\n  <div class=\"redlines\">\n    <div class=\"head\">إنذار نهائي أو إنهاء فوري</div>\n    <ul>\n      <li>نشر نص مولّد بلا تحرير بشري</li>\n      <li>انتحال متعمد</li>\n      <li>اختلاق مصدر أو إحصائية</li>\n      <li>معلومة طبية / مالية / قانونية بلا مصدر موثوق</li>\n      <li>الالتفاف على التدقيق أو النشر خارج نطاقك المسند</li>\n    </ul>\n  </div>\n</section>\n\n<div class=\"sign\">\n  <div class=\"slot\">\n    <div class=\"lbl\">إقرار الكاتب: قرأت هذه القواعد وألتزم بها</div>\n    <div class=\"line\"></div>\n    <div class=\"hint\">الاسم · التوقيع · التاريخ</div>\n  </div>\n  <div class=\"slot\">\n    <div class=\"lbl\">اعتماد الإدارة</div>\n    <div class=\"line\"></div>\n    <div class=\"hint\">م. خالد علي — JBR Techno</div>\n  </div>\n</div>\n\n<footer>\n  <span>قواعد كتّاب مدونتي — v3 · يوليو 2026</span>\n  <span>وثيقة داخلية — تُراجع كل 6 أشهر</span>\n</footer>\n\n</div>\n</body>\n</html>\n"};
const view = document.getElementById('view');
const empty = document.getElementById('empty');
const items = [...document.querySelectorAll('.item')];

function open(key){
  if(!DOCS[key]) return;
  items.forEach(b => b.setAttribute('aria-current', String(b.dataset.key === key)));
  empty.hidden = true;
  view.hidden = false;
  view.srcdoc = DOCS[key];
  if(location.hash.slice(1) !== key) history.replaceState(null,'','#'+key);
}

items.forEach(b => b.addEventListener('click', () => open(b.dataset.key)));
open(location.hash.slice(1) || items[0].dataset.key);
window.addEventListener('hashchange', () => open(location.hash.slice(1)));
</script>
