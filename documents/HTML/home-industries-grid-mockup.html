<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modonty — شبكة المجالات</title>
    <style>
      :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; }
      body { margin: 0; background: #f8f8fb; color: #211e2f; padding: 24px 16px; }
      .panel { max-width: 600px; margin: auto; overflow: hidden; border: 1px solid #e7e3ef; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px -22px rgba(14, 6, 90, .45); }
      header { display: flex; align-items: start; justify-content: space-between; gap: 16px; padding: 20px 20px 14px; }
      h1 { margin: 0; font-size: 17px; } p { margin: 5px 0 0; color: #746e82; font-size: 13px; }
      a { color: #3722a9; font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 14px 14px; }
      .item { position: relative; min-height: 94px; display: flex; flex-direction: column; justify-content: end; overflow: hidden; border-radius: 13px; padding: 11px; color: #fff; background: linear-gradient(135deg, #3c23ab, #7d59d0); }
      .item:nth-child(2n) { background: linear-gradient(135deg, #137577, #2eaaa7); }
      .item:nth-child(3n) { background: linear-gradient(135deg, #9b4c20, #de8f45); }
      .item::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(10, 5, 35, .52), transparent 70%); }
      .name, .count { position: relative; } .name { font-size: 15px; font-weight: 700; } .count { margin-top: 4px; font-size: 11px; opacity: .9; }
      @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .item { min-height: 104px; } }
    </style>
  </head>
  <body>
    <section class="panel" aria-labelledby="industries-heading">
      <header>
        <div><h1 id="industries-heading">استكشف المجالات</h1><p>اختر المجال الأقرب لاحتياجك</p></div>
        <a href="#">عرض كل المجالات</a>
      </header>
      <div class="grid">
        <a class="item" href="#"><span class="name">الصحة</span><span class="count">١٢ شريك</span></a>
        <a class="item" href="#"><span class="name">العقارات</span><span class="count">٩ شركاء</span></a>
        <a class="item" href="#"><span class="name">التقنية</span><span class="count">٨ شركاء</span></a>
        <a class="item" href="#"><span class="name">التعليم</span><span class="count">٧ شركاء</span></a>
        <a class="item" href="#"><span class="name">السياحة</span><span class="count">٦ شركاء</span></a>
        <a class="item" href="#"><span class="name">القانون</span><span class="count">٥ شركاء</span></a>
        <a class="item" href="#"><span class="name">المال والأعمال</span><span class="count">٤ شركاء</span></a>
        <a class="item" href="#"><span class="name">الجمال</span><span class="count">٣ شركاء</span></a>
      </div>
    </section>
  </body>
</html>
