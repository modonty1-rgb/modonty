<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">معاينة هندسية لعلامة مجالات مدوّنتي</title>
  <desc id="desc">ثلاث بوابات كحلية متطابقة حول ماسة مدوّنتي السماوية، مع معاينات للمقاسات والخلفيات</desc>
  <metadata id="design-story">{"schemaVersion":1,"slug":"industries-mark","status":"review","ideaAr":"ثلاث بوابات متطابقة تمثل تنوع المجالات وتلتقي حول ماسة مدوّنتي التي تمثل المنصة الواحدة","objectivesAr":["هوية مستقلة للمجالات","ربط الرمز بعائلة مدوّنتي","وضوح في المقاسات الصغيرة"]}</metadata>
  <rect width="1200" height="760" fill="#F4F3F7"/>

