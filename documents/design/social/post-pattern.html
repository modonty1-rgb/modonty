<meta charset="utf-8">
<title>بوست: جبر سيو ومدونتي — خلفية نمط الشعارين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3f2ef;
    --navy:#0E065A;
    --blue:#3030FF;      /* مدونتي — من شعارها */
    --green:#79ca45;     /* جبر سيو — الأخضر هو ما يميّزها فعلاً */
    --jbr-blue:#3333f9;  /* أزرق جبر سيو — يكاد يطابق أزرق مدونتي، وهذا أصل اللبس */
    --teal:#00A8A8;
    --muted:#5b5b5b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}

  .post{
    width:1080px;height:1080px;flex:none;position:relative;overflow:hidden;
    background:var(--paper);
    font-family:"Tajawal",system-ui,sans-serif;
    direction:rtl;color:var(--navy);
  }

  /* خلفية النمط: الشعاران مبثوثان بشفافية منخفضة — حاضران بلا مزاحمة للنصّ */
  .bg{position:absolute;inset:0;opacity:.055;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}

  /* توهّج خفيف في الوسط يفتح مساحة للنصّ فوق النمط */
  .veil{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(58% 46% at 50% 46%, rgba(243,242,239,.97) 0%, rgba(243,242,239,.82) 52%, rgba(243,242,239,0) 100%);
  }

  .stage{position:relative;height:100%;display:flex;flex-direction:column;padding:84px 84px 72px}

  .kicker{
    font-size:31px;font-weight:700;color:var(--navy);font-weight:500;color:var(--muted);
    display:flex;align-items:center;gap:14px;
  }
  .kicker::after{content:"";height:2px;flex:1;background:rgba(14,6,90,.12);border-radius:2px}

  .core{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:14px 0 26px}

  /* الشعار في بطاقة بيضاء — البطاقة هي ما يجعل الشعار يُقرأ فوق النمط */
  .plate{
    background:#fff;border-radius:28px;padding:34px 54px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 44px rgba(14,6,90,.07), 0 2px 0 rgba(14,6,90,.04);
    position:relative;
  }
  .plate::before{
    content:"";position:absolute;inset:0;border-radius:28px;
    box-shadow:inset 0 0 0 2px rgba(14,6,90,.05);
  }
  .plate.jbr{width:520px}
  .plate.mod{width:520px}
  .plate svg{display:block}
  .plate.jbr svg{width:352px;height:auto}
  .plate.mod img{width:330px;height:auto;display:block}

  /* الرابط: كلمة واحدة تقول اتجاه العلاقة — لا «ضدّ» ولا مساواة */
  .bridge{display:flex;flex-direction:column;align-items:center;gap:12px}
  .bridge .stem{width:3px;height:26px;background:var(--teal);border-radius:2px;opacity:.55}
  .bridge .word{
    font-size:31px;font-weight:800;color:var(--teal);
    background:rgba(0,168,168,.1);padding:10px 30px;border-radius:999px;
    letter-spacing:-.2px;
  }

  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
  .foot .line{font-size:38px;font-weight:900;line-height:1.45;letter-spacing:-.4px}
  .foot .line b{color:var(--blue);font-weight:900}
  .foot .site{font-size:25px;font-weight:500;color:var(--muted);direction:ltr;white-space:nowrap;padding-bottom:8px}
</style>
