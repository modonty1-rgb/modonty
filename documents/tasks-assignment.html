<style>
  :root{
    --bg:#0a0f1c; --card:#111827; --card-2:#0f172a; --line:#1f2a3d;

  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:Tajawal,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.7;
  }
  .shell{display:grid;grid-template-columns:280px 1fr;gap:22px;max-width:1280px;margin:0 auto;padding:24px 20px 80px}

  /* ——— الشريط الجانبي ——— */
  aside{position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow:auto}
  aside h2{font-size:15px;margin:0 0 10px;color:var(--muted)}
  .emp{
    display:flex;align-items:center;gap:9px;width:100%;text-align:right;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;margin-bottom:7px;cursor:pointer;color:var(--text);
    font-family:inherit;font-size:14px;
  }
  .emp:hover{border-color:rgba(0,216,216,.45)}
  .emp.on{border-color:var(--accent);background:rgba(0,216,216,.07)}
  .emp .nm{font-weight:700;flex:1}
  .emp .dept{font-size:11px;color:var(--muted)}
  .emp .cnt{
    min-width:26px;text-align:center;border-radius:7px;padding:1px 6px;
    font-size:12.5px;font-weight:700;background:var(--card-2);color:var(--muted);border:1px solid var(--line);
  }
  .emp.on .cnt,.emp .cnt.has{background:var(--accent);color:#04252b;border-color:transparent}
  .grp-btn{padding:7px 10px;margin-bottom:5px}
  .grp-btn.full{border-color:rgba(0,216,216,.35)}
  h3.grp{scroll-margin-top:14px}

  .meter{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:14px}
  .meter b{color:var(--accent);font-size:19px}
  .meter .bar{height:6px;border-radius:99px;background:var(--card-2);margin-top:7px;overflow:hidden}
  .meter .bar i{display:block;height:100%;background:var(--accent)}
  .tools{display:flex;gap:6px;margin-top:12px}
  .tools button{
    flex:1;background:var(--card-2);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:7px;font-family:inherit;font-size:12.5px;cursor:pointer;
  }
  .tools button:hover{color:var(--accent);border-color:rgba(0,216,216,.4)}

  /* ——— المتن ——— */
  h1{font-size:23px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  h3.grp{font-size:15px;margin:26px 0 9px;color:var(--accent)}
  h3.grp:first-of-type{margin-top:14px}

  .row{
    display:grid;grid-template-columns:40px 1fr 190px;gap:12px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;margin-bottom:7px;
  }
  .row.free{border-inline-start:3px solid var(--warn)}
  .row.done{border-inline-start:3px solid var(--accent)}
  .row.hide{display:none}
  .row.park{opacity:.45;border-inline-start:3px solid var(--line)}
  .txt small.parked{color:var(--warn)}
  .pri{
    display:inline-block;background:var(--warn);color:#2b1c02;font-weight:700;
    font-size:11px;border-radius:6px;padding:1px 7px;margin-inline-end:7px;vertical-align:middle;
  }
  .num{
    text-align:center;font-weight:700;font-size:13px;color:var(--muted);
    background:var(--card-2);border-radius:7px;padding:3px 0;
  }
  .txt{font-size:14px}
  .txt small{display:block;color:var(--muted);font-size:12px}
  select{
    background:var(--card-2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font-family:inherit;font-size:13.5px;width:100%;
  }
  select.empty{color:var(--warn);border-color:rgba(245,181,68,.45)}

  /* ——— حسب الموظف ——— */
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .pcard h4{margin:0;font-size:16px}
  .pcard .d{color:var(--muted);font-size:12px;margin-bottom:8px}
  .pcard ol{margin:0;padding-inline-start:18px;font-size:13px;color:var(--muted)}
  .pcard li{margin-bottom:4px}
  .pcard .none{color:var(--warn);font-size:13px}

  hr{border:none;border-top:1px solid var(--line);margin:34px 0 0}
  @media (max-width:900px){ .shell{grid-template-columns:1fr} aside{position:static;max-height:none} .row{grid-template-columns:36px 1fr;gap:8px} .row select{grid-column:1 / -1} }
</style>
</head>

    <h2 class="grp" style="font-size:19px;margin-top:26px">حسب الموظف</h2>

</div>

const KEY = "modonty-task-assign-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
TASKS.forEach(t => { if (state[t.n] === undefined) state[t.n] = t.d; });

let filter = null;   // employee id, or "__free__", or null

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const nameOf = id => (EMPLOYEES.find(e => e.id === id) || {}).name || "";

function renderTasks(){
  const host = document.getElementById("taskList");
  host.innerHTML = "";
  GROUPS.forEach(g => {
    const h = document.createElement("h3");
    h.className = "grp";
    h.id = "g" + g.from;
    h.textContent = g.title;
    host.appendChild(h);

    TASKS.filter(t => t.n >= g.from && t.n <= g.to).forEach(t => {
      const owner = state[t.n];
      const row = document.createElement("div");
      row.className = "row " + (t.park ? "park" : owner ? "done" : "free");
      if (filter === "__free__" && owner) row.classList.add("hide");
      if (filter && filter !== "__free__" && owner !== filter) row.classList.add("hide");

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = t.n;

      const txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = t.t;
      if (t.pri) { const b = document.createElement("span"); b.className = "pri"; b.textContent = "أولوية " + t.pri; txt.prepend(b); }
      if (t.park) { const p = document.createElement("small"); p.className = "parked"; p.textContent = "مؤجّلة — شغلنا أونلاين فقط"; txt.appendChild(p); }
      if (t.note) { const s = document.createElement("small"); s.textContent = t.note; txt.appendChild(s); }

      const sel = document.createElement("select");
      if (!owner) sel.className = "empty";
      const none = document.createElement("option");
      none.value = ""; none.textContent = "— بلا مالك —";
      sel.appendChild(none);
      EMPLOYEES.forEach(e => {
        const o = document.createElement("option");
        o.value = e.id; o.textContent = e.name;
        if (e.id === owner) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", () => { state[t.n] = sel.value; save(); renderAll(); });

      row.append(num, txt, sel);
      host.appendChild(row);
    });
  });
}

function renderGroups(){
  const host = document.getElementById("grpList");
  if (!host) return;
  host.innerHTML = "";
  GROUPS.forEach(g => {
    const inGroup = TASKS.filter(t => t.n >= g.from && t.n <= g.to && !t.park);
    const done = inGroup.filter(t => state[t.n]).length;
    const b = document.createElement("button");
    b.className = "emp grp-btn" + (done === inGroup.length && inGroup.length ? " full" : "");
    b.innerHTML =
      '<span class="nm" style="font-weight:500;font-size:13px">' + g.title + '</span>' +
      '<span class="cnt' + (done === inGroup.length && inGroup.length ? " has" : "") + '">' +
      done + '/' + inGroup.length + '</span>';
    b.addEventListener("click", () => {
      filter = null; renderAll();
      const el = document.getElementById("g" + g.from);
      if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
    });
    host.appendChild(b);
  });
}

function renderSidebar(){
  const host = document.getElementById("empList");
  host.innerHTML = "";
  EMPLOYEES.forEach(e => {
    const count = TASKS.filter(t => state[t.n] === e.id).length;
    const b = document.createElement("button");
    b.className = "emp" + (filter === e.id ? " on" : "");
    b.innerHTML =
      '<span class="nm">' + e.name + '<span class="dept" style="display:block">' + e.dept + '</span></span>' +
      '<span class="cnt' + (count ? " has" : "") + '">' + count + '</span>';
    b.addEventListener("click", () => { filter = (filter === e.id ? null : e.id); renderAll(); });
    host.appendChild(b);
  });

  const live = TASKS.filter(t => !t.park);
  const done = live.filter(t => state[t.n]).length;
  document.getElementById("mDone").textContent = done;
  document.getElementById("mAll").textContent = live.length;
  document.getElementById("mBar").style.width = Math.round(done / live.length * 100) + "%";
}

function renderPeople(){
  const host = document.getElementById("people");
  host.innerHTML = "";
  EMPLOYEES.forEach(e => {
    const mine = TASKS.filter(t => state[t.n] === e.id);
    const c = document.createElement("div");
    c.className = "pcard";
    let inner = "<h4>" + e.name + "</h4><div class='d'>" + e.dept + "</div>";
    if (mine.length) {
      inner += "<ol>" + mine.map(t => "<li>" + t.n + " · " + t.t + "</li>").join("") + "</ol>";
    } else {
      inner += "<div class='none'>لا مهمّة مسنَدة بعد</div>";
    }
    c.innerHTML = inner;
    host.appendChild(c);
  });

  const orphans = TASKS.filter(t => !state[t.n]);
  if (orphans.length){
    const c = document.createElement("div");
    c.className = "pcard";
    c.style.borderColor = "rgba(245,181,68,.45)";
    c.innerHTML = "<h4 style='color:var(--warn)'>بلا مالك</h4><div class='d'>" + orphans.length +
      " مهمّة تنتظر قراراً</div><ol>" +
      orphans.map(t => "<li>" + t.n + " · " + t.t + "</li>").join("") + "</ol>";
    host.appendChild(c);
  }
}

function renderAll(){ renderGroups(); renderSidebar(); renderTasks(); renderPeople(); }

function buildText(){
  const lines = ["# إسناد مهام مدونتي", "# " + new Date().toLocaleString("ar-SA"), ""];
  EMPLOYEES.forEach(e => {
    const mine = TASKS.filter(t => state[t.n] === e.id);
    if (!mine.length) return;
    lines.push("## " + e.name + " (" + mine.length + ")");
    mine.forEach(t => lines.push("  " + t.n + ". " + t.t));
    lines.push("");
  });
  const orphans = TASKS.filter(t => !state[t.n] && !t.park);
  lines.push("## بلا مالك (" + orphans.length + ")");
  orphans.forEach(t => lines.push("  " + t.n + ". " + t.t));
  lines.push("");
  const parked = TASKS.filter(t => t.park);
  lines.push("## مؤجّلة (" + parked.length + ")");
  parked.forEach(t => lines.push("  " + t.n + ". " + t.t));
  return lines.join("\n");
}

function flash(s){ const m = document.getElementById("msg"); m.textContent = s; setTimeout(() => { m.textContent = ""; }, 2500); }

document.getElementById("btnCopy").addEventListener("click", async () => {
  const txt = buildText();
  try { await navigator.clipboard.writeText(txt); flash("انتسخ — الصقه في المحادثة"); }
  catch (e) { window.prompt("انسخ من هنا:", txt); }
});

document.getElementById("btnJson").addEventListener("click", () => {
  const payload = { updatedAt: new Date().toISOString(), assignments: {} };
  TASKS.forEach(t => { payload.assignments[t.n] = { task: t.t, owner: nameOf(state[t.n]) || null, parked: !!t.park }; });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "modonty-tasks.json";
  a.click();
  URL.revokeObjectURL(a.href);
  flash("نزّل modonty-tasks.json");
});

document.getElementById("btnAll").addEventListener("click", () => { filter = null; renderAll(); });
document.getElementById("btnFree").addEventListener("click", () => { filter = "__free__"; renderAll(); });
document.getElementById("btnReset").addEventListener("click", () => {
  if (!confirm("تصفير كل الإسنادات والرجوع للمقترح الأوّل؟")) return;
  state = {}; TASKS.forEach(t => state[t.n] = t.d); save(); filter = null; renderAll();
});

renderAll();
</script>
