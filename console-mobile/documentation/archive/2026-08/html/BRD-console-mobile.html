<header><h1>BRD — تطبيق مودونتي كونسول للموبايل</h1><p>نسخة للنقاش والاعتماد قبل بدء التنفيذ</p></header>
<main class="wrap"><div class="notice">هذه وثيقة عمل للمراجعة. لا يبدأ التنفيذ قبل اعتماد نطاق الـMVP وقرارات القسم 13.</div><nav class="toc" id="toc"><h2>المحتويات</h2></nav><article id="content"></article></main>
<script>
const markdown = "# BRD — تطبيق مودونتي كونسول للموبايل\n\n**الحالة:** مسودة للنقاش — لا يبدأ التنفيذ قبل اعتمادها  \n**المنتج:** `@modonty/console-mobile`  \n**المنصات المستهدفة:** Android وiOS  \n**التقنية المقترحة:** Expo + React Native + TypeScript + Expo Router  \n**تاريخ الدراسة:** 27 أغسطس 2026\n\n---\n\n## 1. ملخص القرار\n\nمودونتي كونسول هو مساحة العميل لإدارة حضوره، محتواه، جمهوره، وحجوزاته. النسخة الحالية هي تطبيق Next.js ويب، وتضم **34 مسارًا مرئيًا** و**21 ملف Server Actions** موزعة على أكثر من 25 مجالًا.\n\nقرار هذا الـBRD: نبني تطبيق موبايل مستقلًا داخل نفس monorepo، يخدم عمليات العميل المتكررة والسريعة من الجوال. لا ننقل واجهة الويب كما هي، ولا نصنع WebView. نعيد بناء تجربة Native مع API مخصص للموبايل، ونبقي الأدوات التحريرية الثقيلة أو الإدارية المعقدة على الويب حتى يثبت احتياجها على الموبايل.\n\n**نجاح النسخة الأولى لا يعني نقل كل الكونسل.** يعني أن العميل يستطيع، من هاتفه، رؤية ما يحتاج إجراءً، متابعة الحجوزات والرسائل، واتخاذ قرار أو إجراء أساسي بثقة وسرعة.\n\n---\n\n## 2. ما تمت دراسته في الكونسل الحالي\n\n### 2.1 التقنية والوصول\n\n- التطبيق الحالي: Next.js 16 + React 19 + Prisma / MongoDB + NextAuth credentials.\n- تسجيل الدخول الحالي بالبريد أو `client slug` وكلمة المرور.\n- Session الحالية JWT، مدتها 30 يومًا، وتحمل `clientId` واسم وslug العميل.\n- يوجد دخول إداري بانتحال العميل عبر ticket موقع ومؤقت.\n- كل Server Action حساس يتحقق من هوية العميل، ثم يقيّد الاستعلام بـ`clientId`؛ هذا السلوك يجب أن يبقى قاعدة غير قابلة للتنازل في Mobile API.\n- الـAPI الظاهر اليوم تحت `/api/v1` مخصص في الغالب لسحب المقالات المنشورة إلى مواقع العملاء، وليس API مصادَقًا عليه لتطبيق الموبايل.\n\n### 2.2 ما يراه العميل اليوم\n\n| المجال | الموجود في Console web | طبيعة الاستخدام |\n|---|---|---|\n| لوحة التحكم | KPIs، عناصر تحتاج إجراء، أداء، جمهور، رسوم، نشاط أخير | قراءة واتخاذ قرار |\n| المقالات | موافقة/إدارة/تفاصيل/Preview ومقالات الموقع | متابعة وموافقة؛ تحرير طويل |\n| الحجوزات | قائمة، حالات، تأكيد وقت، حذف وعمليات جماعية | عالي الأولوية ومناسب للموبايل |\n| Leads | قائمة، KPIs، تحديث score | عالي الأولوية للمتابعة |\n| الدعم | رسائل، تغيير حالة، رد، bulk actions | عالي الأولوية ومناسب للموبايل |\n| التفاعل | تعليقات، أسئلة، تعليقات/مراجعات العملاء، موافقة/رفض | مناسب للموبايل كتصفية إجراء |\n| الجمهور | مشتركون، حذف/إلغاء اشتراك/export | متابعة؛ export يبقى ويب |\n| المحتوى المرئي | Gallery، Reels، Videos، Media | مراجعة ورفع بسيط؛ إدارة كثيفة لاحقًا |\n| الموقع | موقعي، صفحات الموقع، محتوى الصفحة، FAQ الصفحة | إعدادات/محرر؛ ويب أولًا |\n| النشاط | Profile، SEO، keywords، competitors، campaigns، site health | قراءة مختصرة؛ إعدادات متقدمة ويب |\n| الحساب | فواتير، اشتراك، إعدادات، Telegram | قراءة وإجراءات حسابية محدودة |\n\n### 2.3 ملاحظات مؤثرة على المنتج\n\n1. المقالات وFAQ هما المساران المثبتان أعلى navigation الحالية؛ المقالات موصوفة في الكود كوجهة يومية للعميل.\n2. الكونسل يحسب شارات انتظار وحالات جديدة للحجوزات، leads، رسائل الدعم، الأسئلة، التعليقات، المراجعات، المحتوى والـmedia. هذا هو أساس شاشة **«تحتاج إجراء»** في التطبيق.\n3. الكونسل يملك حالات بيانات خاصة بالعميل: خطة/اشتراك، فواتير غير مدفوعة، YMYL completion، وإمكان نشر مقالات موقع العميل. يجب ألا تتسرب بين العملاء.\n4. لا توجد Mobile API متكاملة حاليًا؛ Server Actions لا يمكن ولا يجب استدعاؤها من React Native.\n\n---\n\n## 3. المشكلة والفرصة\n\n### المشكلة\n\nعميل الكونسل يتابع غالبًا من هاتفه، لكن الويب الحالي مبني حول sidebar طويل وجداول وإدخالات متعددة. الوصول إلى خبر جديد أو حجز أو رسالة يتطلب فتح المتصفح والتنقل داخل لوحة كثيفة. لا يوجد تنبيه Native يقود العميل مباشرة إلى العنصر المطلوب.\n\n### الفرصة\n\nنجعل التطبيق «مركز متابعة العميل»: يظهر أهم حدث، يعطي إجراءً واحدًا واضحًا، ثم يفتح التفاصيل عند الحاجة. هذا يرفع سرعة الاستجابة للحجز والـlead والتعليق ويقلل فقدان الفرص، مع إبقاء الويب للمحررات والتشغيل الإداري العميق.\n\n---\n\n## 4. المستخدمون والصلاحيات\n\n### المستخدم الأساسي — عميل مودونتي\n\n- مالك نشاط أو فريق عميل، مسجّل بحساب console.\n- يرى **بيانات clientId الخاص به فقط**.\n- أهم مهامه: متابعة حجوزات/Leads/رسائل، اعتماد محتوى، قراءة الأداء، تحديث معلومات بسيطة.\n\n### مستخدم إداري منظم\n\n- الانتحال الإداري موجود في الويب الحالي.\n- **قرار مقترح للنسخة الأولى:** لا نفعّل انتحال admin في تطبيق العميل. يظل في admin/web حتى نحدد متطلبات التدقيق والموافقة والأمان للموبايل.\n\n### قاعدة التفويض\n\nكل endpoint يعيد تعريف العميل من access token على السيرفر. لا يقبل `clientId` مرسلاً من التطبيق كمرجع ثقة، ولا يعيد أي record لا يملك نفس `clientId`.\n\n---\n\n## 5. أهداف العمل وقياس النجاح\n\n| هدف | قياس مقترح |\n|---|---|\n| تقليل زمن الاستجابة | زمن فتح/معالجة حجز أو lead من وصول التنبيه |\n| عدم فقدان طلب جديد | نسبة الحجوزات وleads التي فتحت خلال 24 ساعة |\n| جعل التطبيق عادة متابعة | مستخدمون نشطون أسبوعيًا، وعدد الجلسات لكل عميل |\n| إجراء صحيح وآمن | نسبة نجاح mutations، أخطاء authorization = صفر |\n| أداء جيد | زمن فتح أول شاشة، زمن إظهار قائمة الحجوزات، crash-free sessions |\n\n**الأرقام المستهدفة لا تُثبت الآن**؛ نحتاج baseline من console/web وقرار business قبل الإطلاق الداخلي.\n\n---\n\n## 6. نطاق المنتج\n\n### 6.1 MVP — داخل النطاق\n\n#### A. الحساب والوصول\n\n- دخول بالبريد أو slug + كلمة مرور.\n- استعادة session، logout، انتهاء الجلسة، وربط آمن مع SecureStore.\n- صفحة مساعدة عند فشل الدخول.\n- عرض اسم العميل وخطته بصورة غير قابلة للتحرير في البداية.\n\n#### B. الرئيسية — «اليوم»\n\n- تحية العميل وملخص قصير.\n- قائمة مرتبة حسب الأولوية: حجز جديد، lead جديد، رسالة دعم، محتوى/تعليق يحتاج قرارًا، تنبيه اشتراك.\n- KPIs مقتصرة على معلومات قابلة للتنفيذ: حجوزات جديدة، leads، رسائل، عناصر انتظار.\n- نشاط أخير موجز وروابط deep-link للتفاصيل.\n\n#### C. الحجوزات\n\n- قائمة وفرز حسب: جديد، تم التواصل، مكتمل، مؤرشف.\n- تفاصيل الحجز وبيانات التواصل المتاحة حاليًا في الكونسل.\n- تغيير الحالة.\n- تعيين/إزالة وقت التأكيد.\n- تنبيه عند حجز جديد وفتح مباشر لصفحة الحجز.\n- لا bulk actions في أول نسخة إلا إذا أثبتت الدراسة التشغيلية ضرورتها.\n\n#### D. صندوق المتابعة\n\n- دمج ذكي، لا دمج بيانات عشوائي: Leads، رسائل الدعم، تعليقات/أسئلة ومراجعات تنتظر قرارًا.\n- تبويبات/filters واضحة حسب النوع والحالة.\n- الإجراءات المسموحة لكل نوع: رد، موافقة، رفض، تغيير حالة، أو فتح الويب عند تعقيد الإجراء.\n\n#### E. المحتوى\n\n- قائمة المقالات وحالاتها، خصوصًا pending approval.\n- معاينة آمنة للمقال ومعلومات الأداء الأساسية عند توفرها.\n- اعتماد/رفض فقط حين تكون قواعد المقال الحالية تدعم ذلك.\n- رابط «فتح المحرر على الويب» للتحرير الطويل أو المعقد.\n\n#### F. الحساب والإشعارات\n\n- ملف العميل المختصر، رابط الصفحة العامة، الخطة، حالة الاشتراك والفواتير المفتوحة.\n- إعدادات push داخل التطبيق.\n- ربط device push token بالعميل والمستخدم، وإلغاء الربط عند logout.\n\n### 6.2 لاحقًا بعد MVP\n\n- Media/Gallery/Reels/Videos: استعراض ثم رفع بسيط.\n- Analytics: cards وقراءة trends، لا لوحات رسوم معقدة كاملة.\n- Subscribers: استعراض وحالة؛ export على الويب.\n- FAQ وإدارة الأسئلة كاملة.\n- حملات وUTM.\n- Site Health كـsummary مع open-web للتفاصيل.\n- Telegram preferences إذا ثبت أنه سلوك يومي للمستخدم.\n\n### 6.3 ويب فقط مبدئيًا\n\n| المجال | السبب |\n|---|---|\n| محرر المحتوى/الصفحات الكامل | إدخال طويل، تعدد حقول، ومعاينة دقيقة |\n| Page blocks وsite pages | أدوات تخطيط ومحتوى لا تناسب شاشة الهاتف في v1 |\n| SEO intake، keywords، competitors | كثافة نماذج وتحليل؛ قيمة يومية ضعيفة على الموبايل |\n| إدارة الفواتير التفصيلية | حساسية مالية، تنزيلات، وقرارات محاسبية |\n| Bulk delete/export | خطر تنفيذ غير مقصود؛ يمكن إضافته لاحقًا بضوابط |\n| انتحال admin | يحتاج audit trail ومتطلبات أمنية خاصة |\n\n---\n\n## 7. Information Architecture للموبايل\n\n### Bottom tabs الثابتة — خمس وجهات فقط\n\n1. **اليوم** — dashboard/action center.\n2. **الحجوزات** — متابعة الطلبات والمواعيد.\n3. **المتابعة** — leads، رسائل، تعليقات وأسئلة تحتاج إجراء.\n4. **المحتوى** — مقالات وحالات موافقة.\n5. **حسابي** — الملف والخطة والإعدادات والدعم.\n\n### Stack screens\n\n```text\nتسجيل الدخول\n└─ Tabs\n   ├─ اليوم\n   │  └─ تفاصيل عنصر يحتاج إجراء\n   ├─ الحجوزات\n   │  └─ تفاصيل الحجز\n   ├─ المتابعة\n   │  ├─ تفاصيل Lead\n   │  ├─ تفاصيل رسالة دعم\n   │  └─ مراجعة تعليق / سؤال / Review\n   ├─ المحتوى\n   │  └─ معاينة/قرار مقال\n   └─ حسابي\n      ├─ الاشتراك والفواتير\n      ├─ الإشعارات\n      └─ الدعم\n```\n\n**قاعدة:** الـtab bar للتنقل بين وجهات ثابتة فقط. إجراءات مثل «اتصل»، «اعتمد»، «احجز وقتًا»، أو «رد» تكون CTA داخل الصفحة أو bottom sheet، وليست tabs.\n\n---\n\n## 8. المتطلبات الوظيفية التفصيلية\n\n### FR-01 — الهوية والجلسة\n\n- يجب أن يستطيع العميل تسجيل الدخول بالبريد أو slug وكلمة المرور كما هو في الويب.\n- يجب أن تتحقق الخوادم من credentials وتصدر access token قصير العمر وrefresh token قابل للتدوير.\n- يجب حفظ الأسرار في native secure storage فقط، لا AsyncStorage.\n- يجب إبطال الجلسة محليًا وخادميًا عند logout أو اكتشاف refresh غير صالح.\n\n### FR-02 — العزل بين العملاء\n\n- لا يحدد التطبيق clientId في query/route للوصول إلى بيانات خاصة.\n- يجب أن تشتق طبقة API clientId من token وتقيّد كل query/mutation به.\n- يجب تسجيل محاولات الوصول المرفوضة ومراقبتها.\n\n### FR-03 — Dashboard قابل للإجراء\n\n- يعيد endpoint واحد summary خفيفًا: counts، أعلى action items، حالة الحساب المختصرة، وآخر نشاط.\n- كل action item له نوع، priority، timestamp، target route وCTA متاح.\n- لا ننقل الرسوم البيانية كاملة إلى أول شاشة؛ الأداء تفصيل اختياري لاحقًا.\n\n### FR-04 — الحجوزات\n\n- GET list مع cursor pagination وfilters للحالة.\n- GET detail.\n- PATCH status وconfirmedAt مع تحقق ملكية record وحالة انتقال مسموحة.\n- mutation idempotency key عند التحديثات الحساسة لتفادي تكرار tap أو ضعف الشبكة.\n\n### FR-05 — المتابعة والتفاعل\n\n- كل قائمة تعرض النوع والحالة والوقت وصاحب الطلب/المرسل والسياق.\n- الإجابة/الموافقة/الرفض تخضع لنفس validation الموجود في الويب.\n- لا حذف نهائي من الموبايل في MVP.\n\n### FR-06 — المقالات\n\n- القائمة تميز: pending، approved/published، rejected حسب النموذج القائم.\n- قرار الموافقة أو الرفض يقدم confirmation واضحًا، ثم ينعش summary والقائمة.\n- التحرير والتحكم المتقدم ينتقل إلى الويب، مع deep link موثق.\n\n### FR-07 — التنبيهات\n\n- أنواع v1: حجز جديد، lead جديد، رسالة دعم جديدة، مقال/تعليق يحتاج قرارًا، تنبيه اشتراك مهم.\n- كل push يتضمن route داخليًا ويدخل للعنصر الصحيح بعد tap.\n- المستخدم يقدر يعطل فئات غير حرجة؛ لا يعطل notifications التشغيلية المهمة افتراضيًا بدون قرار business.\n\n### FR-08 — حالات الشبكة\n\n- loading skeleton، empty state، error state، وretry في كل list.\n- cache للقراءة الأخيرة مع timestamp «آخر تحديث».\n- mutations لا تعرض نجاحًا قبل تأكيد الخادم؛ عند الفشل تعرض إمكانية retry آمنة.\n\n---\n\n## 9. المتطلبات غير الوظيفية\n\n### UX وRTL\n\n- Arabic RTL هو الوضع الافتراضي، مع دعم إنجليزي لاحقًا دون كسر التخطيط.\n- safe-area وkeyboard-aware layouts على Android وiOS.\n- كل عناصر الضغط الأساسية 44–48pt/px عمليًا.\n- لا محتوى تحت bottom tab أو CTA ثابت؛ مساحة سفلية محسوبة مع `safe-area-inset`.\n- أفعال خطرة (حذف/رفض/أرشفة) تحتاج confirmation ودلالة واضحة.\n\n### الأداء\n\n- قوائم pagination بدل تحميل كل records.\n- صور thumbnails بأحجام موبايل وcaching.\n- dashboard endpoint مركب لتفادي سلسلة network calls عند الفتح.\n- لا تحمّل مكتبات الرسوم أو محررات المحتوى في bundle الـMVP.\n\n### الأمان والخصوصية\n\n- HTTPS فقط؛ عدم تسجيل token أو كلمات المرور أو PII في logs أو analytics.\n- refresh-token rotation وdevice registration قابل للإبطال.\n- rate limits وmonitoring على auth وmutations.\n- audit log للـstatus changes والموافقات في مرحلة API implementation.\n\n### الجودة\n\n- اختبارات unit للـcontracts وحالات التحويل.\n- integration tests لـAPI authorization وownership.\n- E2E لمسارات: login، حجز، push deep link، logout.\n- اختبار RTL، keyboard، offline، Android وiOS على أجهزة فعلية قبل preview.\n\n---\n\n## 10. هندسة الحل\n\n### داخل monorepo\n\n```text\nMODONTY/\n├─ console/                 # Next.js web، يستمر كما هو\n├─ console-mobile/          # Expo app الجديدة\n├─ shared/                  # Prisma/server code — لا يذهب إلى bundle الموبايل\n└─ contracts/               # جديد لاحقًا: Zod DTOs/types بلا Node أو Prisma\n```\n\n### console-mobile\n\n```text\nsrc/\n├─ app/              # Expo Router routes وlayouts فقط\n├─ features/         # auth, dashboard, bookings, inbox, content, account\n├─ ui/               # design system native\n├─ services/         # API client, token refresh, upload, push\n├─ store/            # session وcached UI state\n├─ hooks/\n└─ lib/\n```\n\n### API المقترحة\n\n```text\nconsole/app/api/mobile/v1/\n├─ auth/login\n├─ auth/refresh\n├─ auth/logout\n├─ me\n├─ dashboard\n├─ bookings\n├─ bookings/[id]\n├─ inbox\n├─ leads/[id]\n├─ support/[id]\n├─ articles\n├─ articles/[id]\n├─ notification-devices\n└─ notifications/preferences\n```\n\n**مبدأ فصل واضح:** route handlers تستدعي services server-side مشتركة؛ لا نستورد server actions من mobile، ولا نكرر business rules في React Native.\n\n### المكتبات المبدئية\n\n- Expo SDK حديث + TypeScript.\n- Expo Router.\n- TanStack Query للـserver cache وmutations.\n- Expo SecureStore للجلسة.\n- Expo Notifications بعد development build.\n- Native SVG/icons من نظام Modonty؛ لا نعتمد Lucide إلا لسبب موثق.\n- EAS Build / EAS Update للـpreview والإصدارات.\n\nلا نثبت أي مكتبة قبل إنشاء skeleton والموافقة على هذا الـBRD؛ نتحقق من توافقها مع Expo SDK المختار وقت التنفيذ.\n\n---\n\n## 11. ترتيب التنفيذ المقترح\n\n### المرحلة A — اعتماد المنتج (لا كود)\n\n1. اعتماد هذا BRD وتثبيت MVP/non-MVP.\n2. تحديد شخصيات العملاء وأنواع التنبيهات والأولوية.\n3. رسم Mobile UI System الكامل وحالاته، ثم مراجعة الصور والتدفقات.\n4. حسم سياسة login وreset password وsupport داخل التطبيق.\n\n### المرحلة B — Foundation\n\n1. إنشاء `console-mobile/` داخل workspace.\n2. إعداد Expo, Router, RTL, themes, env separation, lint/test.\n3. بناء UI primitives والحالات العامة دون ربط بيانات.\n4. إعداد internal preview builds؛ لا App Store submission بعد.\n\n### المرحلة C — API/Auth contract\n\n1. تعريف `contracts/` لـsession، dashboard، bookings.\n2. بناء Mobile API مصادق عليه واختبارات ownership.\n3. Token lifecycle، logout، device registration.\n4. logging وerror handling بدون PII.\n\n### المرحلة D — أول Vertical Slice\n\n```text\nLogin → اليوم → الحجوزات → تفاصيل الحجز → تغيير الحالة → إشعار نجاح\n```\n\nلا نفتح نطاق features أخرى حتى ينجح هذا المسار على Android وiOS وبيانات حقيقية غير حساسة.\n\n### المرحلة E — MVP\n\n1. Inbox/Leads/Support.\n2. Content approvals.\n3. Push notifications + deep links.\n4. Account summary/settings.\n5. QA شامل وinternal pilot مع عملاء مختارين.\n\n### المرحلة F — القرار بعد pilot\n\n- مراجعة الاستخدام الحقيقي ووقت الاستجابة للحجز والـlead.\n- ترتيب المزايا التالية حسب الاستخدام لا حسب كثرة صفحات الويب.\n- إضافة media/analytics/FAQ فقط عندما تدعمها البيانات.\n\n---\n\n## 12. المخاطر والضوابط\n\n| الخطر | الضبط |\n|---|---|\n| تحويل التطبيق إلى نسخة ويب مضغوطة | نلتزم بـMVP action-first وويب للأدوات الثقيلة |\n| تسريب بيانات عميل لآخر | token-derived clientId + ownership tests + audit logs |\n| محاولة إعادة استخدام `shared` كاملًا | contracts منفصل بلا Prisma/Node |\n| توسيع API بلا قواعد موحدة | services + Zod contracts + versioned Mobile API |\n| تكرار mutation بسبب شبكة ضعيفة | idempotency وoptimistic UI محدود |\n| إشعارات مزعجة | فئات واضحة، priority، preferences وقياس opt-out |\n| تعقيد محررات الموبايل | open-web مؤقتًا، لا نسخ محرر سطح المكتب |\n| اختلاف Android/iOS/RTL | أجهزة فعلية، E2E، safe-area/keyboard test matrix |\n\n---\n\n## 13. قرارات مطلوبة منك قبل التنفيذ\n\n1. هل نعتمد اسم المنتج الأولي: **Modonty Console** أم اسم مستقل يظهر للعميل؟\n2. هل العميل الواحد قد يملك أكثر من موقع/نشاط؟ إذا نعم، نحتاج site switcher من أول نسخة.\n3. هل الحجوزات وleads هما أعلى أولوية فعلًا أم المحتوى/المقالات أولًا؟\n4. هل الردود على support/comments من التطبيق تدخل MVP أم تبدأ read + open-web؟\n5. هل نبدأ pilot على Android وiOS معًا أم Android internal أولًا؟\n6. ما notifications التي تعتبر حرجة ولا يجوز تعطيلها؟\n7. هل هناك أعضاء فريق بأدوار مختلفة داخل حساب العميل؟ الكود الحالي يبدو client-account centered؛ إن وُجدت أدوار، يجب تصميمها قبل auth API.\n\n---\n\n## 14. شروط البدء (Go / No-Go)\n\nنبدأ كتابة أي كود فقط إذا تحققت هذه الشروط:\n\n- [ ] اعتماد نطاق MVP أعلاه أو تعديله صراحة.\n- [ ] حسم قرارات القسم 13.\n- [ ] اعتماد Mobile UI System للـ5 tabs ومسار الحجز.\n- [ ] اعتماد نمط Mobile API token-based وعدم ربط التطبيق بـNextAuth cookies.\n- [ ] تحديد بيئات preview/production ومالك إعدادات EAS وPush credentials.\n- [ ] اتفاق على pilot users ومعيار نجاحه.\n\n---\n\n## ملحق A — مرجع الدراسة البرمجية\n\n- `console/app/(dashboard)/components/nav-config.ts`: بنية navigation الحالية، الشارات، والمجموعات.\n- `console/app/(dashboard)/layout.tsx`: session gate، client scoping، subscription/YMYL/counts.\n- `console/app/(dashboard)/dashboard/page.tsx`: dashboard الحالي ومصادر المقاييس.\n- `console/app/(dashboard)/dashboard/bookings/actions/booking-actions.ts`: دورة حالات الحجز والتحقق من الملكية.\n- `console/auth.config.ts` و`console/lib/auth.ts`: credentials وJWT الحاليان.\n- `console/app/api/v1/*`: API عام لمقالات المواقع، وليس Mobile API مصادقًا عليه.\n\n## ملحق B — مراجع التقنية\n\n- Expo Router: https://docs.expo.dev/router/introduction/\n- Expo Notifications: https://docs.expo.dev/push-notifications/overview/\n- Expo EAS Update: https://docs.expo.dev/eas-update/introduction/\n- React Native Accessibility: https://reactnative.dev/docs/accessibility.html\n- WCAG Target Size: https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html\n\n---\n\n## 15. تحقق حي من تجربة عميل فعلية\n\n**طريقة التحقق:** مراجعة read-only لحساب عميل حي في `console.modonty.com`، ومراجعة كود الكونسل ومساراته. لم تُغيّر أي حالة أو بيانات خلال هذه الدراسة.  \n**تنبيه:** الحساب فُتح من سياق إداري منتحل للعميل؛ الأرقام أدناه دليل على نوع البيانات والتدفقات، وليست مؤشرات أداء عامة لكل العملاء.\n\n### 15.1 ما ظهر للعميل الحي\n\n- Dashboard يعطي ثلاث فئات واضحة بالفعل: عناصر تحتاج انتباهًا، أداء، وجمهور.\n- الحساب المراجع يملك حجوزات واردة عبر «اترك رقمك» وWhatsApp، وتعليقات تنتظر قرارًا، ورسائل دعم وLeads.\n- صفحة الحجوزات توفر تصفية بالقناة والحالة، بحثًا، مصدر الطلب، وقت الوصول، ثم إجراءات: تم التواصل / تم / أرشفة / حذف.\n- صفحة الدعم توفر inbox وحالات: جديد / مقروء / تم الرد / مؤرشف، مع الرد والأرشفة والحذف.\n- صفحة التعليقات توفر طابور مراجعة بإجراءات موافقة / رفض / حذف.\n- صفحة المقالات تفصل بين بانتظار الموافقة، المجدولة، والمنشورة.\n- الملف والإعدادات يحويان حقولًا كثيرة وإجراءات إدارة أعمق: بيانات النشاط، SEO، الاشتراك، Telegram، تفضيلات إشعارات وكلمة المرور.\n\n### 15.2 اختبار عرض الهاتف — 390×844\n\nواجهة الويب تستجيب تقنيًا للشاشة الصغيرة، لكنها ليست تطبيق متابعة موبايل مريحًا:\n\n| الملاحظة المقاسة | الأثر على العميل | قرار تطبيق الموبايل |\n|---|---|---|\n| شاشة الحجوزات تصبح قائمة بطول يتجاوز 4,100px | متابعة 12 طلبًا تعني تمريرًا طويلًا وتكرار أزرار لكل صف | بطاقة حجز مختصرة + تفاصيل في شاشة مستقلة + إجراء رئيسي واحد ظاهر |\n| فلاتر القنوات والحالات ارتفاعها 36px | أقل من الراحة العملية للإبهام | 48px للـfilters المهمة، وتحويل الفلاتر الثانوية إلى bottom sheet |\n| checkbox وبعض عناصر الإدارة تقاس 16px | سهلة الخطأ وغير مناسبة للمهام اليومية | لا bulk selection في MVP؛ أفعال فردية واضحة |\n| أيقونات أعلى الويب 40px و«خروج» 24px | الحد الأدنى أو أقل لبعض الأفعال | targets 44–48px، وlogout داخل الحساب لا أعلى كل شاشة |\n| Dashboard على الهاتف يتجاوز 3,900px | الأداء والرسوم يزاحمان العمل العاجل | شاشة «اليوم» تبدأ بما يحتاج قرارًا؛ analytics ملخص ثانوي |\n| Profile وSettings يمتدان لأكثر من 2,600px و3,300px | نماذج سطح مكتب طويلة | أقسام قصيرة قابلة للإجراء فقط؛ الباقي فتح على الويب |\n\n### 15.3 الاستنتاج المنتجّي\n\nأهم شيء يصطحبه العميل في جواله ليس «كل أدوات إدارة الموقع»، بل أربعة أنواع من الوقائع:\n\n1. **فرصة تحتاج سرعة:** حجز جديد أو lead جديد، مع معرفة المصدر ووسيلة التواصل وإجراء تواصل سريع.\n2. **رسالة تحتاج جوابًا:** دعم أو سؤال أو تعليق، مع سياق مختصر وقرار/رد آمن.\n3. **محتوى يحتاج قرارًا:** مقال أو تعليق منتظر؛ موافقة أو رفض بعد معاينة قصيرة.\n4. **تنبيه حالة الحساب:** اشتراك أو فاتورة أو اكتمال معلومة مهمة، من دون ملء كل شاشة الحساب.\n\nالأداء، SEO، media، وصفحة النشاط قيمة للعميل، لكنها ليست دائمًا سببًا لفتح التطبيق من الهاتف. مكانها في التطبيق يكون **ملخصًا وروابط سياقية**، لا تبويبًا رئيسيًا في MVP.\n\n---\n\n## 16. إعادة ترتيب MVP بناءً على الدليل الحي\n\n### ما يجب أن يكون في الهاتف دائمًا\n\n| الأولوية | الحاجة | ما يفعله العميل في أقل عدد نقرات |\n|---|---|---|\n| P0 | حجز أو lead جديد | يرى من وصل، من أين، متى، ويغيّر الحالة أو يبدأ التواصل |\n| P0 | رسالة دعم/سؤال يحتاج متابعة | يقرأ السياق ويرد أو يحدد «تم الرد» |\n| P0 | عنصر بانتظار الموافقة | معاينة قصيرة ثم موافقة أو رفض مؤكد |\n| P1 | ملخص «اليوم» | يرى فقط الـcounts والوقائع العاجلة ويفتح العنصر الصحيح |\n| P1 | push + deep link | يفتح الإشعار مباشرة على الحجز/الرسالة/المقال الصحيح |\n| P1 | حالة الحساب الحرجة | تنبيه واضح للخطة/الفاتورة/المعلومة الناقصة، مع مسار معالجة |\n| P2 | أداء مختصر | مشاهدات، conversion، ونمو مختصر؛ التفاصيل على الويب |\n\n### ما لا يدخل أول تطبيق موبايل\n\n- bulk selection وbulk delete.\n- export CSV.\n- محرر المقالات أو الصفحة الكامل.\n- SEO intake، keywords، competitors، site pages وpage blocks.\n- إعدادات Telegram التقنية أو تغيير كلمة المرور من أول نسخة.\n- الرسوم والتحليلات الموسعة.\n\n### التبويبات بعد التحقق الحي\n\n1. **اليوم** — كل ما يحتاج انتباهًا بترتيب الأولوية.\n2. **الحجوزات** — الطلبات الواردة وحالاتها.\n3. **الوارد** — Leads، الدعم، والأسئلة/التعليقات التي تحتاج قرارًا.\n4. **المحتوى** — المقالات والاعتمادات فقط.\n5. **حسابي** — الملف المختصر، التنبيهات، والخروج وفتح الويب.\n\n### المسار الذي يجب إثباته أولًا\n\n```text\nإشعار حجز جديد → شاشة تفاصيل حجز → تواصل/تحديث الحالة → نجاح واضح → عودة إلى «اليوم» بعد انخفاض العداد\n```\n\nإذا كان هذا المسار سريعًا وآمنًا، التطبيق يحل مشكلة حقيقية حتى قبل إضافة كل بقية الكونسل.\n";
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^ )]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
function table(lines){const cells=x=>x.split('|').slice(1,-1).map(v=>v.trim());const h=cells(lines[0]);const rows=lines.slice(2).map(cells);return '<table><thead><tr>'+h.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function render(md){const L=md.replace(/\r/g,'').split('\n');let out='',i=0,list=null;while(i<L.length){let x=L[i];if(/^```/.test(x)){let code=[];i++;while(i<L.length&&!/^```/.test(L[i]))code.push(L[i++]);out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';i++;continue}if(/^\|/.test(x)&&i+1<L.length&&/^\|[-:| ]+\|$/.test(L[i+1])){let t=[x,L[++i]];while(i+1<L.length&&/^\|/.test(L[i+1]))t.push(L[++i]);out+=table(t);i++;continue}if(/^-{3,}$/.test(x.trim())){out+='<hr>';i++;continue}let m=x.match(/^(#{1,3})\s+(.+)$/);if(m){let tag='h'+m[1].length;let id=m[2].toLowerCase().replace(/[^\u0600-\u06ffa-z0-9]+/gi,'-').replace(/^-|-$/g,'');out+=`<${tag} id="${id}">${inline(m[2])}</${tag}>`;i++;continue}m=x.match(/^\s*(\d+)\.\s+(.+)$/);if(m){if(list!=='ol'){if(list)out+=`</${list}>`;out+='<ol>';list='ol'}out+='<li>'+inline(m[2])+'</li>';i++;continue}m=x.match(/^[-*]\s+(.+)$/);if(m){if(list!=='ul'){if(list)out+=`</${list}>`;out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>';i++;continue}if(list){out+=`</${list}>`;list=null}if(/^\s*$/.test(x)){i++;continue}out+='<p>'+inline(x)+'</p>';i++}if(list)out+=`</${list}>`;return out}
const article=document.getElementById('content');article.innerHTML=render(markdown);const toc=document.getElementById('toc');article.querySelectorAll('h1,h2').forEach(h=>{if(!h.id)return;const a=document.createElement('a');a.href='#'+h.id;a.textContent=(h.tagName==='H2'?'— ':'')+h.textContent;toc.appendChild(a);toc.appendChild(document.createElement('br'))});
</script>
