<header><h1>اقتراح تطبيق مودونتي كونسول للموبايل</h1><p>نسخة قرار مختصرة — نعدّلها معًا قبل التصميم</p></header>
<main class="wrap"><div class="notice">هذه صفحة قرار مختصرة. أضف ما ينقص قبل أن نعتمد الاتجاه أو نصمم أي شاشة.</div><nav class="toc" id="toc"><h2>المحتويات</h2></nav><article id="content"></article></main>
<script>
const markdown = "# اقتراح النسخة الأولى — Modonty Console Mobile\n\n## الأساس الذي اتفقنا عليه\n\nالتطبيق ليس نسخة من Console الويب، ولا تطبيق حجوزات في المقام الأول.\n\n**هو تطبيق إشعارات ومتابعة عمل العميل.**  \nاليوم أغلب الأحداث تصل إلى Telegram، بينما العميل العربي غالبًا لا يستخدمه. تطبيق الموبايل يجعل الإشعار يصل للعميل، ثم يفتح له الإجراء الصحيح فورًا.\n\n---\n\n## قرار البدء السريع\n\n| نبدأ الآن | لا نحتاجه الآن | قرارنا |\n|---|---|---|\n| Login + التحديثات + مراجعة المقال | Android Studio على جهازك | نبدأ بـDummy Data ونراجع من هاتفك |\n| Push حقيقي بعد اعتماد الواجهات | ربط API أو حذف Telegram | نربطه في المرحلة التالية فقط |\n| تجربة Android من هاتفك | جهاز تطوير قوي لديك | بناء سحابي عبر Expo عند الحاجة |\n\n---\n\n## كيف نعمل ونجرب بدون Android Studio\n\nأنت لا تحتاج تثبيت Android Studio ولا تشغيل أي محاكي على جهازك.\n\n```text\nأنا أبني واجهة Expo\n        ↓\nأنت تراجعها على هاتفك بـ Expo Go عبر QR\n        ↓\nنتفق على الـUI والـDummy Data\n        ↓\nأبني نسخة اختبار سحابية (Development Build)\n        ↓\nتثبتها من رابط/QR وتجرب Push الحقيقي\n```\n\n| المرحلة | ما تستخدمه أنت | ما نتحقق منه |\n|---|---|---|\n| تصميم الواجهات | Expo Go على الجوال | التنقل، النص، الأزرار، والـDummy Data |\n| Push حقيقي | نسخة اختبار من رابط/QR | استقبال الإشعار وفتح العنصر الصحيح |\n| الإطلاق | Google Play / App Store | فقط عند جاهزية النسخة الأولى |\n\n- Expo Go مجاني وخفيف؛ نستخدمه لمراجعة الواجهة فقط.\n- Push الحقيقي يحتاج Development Build سحابيًا، وليس Android Studio على جهازك.\n- EAS Build ينشئ نسخة Android في السحابة؛ نحن لا نحتاج محاكيًا محليًا.\n- نتابع القرار من هذا الـHTML، ثم من هاتفك عبر لقطات الشاشة وملاحظاتك.\n\n---\n\n## دورة العمل الأساسية\n\n```text\nفريق المحتوى يجهز المقال\n        ↓\nيُرسل للعميل للمراجعة\n        ↓\nالعميل يفتح الإشعار\n        ↓\nيعتمد المقال أو يطلب تعديلًا\n        ↓\nفريق المحتوى يستلم القرار ويكمل العمل\n```\n\nهذه هي أول رحلة نصممها ونثبتها.\n\n---\n\n## ما يدخل النسخة الأولى\n\n### 0. الدخول والجلسة\n\n- شاشة دخول واضحة: **username أو البريد الإلكتروني** + كلمة المرور.\n- إظهار/إخفاء كلمة المرور، رسالة خطأ مفهومة، و«نسيت كلمة المرور؟».\n- بعد الدخول تبقى الجلسة آمنة؛ العميل لا يعيد كتابة البيانات كل مرة يفتح التطبيق.\n- logout من «حسابي» فقط.\n\n### 1. مركز الإشعارات — قلب التطبيق\n\n- كل حدث مُفعّل للعميل يصل أولًا إلى سجل دائم داخل التطبيق، ثم يُرسل له Push حسب تفضيله وأولوية الحدث.\n- الضغط على الإشعار يفتح العنصر الصحيح، لا مجرد الصفحة الرئيسية.\n- تبويب «التحديثات» يحتفظ بتاريخ الأحداث وحالتها: جديد / تمت رؤيته / تم الإجراء.\n- أحداث المقال والتفاعل الحالية موجودة بالفعل في الكونسل عبر Telegram؛ نستخدم نفس مفاتيح الأحداث كمرجع واحد، لا نبني قائمة موازية للموبايل.\n\n### تصور الإشعارات: ما سنستخدمه\n\n```text\nحدث في الكونسل\n      ↓\nسجل إشعار دائم للعميل (In-app inbox)\n      ├── Push للموبايل عبر Expo Notifications\n      └── Telegram يستمر بالتوازي في البداية\n```\n\n- **Expo Notifications + Expo Push Service** للنسخة الأولى: التطبيق يستقبل Push أصليًا على iOS وAndroid، والسيرفر يرسله من الخلفية.\n- خدمة إرسال الـPush من Expo **مجانية**؛ التكلفة المحتملة لاحقًا تكون من بناء التطبيق/تحديثاته السحابية أو حسابات المتاجر، لا من عدد رسائل الـPush نفسها.\n- **In-app inbox** هو المصدر الموثوق: إن كان الهاتف بلا إنترنت أو أُغلق الـPush، يبقى الحدث ظاهرًا داخل «التحديثات» حتى يُرى أو يُنجز.\n- **Telegram لا نحذفه الآن**: يبقى قناة موازية خلال الانتقال؛ لا نكسر تنبيهات العملاء الحالية.\n- لكل إشعار: نوع الحدث، العنصر المرتبط، الوقت، الحالة، ورابط عميق يفتح المقال أو السؤال أو الرفع الصحيح.\n- نطلب إذن Push بعد تسجيل الدخول وعند شرح فائدته، وليس قبل أن يعرف العميل لماذا يحتاجه.\n\n### قاعدة الـevents\n\nكل الـevents المفعّلة تظهر في سجل التطبيق. أما تنبيه الـPush فيُضبط من «حسابي» بحسب الفئة؛ الافتراضي يركز على ما يحتاج إجراءً، حتى لا يتحول الهاتف إلى ضوضاء بسبب المشاهدات والإعجابات.\n\n| الفئة | أمثلة | الافتراضي |\n|---|---|---|\n| يحتاج إجراء | مقال للمراجعة، سؤال مباشر، تعليق/رسالة جديدة، فشل رفع | Push فوري + يظهر في التحديثات |\n| متابعة عمل | تعديل مكتمل، معالجة Reel/Video، اعتماد أو رفض | Push + يظهر في التحديثات |\n| نشاط ومؤشرات | مشاهدة، إعجاب، حفظ، مشاركة، زيارة | يظهر في التحديثات؛ Push اختياري/ملخص |\n\nلا نعتمد «22 event» كتخمين: الكود الحالي يحوي كتالوجًا لزوار المقال والصفحة والتواصل المباشر، وأول خطوة تنفيذية ستكون تدقيقه وربط أحداث مراجعة المقال ورفع المحتوى به في catalog واحد محايد عن Telegram.\n\n### 2. مراجعة المقال\n\n- مقالات بانتظار المراجعة.\n- معاينة المقال بشكل قراءة مريح على الجوال.\n- **اعتماد** المقال.\n- **طلب تعديل** مع ملاحظة واضحة للـcontent team.\n- متابعة الحالة: قيد المراجعة / يحتاج قرارك / تم التعديل / منشور.\n\n### 3. الرسائل والتفاعل\n\n- أسئلة الزوار: يقرأ العميل السؤال ويرد.\n- ملاحظات وتعليقات العملاء: يقرأ، يرد، أو يعتمد/يرفض عند الحاجة.\n- المتابعون/المشتركون: يرى من تابع نشاطه والتنبيه عند وصول متابعة جديدة.\n\n### 4. رفع المحتوى المرئي\n\n- رفع Reel.\n- رفع Video.\n- يرى حالة الرفع أو المعالجة أو المراجعة.\n- لا نبني Media Manager كامل في البداية؛ فقط رحلة رفع واضحة وموثوقة.\n\n### 5. حسابي وإعدادات الإشعارات\n\n- بيانات العميل المختصرة.\n- تشغيل/إيقاف فئات التنبيه غير الحرجة.\n- دعم ومساعدة.\n- فتح Console Web عند الحاجة لأداة غير موجودة في التطبيق.\n\n---\n\n## التنقل المقترح للنسخة الأولى\n\n```text\n[ التحديثات ]  [ المقالات ]  [ التفاعل ]  [ رفع ]  [ حسابي ]\n```\n\n| التبويب | وظيفته |\n|---|---|\n| التحديثات | كل ما حدث ويحتاج انتباهًا؛ هو الصفحة الأولى |\n| المقالات | مراجعة، اعتماد، طلب تعديل، ومتابعة الحالة |\n| التفاعل | أسئلة، ملاحظات، تعليقات، ومتابعون |\n| رفع | Reel أو Video وحالة كل عملية رفع |\n| حسابي | إعدادات التنبيهات والمساعدة وفتح الويب |\n\n**الحجوزات والـLeads تبقى خارج أول UI** إلا إذا قررنا لاحقًا أنها event حرِجة ضمن مركز التحديثات.\n\n---\n\n## شكل صفحة «التحديثات»\n\n```text\nمرحبًا، [اسم العميل]\n\nجديد لك اليوم\n\n🔴 مقال ينتظر موافقتك                    [ مراجعة ]\n🟠 تعديل على المقال اكتمل                [ فتح ]\n🟡 سؤال جديد من زائر                     [ رد ]\n🟣 Reel تم رفعه وينتظر المعالجة          [ متابعة ]\n\nعرض كل التحديثات\n```\n\n### ترتيب الأولوية\n\n1. مقال ينتظر قرار العميل.\n2. سؤال أو ملاحظة تحتاج ردًا.\n3. تحديث على مقال طلب العميل تعديله.\n4. فشل رفع فيديو/Reel أو اكتمال معالجته.\n5. متابعة/تعليق جديد ومعلومات لا تتطلب قرارًا فوريًا.\n\n---\n\n## UI أولًا — Dummy Data أولًا\n\nهذه مرحلة تصميم وتثبيت تجربة، وليست ربط API.\n\n```text\nUI Components + Screens\n        ↓\nDummy data / event fixtures\n        ↓\nمراجعة العميل واعتماد الـUX\n        ↓\nData adapter واحد\n        ↓\nReal API لاحقًا\n```\n\n### القاعدة التقنية\n\n- الشاشات لا تعرف API مباشرًا.\n- كل شاشة تقرأ من repository / adapter ثابت.\n- الآن: `MockConsoleRepository` يعيد dummy data.\n- لاحقًا: `ApiConsoleRepository` يعيد نفس الـtypes من API.\n- تغيير مصدر البيانات لا يغير UI أو navigation أو business flow.\n\n---\n\n## ما لا ندخله الآن\n\n- لوحة analytics كاملة.\n- محرر صفحات أو SEO أو إعدادات موقع معقدة.\n- فواتير وإدارة اشتراكات مفصلة.\n- bulk actions، export، وحذف جماعي.\n- Media library كاملة؛ نبدأ بالرفع فقط.\n- كل صفحات الكونسل الموجودة اليوم.\n\n---\n\n## قرارات نحتاجها منك قبل التصميم\n\n1. عند «طلب تعديل المقال»: هل العميل يكتب ملاحظة عامة، أم يعلّق على جزء محدد من المقال، أم الاثنان؟\n2. نثبت catalog النهائي للأحداث: أي حدث فوري، وأي حدث يظهر فقط/يلخّص في التحديثات.\n3. «ملاحظات العميل»: هل هي تعليقات على المقال، أم رسائل بين العميل وفريق مودونتي، أم كلاهما؟\n4. المتابعون: هل المطلوب رؤية الاسم فقط، أم التواصل معهم، أم أرقام نمو فقط؟\n5. رفع Reel/Video: هل العميل يرفع ملفًا خامًا أم رابطًا أم كليهما؟\n\n---\n\n## أول 4 شاشات نصممها\n\n```text\nتسجيل الدخول → التحديثات → قائمة المقالات → مراجعة مقال → طلب تعديل / اعتماد\n```\n\nبعد اعتمادها نضيف:\n\n```text\nالتفاعل → تفاصيل سؤال → رد\nرفع → اختيار Reel/Video → حالة الرفع\n```\n";
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^ )]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
function table(lines){const cells=x=>x.split('|').slice(1,-1).map(v=>v.trim());const h=cells(lines[0]);const rows=lines.slice(2).map(cells);return '<table><thead><tr>'+h.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function render(md){const L=md.replace(/\r/g,'').split('\n');let out='',i=0,list=null;while(i<L.length){let x=L[i];if(/^```/.test(x)){let code=[];i++;while(i<L.length&&!/^```/.test(L[i]))code.push(L[i++]);out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';i++;continue}if(/^\|/.test(x)&&i+1<L.length&&/^\|[-:| ]+\|$/.test(L[i+1])){let t=[x,L[++i]];while(i+1<L.length&&/^\|/.test(L[i+1]))t.push(L[++i]);out+=table(t);i++;continue}if(/^-{3,}$/.test(x.trim())){out+='<hr>';i++;continue}let m=x.match(/^(#{1,3})\s+(.+)$/);if(m){let tag='h'+m[1].length;let id=m[2].toLowerCase().replace(/[^\u0600-\u06ffa-z0-9]+/gi,'-').replace(/^-|-$/g,'');out+=`<${tag} id="${id}">${inline(m[2])}</${tag}>`;i++;continue}m=x.match(/^\s*(\d+)\.\s+(.+)$/);if(m){if(list!=='ol'){if(list)out+=`</${list}>`;out+='<ol>';list='ol'}out+='<li>'+inline(m[2])+'</li>';i++;continue}m=x.match(/^[-*]\s+(.+)$/);if(m){if(list!=='ul'){if(list)out+=`</${list}>`;out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>';i++;continue}if(list){out+=`</${list}>`;list=null}if(/^\s*$/.test(x)){i++;continue}out+='<p>'+inline(x)+'</p>';i++}if(list)out+=`</${list}>`;return out}
const article=document.getElementById('content');article.innerHTML=render(markdown);const toc=document.getElementById('toc');article.querySelectorAll('h1,h2').forEach(h=>{if(!h.id)return;const a=document.createElement('a');a.href='#'+h.id;a.textContent=(h.tagName==='H2'?'— ':'')+h.textContent;toc.appendChild(a);toc.appendChild(document.createElement('br'))});
</script>
</body>
