<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتجاه ٤ — المزيج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=1791543415">
<style>
/* ===== اتجاه ٤: المزيج — هيكل ١ (عنوان كبير · بطل بعرض الشاشة · كبسولة عائمة) + لمسات ٢ (أوقات القراءة الملوّنة · حركة نابضة)
   + قراءة ٣ (قصص · قائمة الجرائد · قارئ بلا إطار). بلا تمويه: الكبسولة لون شبه معتم فتبقى خفيفة على أندرويد. ===== */
.M{--bg:#FAF9F6;--s1:#fff;--s2:#F0EEEA;--text:#0E065A;--muted:#5E5C66;--line:rgba(14,6,90,.09);
  --primary:#3030FF;--onP:#fff;--pc:#E8E8FF;--accent:#007575;--ring1:#00D8D8;--ring2:#3030FF;
  --bar:rgba(255,255,255,.94);--bar-shadow:0 12px 32px -10px rgba(14,6,90,.35),0 0 0 1px rgba(14,6,90,.06);
  --listen:#27B07D;--onListen:#fff;--save:#F59F0A;--onSave:#0E065A;--share:#7C3BED;--onShare:#fff;
  --spring:cubic-bezier(.34,1.56,.64,1);background:var(--bg);color:var(--text)}
:root[data-theme="dark"] .M{--bg:#0F0F12;--s1:#18181D;--s2:#222229;--text:#EDEDF0;--muted:#A9AEB9;--line:rgba(255,255,255,.09);
  --primary:#7B7BFF;--onP:#0E065A;--pc:#2A2A66;--accent:#00D8D8;
  --bar:rgba(30,30,37,.95);--bar-shadow:0 12px 32px -10px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07);
  --listen:#2ED195;--onListen:#0E065A;--save:#F6AE31;--onSave:#0E065A;--share:#9B68F3;--onShare:#0E065A}
.M .statusbar{color:var(--text)}
.M button,.M .press{transition:transform .35s var(--spring),background .2s,color .2s}
.M button:active,.M .press:active{transform:scale(.94)}

/* الرأس: عنوان كبير يتحوّل لرأس صغير */
.M .mini{position:absolute;top:0;inset-inline:0;height:82px;padding:36px 16px 0;z-index:20;display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
.M .mini.on{opacity:1;transform:none;pointer-events:auto}
.M .mini b{flex:1;text-align:center;font-size:17px;font-weight:800}
.M .mini .sp{width:40px}
.M .big{padding:44px 16px 4px;display:flex;align-items:flex-end;gap:8px}
.M .big .ttl{flex:1}
.M .big small{display:block;font-size:14px;color:var(--muted);font-weight:500}
.M .big h2{font-size:34px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.M .ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--text)}
.M .ib.modo{background:linear-gradient(135deg,#3030FF,#00D8D8);color:#fff}

/* القصص (من ٣) */
.M .stories{display:flex;gap:12px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.M .stories::-webkit-scrollbar,.M .rail::-webkit-scrollbar,.M .utabs::-webkit-scrollbar{display:none}
.M .st{flex:0 0 68px;text-align:center;font-size:11.5px;line-height:1.4;color:var(--muted)}
.M .st .ring{width:68px;height:68px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--ring1),var(--ring2),var(--ring1));margin-bottom:5px}
.M .st .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg)}
.M .st span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* البطل بعرض الشاشة (من ١) — أوّل بطاقة بزاوية تعبيرية (من ٢) */
.M .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 16px 4px;scrollbar-width:none}
.M .hero{position:relative;flex:0 0 300px;height:380px;border-radius:30px;overflow:hidden;scroll-snap-align:center;background:#222;color:#fff}
.M .hero:first-child{border-radius:36px 36px 36px 12px}
.M .hero img{width:100%;height:100%;object-fit:cover}
.M .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 25%,transparent 40%,rgba(8,5,40,.92))}
.M .hero .tag{position:absolute;top:14px;right:14px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#00D8D8;color:#0E065A;font-weight:800;font-size:12.5px}
.M .hero .in{position:absolute;inset-inline:16px;bottom:16px;z-index:2}
.M .hero .who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;opacity:.95}
.M .hero .who img{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain}
.M .hero h4{font-size:20px;font-weight:800;line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.M .hero .meta{color:rgba(255,255,255,.88);margin-top:8px}
.M .dots{display:flex;gap:6px;justify-content:center;padding-top:10px}
.M .dots i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:width .3s var(--spring)}
.M .dots i.on{width:18px;background:var(--primary)}

.M .meta{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--muted)}
.M .meta span{display:inline-flex;gap:4px;align-items:center}

/* عندك كم دقيقة؟ (من ٢) */
.M .time{margin:22px 16px 0;padding:14px;border-radius:26px;background:var(--s1);border:1px solid var(--line)}
.M .time b{font-size:17px;font-weight:800}
.M .time small.s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.M .times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.M .times button{height:86px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:13.5px}
.M .times button small{font-weight:500;font-size:11.5px;opacity:.92}
.M .times .w{background:var(--listen);color:var(--onListen)}
.M .times .c{background:var(--save);color:var(--onSave)}
.M .times .r{background:var(--share);color:var(--onShare)}

.M .sec{display:flex;align-items:baseline;justify-content:space-between;padding:24px 16px 10px}
.M .sec h3{font-size:19px;font-weight:800}
.M .sec a{font-size:13.5px;font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:2px}

/* تبويبات علوية + قائمة الجرائد (من ٣) */
.M .utabs{position:sticky;top:82px;z-index:6;background:var(--bg);display:flex;gap:22px;padding:14px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:10px}
.M .utabs button{flex:0 0 auto;position:relative;height:40px;font-size:15px;font-weight:700;color:var(--muted)}
.M .utabs button.on{color:var(--text)}
.M .utabs button.on::after{content:"";position:absolute;bottom:-1px;inset-inline:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.M .kick{font-size:12.5px;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:6px}
.M .kick img{width:18px;height:18px;border-radius:50%;background:#fff;object-fit:contain}
.M .it{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--line)}
.M .it .t{flex:1;min-width:0}
.M .it h4{font-size:15.5px;font-weight:800;line-height:1.6;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.M .it>img{width:96px;height:96px;border-radius:18px;object-fit:cover;flex:0 0 auto}
.M .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.M .sv{margin-inline-start:auto;color:var(--text)}

.M .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.M .chips button{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 6px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:14px;font-weight:700}
.M .chips img{width:30px;height:30px;border-radius:50%;object-fit:cover}

/* الكبسولة العائمة (من ١) + المؤشّر المتمدّد النابض (من ٢) */
.M .bar{position:absolute;bottom:16px;inset-inline:14px;z-index:25;height:64px;border-radius:999px;background:var(--bar);box-shadow:var(--bar-shadow);display:flex;align-items:center;justify-content:space-between;padding:0 7px;transition:all .45s var(--spring)}
.M .bar button{height:50px;min-width:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;color:var(--muted);font-weight:800;font-size:13.5px;transition:all .45s var(--spring)}
.M .bar button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .45s var(--spring)}
.M .bar button.on{background:var(--primary);color:var(--onP);padding:0 16px}
.M .bar button.on span{max-width:80px}
.M .bar.min{inset-inline-end:calc(100% - 78px);padding:0 7px}
.M .bar.min button:not(.on){display:none}
.M .bar.min button.on{padding:0;width:50px}
.M .bar.min button.on span{max-width:0}

/* المقالات */
.M .sfield{margin:10px 16px 0;height:50px;border-radius:999px;background:var(--s2);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted);font-size:15px}
.M .rt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 0}
.M .rt button{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px;white-space:nowrap}
.M .rt button small{font-weight:600;opacity:.9}

/* صفحة المقال: صورة غامرة (١) + قارئ بلا إطار (٣) + أفعال كبسولة (١) بزرّ اسمع أخضر (٢) */
#m-art .statusbar{color:#fff;transition:color .2s}
#m-art.scrolled .statusbar{color:var(--text)}
.M .ahero{position:relative;height:400px}
.M .ahero img{width:100%;height:100%;object-fit:cover}
.M .ahero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 30%)}
.M .atop{position:absolute;top:42px;inset-inline:14px;z-index:22;display:flex;gap:8px;transition:opacity .2s}
.M .atop .gap{flex:1}
.M .atop .ib{background:rgba(255,255,255,.9);color:#0E065A;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.M .rhead{position:absolute;top:0;inset-inline:0;z-index:23;height:82px;padding:36px 10px 0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
#m-art.scrolled .rhead{opacity:1;transform:none;pointer-events:auto}
#m-art.scrolled .atop{opacity:0;pointer-events:none}
.M .rhead .ib{background:transparent}
.M .rhead .left{font-size:12.5px;color:var(--muted);flex:1}
.M .rprog{position:absolute;bottom:-1px;inset-inline:0;height:2.5px}
.M .rprog i{display:block;height:100%;width:0;background:var(--accent)}
.M .sheet{position:relative;margin-top:-32px;background:var(--bg);border-radius:30px 30px 0 0;padding:22px 20px 140px;z-index:3}
.M .sheet h1{font-size:26px;font-weight:900;line-height:1.55;margin-top:8px}
.M .by{display:flex;align-items:center;gap:10px;margin-top:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.M .by img{width:42px;height:42px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--line)}
.M .by b{font-size:14.5px;display:flex;gap:4px;align-items:center}.M .by b svg{color:var(--primary)}
.M .by small{display:block;font-size:12.5px;color:var(--muted)}
.M .by .fol{margin-inline-start:auto;height:38px;padding:0 18px;border-radius:999px;background:var(--primary);color:var(--onP);font-weight:800;font-size:14px}
.M .sheet p{font-size:var(--fs,18px);line-height:2.05;margin-top:18px}
.M .sk{height:12px;border-radius:6px;background:var(--line);margin-top:16px}.M .sk.s{width:62%}
.M .sk-cap{font-size:12px;color:var(--muted);margin-top:16px}
.M .next{margin-top:30px;padding:14px;border-radius:22px;background:var(--s2);display:flex;gap:12px;align-items:center}
.M .next img{width:68px;height:68px;border-radius:16px;object-fit:cover}
.M .next small{font-size:12px;color:var(--accent);font-weight:800}
.M .next b{display:block;font-size:14.5px;line-height:1.55;margin-top:2px}
.M .acts{position:absolute;bottom:16px;inset-inline:16px;z-index:25;height:64px;border-radius:999px;background:var(--bar);box-shadow:var(--bar-shadow);display:flex;align-items:center;gap:2px;padding:0 7px;transition:transform .35s var(--spring)}
.M .acts.hide{transform:translateY(130%)}
.M .acts button.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.M .acts .listen{flex:1;height:50px;border-radius:999px;background:var(--listen);color:var(--onListen);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:15px;white-space:nowrap}
.M .acts .listen small{font-weight:600;opacity:.9}
.M .aa{position:absolute;top:86px;left:12px;z-index:30;width:244px;padding:14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);box-shadow:0 18px 40px -12px rgba(0,0,0,.35);display:none}
.M .aa.on{display:block}
.M .aa .row{display:flex;align-items:center;gap:10px}
.M .aa .row button{width:40px;height:40px;border-radius:12px;background:var(--s2);font-weight:900}
.M .aa input{flex:1;accent-color:var(--primary)}
.M .aa .bgs{display:flex;gap:8px;margin-top:12px}
.M .aa .bgs button{flex:1;height:40px;border-radius:12px;font-size:13px;font-weight:800;border:1.5px solid var(--line)}
.M .spacer{height:110px}

/* صفحة الشريك — بعين اللي يدوّر على علاج: مَن أنت ← هل أثق بك ← الدليل ← كيف أتواصل */
#m-partner .statusbar{color:#fff}
#m-partner.scrolled .statusbar{color:var(--text)}
.M .phero{position:relative;height:236px;background:#0E065A}
.M .phero img{width:100%;height:100%;object-fit:cover}
.M .phero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 35%,transparent 60%,rgba(0,0,0,.35))}
.M .phero .gcount{position:absolute;bottom:44px;left:14px;z-index:2;height:30px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:5px}
.M .ptop{position:absolute;top:42px;inset-inline:14px;z-index:22;display:flex;gap:8px;transition:opacity .2s}
.M .ptop .gap{flex:1}
.M .ptop .ib{background:rgba(255,255,255,.92);color:#0E065A;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#m-partner.scrolled .ptop{opacity:0;pointer-events:none}
#m-partner .mini .ib{background:transparent}
.M .pbody{position:relative;margin-top:-28px;background:var(--bg);border-radius:28px 28px 0 0;padding:0 16px;z-index:3}
.M .pid2{display:flex;gap:12px;align-items:flex-end}
.M .pid2 .plogo{width:84px;height:84px;margin-top:-30px;border-radius:28px 28px 28px 10px;background:#fff;border:4px solid var(--bg);object-fit:contain;padding:6px;box-shadow:0 8px 20px -8px rgba(14,6,90,.35);flex:0 0 auto}
.M .pid2 .kick{color:var(--accent);font-size:12.5px;padding-bottom:4px}
.M .pname2{font-size:22px;font-weight:900;line-height:1.45;margin-top:10px}
.M .pname2 svg{color:var(--primary);vertical-align:-3px;margin-inline-start:4px}
.M .pslogan2{font-size:14.5px;color:var(--muted);margin-top:2px}
.M .pfacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.M .pfacts span{height:30px;padding:0 11px;border-radius:999px;background:var(--s2);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.M .pmain{display:flex;gap:8px;margin-top:14px}
.M .pmain .book{flex:1;height:52px;border-radius:999px;background:var(--primary);color:var(--onP);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.M .pmain .sq{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.M .pmain .wa{background:#25D366;color:#06301A}
.M .pmain .call{background:var(--s2);color:var(--text)}
.M .ptrust{margin-top:14px;padding:12px;border-radius:22px;background:var(--s1);border:1px solid var(--line)}
.M .ptrust .creds{display:flex;flex-wrap:wrap;gap:6px}
.M .ptrust .creds span{height:28px;padding:0 10px;border-radius:999px;background:#C6F2F1;color:#00403F;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
:root[data-theme="dark"] .M .ptrust .creds span{background:#00393A;color:#8AF3F2}
.M .ptrust .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.M .ptrust .nums div{padding:10px;border-radius:16px;background:var(--s2)}
.M .ptrust .nums b{display:block;font-size:17px;font-weight:900;line-height:1.35}
.M .ptrust .nums small{font-size:12px;color:var(--muted)}
.M .ptrust .src{font-size:11px;color:var(--muted);margin-top:6px}
.M .ptabs{position:sticky;top:82px;z-index:6;background:var(--bg);display:flex;gap:20px;padding:12px 16px 0;margin:14px -16px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.M .ptabs::-webkit-scrollbar{display:none}
.M .ptabs button{flex:0 0 auto;position:relative;height:40px;font-size:14.5px;font-weight:700;color:var(--muted)}
.M .ptabs button small{font-weight:600;opacity:.8}
.M .ptabs button.on{color:var(--text)}
.M .ptabs button.on::after{content:"";position:absolute;bottom:-1px;inset-inline:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.M .psec{display:flex;align-items:baseline;justify-content:space-between;padding:22px 0 10px}
.M .psec h3{font-size:18px;font-weight:900}
.M .psec a{font-size:13.5px;font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:2px}
.M .pabout2{font-size:15px;line-height:1.95;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.M .rmore{margin-top:4px;font-weight:800;font-size:14px;color:var(--primary)}
.M .svcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.M .svcs div{border-radius:18px;background:var(--s1);border:1px solid var(--line);padding:12px 8px;text-align:center;font-size:13.5px;font-weight:800;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:6px}
.M .svcs div span{width:36px;height:36px;border-radius:12px;background:var(--pc);color:var(--primary);display:grid;place-items:center}
.M .preels{display:flex;gap:10px}
.M .preels .hreel{flex:0 0 122px}
.M .gal2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.M .gal2 div{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
.M .gal2 div:first-child{grid-column:span 2;border-radius:22px 22px 22px 8px}
.M .gal2 img{width:100%;height:100%;object-fit:cover}
.M .gal2 .more2{position:absolute;inset:0;background:rgba(14,6,90,.6);color:#fff;font-weight:900;font-size:18px;display:grid;place-items:center}
.M .pposts .it{padding:14px 0}
.M .faq{border-radius:22px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.M .faq details{border-bottom:1px solid var(--line)}
.M .faq details:last-child{border:0}
.M .faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px;font-size:15px;font-weight:800;line-height:1.6}
.M .faq summary::-webkit-details-marker{display:none}
.M .faq summary svg{margin-inline-start:auto;flex:0 0 auto;color:var(--muted);transition:transform .3s var(--spring)}
.M .faq details[open] summary svg{transform:rotate(180deg)}
.M .faq p{padding:0 14px 14px;font-size:14.5px;line-height:1.95;color:var(--muted)}
.M .allfaq{display:block;width:100%;margin-top:8px;height:46px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:14px}
.M .ploc{border-radius:22px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.M .ploc .r{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}

.M .ploc .r small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.M .ploc .r .act{margin-inline-start:auto;height:34px;padding:0 12px;border-radius:999px;background:var(--s2);font-size:12.5px;font-weight:800;white-space:nowrap}
.M .socials{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.M .socials span{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;display:inline-flex;align-items:center}
.M .pcta{position:absolute;bottom:16px;inset-inline:16px;z-index:25;height:64px;border-radius:999px;background:var(--bar);box-shadow:var(--bar-shadow);display:flex;align-items:center;gap:6px;padding:0 7px;transform:translateY(140%);transition:transform .35s var(--spring)}
.M .pcta.show{transform:none}
.M .pcta .book{flex:1;height:50px;border-radius:999px;background:var(--primary);color:var(--onP);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:15px}
.M .pcta .sq{width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.M .pcta .wa{background:#25D366;color:#06301A}
.M .pcta .call{background:var(--s2);color:var(--text)}
/* دليل الشركاء — بعين القارئ اللي يدوّر على مقدّم خدمة: ابحث · اختر مجالك · قارن بما يهمّك (التخصّص · المدينة · الخبرة · الاعتماد) · راسل مباشرة */
.M .dsearch{margin:12px 16px 0;height:52px;border-radius:999px;background:var(--s1);border:1.5px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--muted);font-size:15px;box-shadow:0 6px 18px -12px rgba(14,6,90,.35)}
.M .need{position:sticky;top:82px;z-index:6;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.M .need::-webkit-scrollbar{display:none}
.M .need button{flex:0 0 auto;height:40px;padding:0 16px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.M .need button small{color:var(--muted);font-weight:600}
.M .need button.on{background:var(--text);color:var(--bg);border-color:transparent}
.M .need button.on small{color:inherit;opacity:.75}
.M .fst{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 4px;scrollbar-width:none}
.M .fst::-webkit-scrollbar{display:none}
.M .fst .st{flex:0 0 70px}
.M .fst .ring{background:conic-gradient(#F59F0A,#FDE68A,#F59F0A)}
.M .fst .ring img{background:#fff;object-fit:contain;padding:6px}
.M .fst .st span{color:var(--text);font-weight:700}
.M .sortln{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 6px;font-size:13px;color:var(--muted)}
.M .sortln b{color:var(--text);font-weight:800}
.M .sortln button{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:999px;background:var(--s2);font-weight:800;color:var(--text);font-size:13px}
.M .pc{margin:0 16px 12px;padding:14px;border-radius:24px;background:var(--s1);border:1px solid var(--line)}
.M .pc.ft{border:1.5px solid #F59F0A;box-shadow:0 10px 24px -16px rgba(245,159,10,.6)}
.M .pc .top{display:flex;gap:12px;align-items:flex-start}
.M .pc .top>img{width:60px;height:60px;border-radius:20px 20px 20px 8px;background:#fff;border:1px solid var(--line);object-fit:contain;padding:5px;flex:0 0 auto}
.M .pc .nm{flex:1;min-width:0}
.M .pc .kick{color:var(--accent);font-size:12px;display:flex;justify-content:space-between}
.M .pc .kick em{font-style:normal;color:#B26A00;display:inline-flex;align-items:center;gap:3px}
:root[data-theme="dark"] .M .pc .kick em{color:#F6AE31}
.M .pc h4{font-size:15.5px;font-weight:900;line-height:1.5;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.M .pc h4 svg{color:var(--primary);vertical-align:-3px;margin-inline-start:3px}
.M .pc .desc{font-size:13.5px;line-height:1.8;color:var(--muted);margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.M .pc .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.M .pc .facts span{height:28px;padding:0 10px;border-radius:999px;background:var(--s2);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.M .pc .facts .cr{background:#C6F2F1;color:#00403F}
:root[data-theme="dark"] .M .pc .facts .cr{background:#00393A;color:#8AF3F2}
.M .pc .acts2{display:flex;gap:8px;margin-top:12px}
.M .pc .acts2 .wa{flex:1;height:44px;border-radius:999px;background:#25D366;color:#06301A;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.M .pc .acts2 .pg{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.M .join{margin:20px 16px 0;padding:18px;border-radius:28px 28px 28px 10px;background:linear-gradient(135deg,#0E065A,#3030FF);color:#fff}
.M .join b{font-size:19px;font-weight:900;display:block}
.M .join p{font-size:13.5px;line-height:1.8;opacity:.9;margin-top:4px}
.M .join button{margin-top:12px;height:44px;padding:0 20px;border-radius:999px;background:#00D8D8;color:#0E065A;font-weight:900;font-size:14.5px}
.M .more{display:block;margin:4px 16px 0;height:48px;width:calc(100% - 32px);border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:14.5px}

.theme-fab{position:fixed;top:14px;left:14px;z-index:99;height:38px;padding:0 14px;border-radius:999px;background:var(--pg-card);border:1px solid var(--pg-line);font-size:13px;font-weight:700}
body{padding-top:20px}
/* الطلّات: بطاقات طولية ٩:١٦ — الدائرة للهوية (شريك)، والبطاقة للمحتوى (طلّة) */
.M .hreels{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;scrollbar-width:none}
.M .hreels::-webkit-scrollbar{display:none}
.M .hreel{position:relative;flex:0 0 122px;height:204px;border-radius:20px;overflow:hidden;scroll-snap-align:start;background:#1a1a1f;color:#fff}
.M .hreel .th{width:100%;height:100%;object-fit:cover}
.M .hreel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 28%,transparent 45%,rgba(0,0,0,.85))}
.M .hreel .dur{position:absolute;top:8px;right:8px;z-index:2;height:24px;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.55);font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:4px;direction:ltr}
.M .hreel .in{position:absolute;inset-inline:9px;bottom:9px;z-index:2}
.M .hreel .in b{font-size:12.5px;font-weight:800;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.M .hreel .by{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden}
.M .hreel .by img{width:18px;height:18px;border-radius:50%;background:#fff;object-fit:cover;flex:0 0 auto}
.M .hreel.all{background:var(--s2);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px}
.M .hreel.all::after{display:none}
/* الاستماع داخل المقال: أيقونة على البطاقة · الزرّ يصير مشغّلاً · مشغّل صغير فوق الشريط */
.M .it .thumb{position:relative;flex:0 0 auto}
.M .it .thumb img{width:96px;height:96px;border-radius:18px;object-fit:cover;display:block}
.M .it .aud{position:absolute;bottom:6px;left:6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--listen);color:var(--onListen);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.M .acts .player{display:none;flex:1;align-items:center;gap:8px;min-width:0}
.M .acts.playing .ic,.M .acts.playing .listen{display:none}
.M .acts.playing .player{display:flex}
.M .acts.playing .player .ic{display:grid}
.M .pp{width:44px;height:44px;border-radius:50%;background:var(--listen);color:var(--onListen);display:grid;place-items:center;flex:0 0 auto}
.M .pt{flex:1;min-width:0}
.M .pt b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.M .pt small{font-size:11.5px;color:var(--muted)}
.M .pbar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.M .pbar i{display:block;height:100%;width:22%;background:var(--listen);border-radius:4px}
.M .mplayer{position:absolute;bottom:90px;inset-inline:14px;z-index:24;height:60px;border-radius:20px;background:var(--bar);box-shadow:var(--bar-shadow);display:flex;align-items:center;gap:10px;padding:0 8px;overflow:hidden}
.M .mplayer img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.M .mplayer .pp{width:40px;height:40px}
.M .mplayer .pbar{position:absolute;bottom:0;inset-inline:0;height:3px;margin:0;border-radius:0}
/* «مدونتي» جزيرة مستقلّة بجانب الكبسولة */
.M .bar{inset-inline-end:82px;padding:0 5px}
.M .bar button{min-width:44px;padding:0 8px;gap:5px;font-size:12.5px}
.M .bar button.on{padding:0 12px}
.M .bar button.on span{max-width:70px}
.M .mdn{position:absolute;bottom:18px;inset-inline-end:14px;z-index:25;width:60px;height:60px;border-radius:50%;background:var(--bar);box-shadow:var(--bar-shadow);display:grid;place-items:center;padding:0}
.M .mdn img{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#fff;box-shadow:0 0 0 2px #00D8D8}
.M .mdn.on img{box-shadow:0 0 0 3px #3030FF}
.M .bar.min{inset-inline-end:calc(100% - 78px);padding:0 7px}

.M .ilead{margin:14px 16px 0;padding:16px;border-radius:30px 30px 30px 10px;background:linear-gradient(160deg,#E8E8FF,#C6F2F1);color:#0E065A;display:flex;flex-direction:column;gap:10px}

.M .ilead h3{font-size:22px;font-weight:900;line-height:1.35}
.M .ilead .cnt{font-size:14px;font-weight:800;margin-top:2px}

:root[data-theme="dark"] .M .ilead .go2{background:#fff;color:#0E065A}
.M .igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.M .itile{border-radius:24px;background:var(--s1);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}

.M .itile .logos{margin-top:4px}
.M .itile .logos img{width:24px;height:24px}
.M .allp{margin:14px 16px 0;height:56px;border-radius:20px;background:var(--s2);display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:800;font-size:15px}
.M .allp span.c{margin-inline-start:auto;color:var(--muted);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:2px}
.M .big .back{margin-inline-end:4px}
/* صفحة المستخدم: اللي يرجع له القارئ (المحفوظ · المتابَعون · الحجوزات · الإشعارات) فوق، والباقي مطويّ */
.M .uhead{padding:44px 16px 0;display:flex;align-items:center;gap:12px}

.M .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 0}
.M .q{border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:6px;min-height:112px;position:relative}

.M .q1{background:#E8E8FF;color:#0E065A}.M .q2{background:#C6F2F1;color:#00403F}.M .q3{background:#FFE2BC;color:#5C2E00}.M .q4{background:var(--s2);color:var(--text)}
:root[data-theme="dark"] .M .q1{background:#2A2A66;color:#E2E3FF}
:root[data-theme="dark"] .M .q2{background:#00393A;color:#8AF3F2}
:root[data-theme="dark"] .M .q3{background:#3F2B06;color:#FFCF85}
:root[data-theme="dark"] .M .q .ic{background:rgba(255,255,255,.1)}
.M .q3 .st2{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:2px}
.M .saved{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.M .saved::-webkit-scrollbar{display:none}
.M .sv2{flex:0 0 200px;border-radius:20px;overflow:hidden;background:var(--s1);border:1px solid var(--line)}
.M .sv2 img{width:100%;aspect-ratio:16/10;object-fit:cover}
.M .sv2 b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:800;line-height:1.55;margin:8px 10px 10px}
.M .folw{display:flex;gap:14px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.M .folw::-webkit-scrollbar{display:none}

.M .folw .ring img{background:#fff;object-fit:contain;padding:5px}

.M .grp{margin:0 16px;border-radius:22px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.M .grp .r{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}

.M .seg2{margin-inline-start:auto;display:flex;padding:3px;border-radius:999px;background:var(--s2)}
.M .seg2 button{height:32px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--muted)}
.M .seg2 button.on{background:var(--s1);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.M .grp .r.danger{color:#B4241A}
:root[data-theme="dark"] .M .grp .r.danger{color:#FF7272}
.M .grp .r.danger .ic{background:#FFE4E1;color:#B4241A}
:root[data-theme="dark"] .M .grp .r.danger .ic{background:#3D1715;color:#FF7272}
.M .uhd-av{position:relative;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#3030FF,#00D8D8);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}

.M .uhd-av::after{content:"";position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;background:#B4241A;border:2px solid var(--bg)}

#m-brand .statusbar{color:#fff}
#m-brand.scrolled .statusbar{color:var(--text)}

    b.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === t)); });
  scr.querySelectorAll('.utabs,.need').forEach(n => n.addEventListener('click', e => { const t = e.target.closest('button'); if (!t) return;
    n.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === t)); }));
});
const PL_ = document.getElementById('m-art');
PL_.querySelector('[data-listen]').addEventListener('click', () => PL_.querySelector('[data-acts]').classList.add('playing'));
PL_.querySelector('[data-close]').addEventListener('click', () => PL_.querySelector('[data-acts]').classList.remove('playing'));
const A = document.getElementById('m-art'), panel = A.querySelector('[data-aa-panel]'), rd = A.querySelector('[data-rd]'), range = A.querySelector('[data-range]');
A.querySelectorAll('[data-aa]').forEach(x => x.addEventListener('click', () => panel.classList.toggle('on')));
const setFs = v => { range.value = v; rd.style.setProperty('--fs', v + 'px'); };
range.addEventListener('input', () => setFs(range.value));
A.querySelectorAll('[data-sz]').forEach(x => x.addEventListener('click', () => setFs(+range.value + +x.dataset.sz)));
A.querySelectorAll('[data-bg]').forEach(x => x.addEventListener('click', () => {
  const v = { light: ['#FAF9F6', '#0E065A'], paper: ['#F4ECD8', '#3B2F1E'], dark: ['#0F0F12', '#EDEDF0'] }[x.dataset.bg];
  A.style.setProperty('--bg', v[0]); A.style.setProperty('--text', v[1]);
}));
themeToggle(false);
// ?only=<id> يعرض جوالاً واحداً (لتصدير الصور)
{ const only = new URLSearchParams(location.search).get('only'); if (only) { document.querySelectorAll('.phone-wrap').forEach(w => { if (!w.querySelector('#' + only)) w.remove(); }); document.querySelectorAll('.theme-fab,.phone-cap').forEach(e => e.remove()); document.body.style.padding = '8px'; } }
</script>
